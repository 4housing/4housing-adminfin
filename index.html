<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4housing — Administración y Finanzas</title>
<meta name="theme-color" content="#5f7a4e">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Mismo sistema visual que 4housing-compras (y EERR): paleta oliva, Archivo/Quicksand, sidebar oscuro,
   topbar blanca, cards, tablas .grid, badges y modales. Valores copiados de Compras: si allá cambian, cambiar acá. */
:root{
  --olive:#9db98b; --olive-deep:#5f7a4e; --olive-soft:#b8cdac; --olive-ink:#37432c;
  --cream:#f4f2ea; --paper:#ffffff; --ink:#2b2b26; --muted:#94917f;
  --line:#e2dfd4; --line-strong:#d3d0c4; --chip:#eceadf; --bg:#eceae1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:var(--olive-deep);}

/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh;}
.app[hidden]{display:none;}
.side{width:210px;flex:none;background:#2f3a26;color:#e7ecdf;display:flex;flex-direction:column;padding:18px 13px;position:sticky;top:0;height:100vh;}
.side .brand{color:#fff;font-family:'Quicksand',sans-serif;font-weight:700;font-size:17px;letter-spacing:.02em;line-height:22px;padding:0 6px 4px;}
.side .brand-sub{color:#9fb08c;font-size:11px;font-weight:600;padding:0 6px 14px;letter-spacing:.02em;}
.nav-group-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7e8a6c;font-weight:700;padding:14px 13px 5px;}
.navbtn{display:flex;align-items:center;gap:9px;background:none;border:none;color:#cdd6bf;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;text-align:left;letter-spacing:.01em;transition:.15s;width:100%;}
.navbtn svg{width:17px;height:17px;flex:none;}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff;}
.navbtn.active{background:var(--olive);color:var(--olive-ink);}
.side .sp{flex:1;}
.side .data-actions .lbl{font-size:10px;letter-spacing:.16em;color:#9fb08c;font-weight:700;margin-bottom:2px;padding:0 4px;}
.minib{background:rgba(255,255,255,.08);border:none;color:#dfe7d3;padding:9px 11px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;}
.minib svg{width:15px;height:15px;}
.minib:hover{background:rgba(255,255,255,.16);}
.autosave{font-size:10px;color:#8fa07c;text-align:center;margin-top:8px;word-break:break-all;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:14px;}
.topbar h1{margin:0;font-size:18px;font-weight:700;}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
#topActions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.content{padding:18px 22px 48px;flex:1;}

/* ===== BOTONES ===== */
.btn{background:var(--olive-deep);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1;min-height:36px;}
.btn svg{width:15px;height:15px;}
.btn:hover{background:#536a44;}
.btn:disabled{opacity:.6;cursor:default;}
.btn.ghost{background:#fff;color:var(--olive-deep);border:1px solid var(--line-strong);}
.btn.ghost:hover{background:var(--cream);}
.btn.sm{padding:6px 10px;min-height:30px;font-size:11.5px;border-radius:8px;}

/* ===== PESTAÑAS ===== */
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.mtab{background:none;border:none;padding:9px 13px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
.mtab:hover{color:var(--olive-deep);}
.mtab.active{color:var(--olive-deep);border-bottom-color:var(--olive-deep);}
.meta-bar{font-size:11.5px;color:var(--muted);margin:-6px 0 12px;line-height:1.6;}
.meta-bar strong{color:var(--ink);}

/* ===== CARD + TABLA ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.card-h{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.card-h h3{margin:0;font-size:13.5px;font-weight:700;white-space:nowrap;}
.card-h .meta{font-size:11px;color:var(--muted);font-weight:600;}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;}
.tools input[type=search]{flex:1;min-width:220px;max-width:420px;border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;font-size:13px;background:#fbfaf4;color:var(--ink);}
.tools input[type=search]:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px rgba(124,138,87,.18);background:#fff;}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0;}
.chips .mtab{font-size:11.5px;padding:5px 10px;}
table.grid{width:100%;border-collapse:collapse;}
table.grid th{text-align:center!important;vertical-align:middle!important;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:7px 12px;border-bottom:1px solid var(--line);background:#faf9f4;white-space:nowrap;position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--line);}
table.grid td{padding:7px 12px;border-bottom:1px solid var(--line);font-size:10.5px;vertical-align:middle;}
table.grid td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
table.grid tbody tr:last-child td{border-bottom:none;}
table.grid tbody tr:hover{background:#fbfaf3;}
table.grid tfoot td{padding:7px 12px;border-top:2px solid var(--line-strong);background:#faf9f4;font-size:10.5px;}
table.grid th .col-resizer{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:3;}
table.grid th .col-resizer:hover,table.grid th .col-resizer.active{background:rgba(95,122,78,.25);}
table.grid.grid-fixed{table-layout:fixed;}
table.grid.grid-fixed th{white-space:normal!important;line-height:1.3;}
table.grid.grid-fixed td{overflow:hidden;text-overflow:ellipsis;}
.tbl-hscroll{overflow:auto;max-height:70vh;max-width:100%;}
.xlfbtn{border:none;background:none;cursor:pointer;padding:0 2px;font-size:11px;color:var(--muted);}
.xlfbtn.on{color:var(--olive-deep);}
.iconbtn{background:none;border:1px solid var(--line-strong);border-radius:7px;padding:4px 6px;color:var(--muted);display:inline-flex;vertical-align:middle;}
.iconbtn svg{width:14px;height:14px;}
.iconbtn:hover{color:var(--olive-deep);border-color:var(--olive);}
.empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:13px;}
.muted{color:var(--muted);font-size:10.5px;}
a.lnk{color:var(--olive-deep);font-weight:600;text-decoration:none;}
a.lnk:hover{text-decoration:underline;}

/* Filtro tipo Excel por columna (mismo look que xlfOpen de Compras) */
.fpop{position:absolute;z-index:9999;background:#fff;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:8px;min-width:210px;max-width:300px;font-size:12.5px;}
.fpop input[type=text],.fpop input[type=date]{width:100%;border:1px solid var(--line-strong);border-radius:7px;padding:6px 8px;margin-bottom:6px;font-size:12.5px;}
.fpop .flist{max-height:220px;overflow:auto;}
.fpop label{display:flex;gap:6px;align-items:center;padding:3px 4px;cursor:pointer;}
.fpop .fp-all{font-weight:700;border-bottom:1px solid var(--line);margin-bottom:4px;}
.fpop .fp-h{font-weight:700;margin-bottom:6px;}
.fpop .fp-lbl{display:block;font-size:11px;color:var(--muted);padding:0;}
.fpop .fp-row{display:flex;gap:6px;margin-top:8px;}
.fpop .fp-row .btn{flex:1;}

/* badges de estado (mismos colores que Compras) */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
.b-gris{background:#eef0f2;color:#8a9098;}
.b-azul{background:#e7eef6;color:#4f7099;}
.b-ambar{background:#fbf1e0;color:#b3853a;}
.b-verde{background:#e6f1e3;color:#4f8a53;}
.b-rojo{background:#f6ebea;color:#b0584f;}

/* ===== KPIs (mismos que Compras) ===== */
table.grid[data-tbl="tarf"], table.grid[data-tbl="tarm"]{width:auto;min-width:0;}
table.grid[data-tbl="tarf"] td.wrap, table.grid[data-tbl="tarm"] td.wrap{max-width:300px;min-width:150px;}
table.grid[data-tbl="tarf"] td, table.grid[data-tbl="tarf"] th{padding-left:6px;padding-right:6px;}
.tfecha{cursor:pointer;white-space:nowrap;} .tfecha:hover{text-decoration:underline;}
.tet{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12.5px;}
.tet-q{min-width:92px;}
.tet-v{min-width:40px;color:var(--muted);}
.tet-v.warn{color:#b0584f;font-weight:600;}
select.tst-hecha{background:#e6f1e3;color:#3f6f43;} select.tst-en_curso{background:#e7eef6;color:#3f6290;} select.tst-pendiente{background:#fbf1e0;color:#93692a;}
.tgraf{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:900px){ .tgraf{grid-template-columns:1fr;} }
.tbar-row{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;margin:0 0 9px;font-size:12.5px;}
.tbar-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tbar{display:flex;gap:2px;height:14px;background:var(--chip);border-radius:4px;overflow:hidden;}
.tbar span{display:block;min-width:3px;}
.tbar-val{font-size:12px;white-space:nowrap;}
.tleg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted);}
.tleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.thist{display:flex;gap:10px;align-items:flex-end;height:150px;overflow-x:auto;}
.thist-col{flex:0 0 52px;display:flex;flex-direction:column;align-items:center;height:100%;cursor:pointer;}
.thist-v{font-size:11.5px;color:var(--ink);margin-bottom:3px;}
.thist-bar{flex:1;width:26px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line-strong);}
.thist-bar span{display:block;width:100%;background:#3f7f45;border-radius:4px 4px 0 0;opacity:.55;}
.thist-col.sel .thist-bar span{opacity:1;}
.thist-col.sel .thist-l{color:var(--ink);font-weight:600;}
.thist-l{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;}
.kpi-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.kpi-value{font-size:23px;font-weight:700;line-height:1;margin:5px 0 4px;font-variant-numeric:tabular-nums;}
.kpi-sub{font-size:10.5px;color:var(--muted);line-height:1.35;}
.kpi .warn{color:#b3853a;}
.kpi-click{cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.kpi-click:hover{border-color:var(--olive-deep);}
.kpi-click.active{border-color:var(--olive-deep);border-width:2px;box-shadow:0 0 0 3px rgba(107,138,84,.14);}
@media(max-width:900px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:560px){ .kpi-grid{grid-template-columns:1fr;} }
/* Contabilidad UY: filas a revisar (TC pendiente u observaciones) en amarillo */
table.grid tbody tr.revisar td{background:#fdf6dc;}
table.grid tbody tr.revisar:hover td{background:#faefc8;}
table.grid[data-tbl=cuy] td{white-space:nowrap;}
table.grid[data-tbl=cuy] td.wrap{white-space:normal;min-width:200px;}
table.grid td input.tc-in{width:92px;border:1px solid var(--line-strong);border-radius:7px;padding:4px 6px;font-size:11px;text-align:right;background:#fff;font-family:inherit;}
table.grid td input.tc-in.vacio{border-color:#e0ab3f;background:#fffaf0;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.iconbtn.del:hover{color:#b4554e;border-color:#e8cfcc;}
.btn.danger{background:#fff;color:#b4554e;border:1px solid #e8cfcc;}
.btn.danger:hover{background:#fbf0ef;}

/* ===== FORM ===== */
.field{margin-bottom:12px;display:flex;flex-direction:column;}
.field label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;font-size:13px;background:#fbfaf4;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px rgba(124,138,87,.18);background:#fff;}
.field textarea{resize:vertical;min-height:60px;}
.frow{display:grid;gap:14px;}
.frow.c2{grid-template-columns:1fr 1fr;}
.frow.c3{grid-template-columns:1fr 1fr 1fr;}
.frow[hidden]{display:none;}
.frow.c4{grid-template-columns:1fr 1fr 1fr 1fr;}
.frow+.frow{margin-top:12px;}
.chk-lbl{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:22px;}
.frow .field{margin-bottom:0;}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(40,44,32,.5);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow:auto;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 70px rgba(0,0,0,.3);}
.modal.wide{max-width:820px;}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-h h3{margin:0;font-size:17px;font-weight:700;}
.modal-h .x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1;padding:2px 6px;}
.modal-b{padding:18px;}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
.kv{font-size:12.5px;line-height:1.7;}
.box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;background:#faf9f4;}
.box h4{margin:0 0 6px;font-size:12.5px;font-weight:700;}
.box .field{margin:6px 0 0;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px;}
.hist{max-height:220px;overflow:auto;}
.hist div.it{border-bottom:1px solid var(--line);padding:8px 0;font-size:12.5px;}
.err{color:#b3261e;font-size:12px;min-height:1.1em;margin-top:6px;}
.okmsg{color:#4f8a53;font-size:12px;}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#2f3a26;color:#fff;padding:13px 22px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== Pantallas de acceso (mismo cuadro que authScreen de Compras) ===== */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
.gate[hidden]{display:none;}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px 38px;max-width:380px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.10);}
.gate-card .g-brand{font-family:'Quicksand',sans-serif;font-weight:700;font-size:22px;color:var(--olive-ink);margin-bottom:6px;}
.gate-card .g-sub{font-size:13px;color:var(--muted);margin-bottom:26px;}
.gate-card .g-msg{font-size:14px;color:#5f5c52;margin-bottom:22px;line-height:1.5;}
.gate-card .btn{padding:12px 22px;font-size:14px;}

@media(max-width:900px){
  .side{width:64px;padding:16px 8px;}
  .side .brand,.side .brand-sub,.navbtn span,.nav-group-lbl,.minib span,.autosave,.side .data-actions .lbl{display:none;}
  .navbtn,.minib{justify-content:center;}
  .topbar{flex-wrap:wrap;}
}
@media(max-width:560px){ .frow.c2,.frow.c3,.frow.c4{grid-template-columns:1fr;} .content{padding:14px 12px 40px;} .topbar{padding:12px;} .card-h{flex-wrap:wrap;} .card-h h3{white-space:normal;} .meta-bar span{white-space:normal!important;} .tools input[type=search]{min-width:0;} }
</style>
</head>
<body>
<div class="gate" id="gate"><div class="gate-card"><div class="g-brand">4housing</div><div class="g-sub">Administración &amp; Finanzas</div><div class="g-msg">Cargando…</div></div></div>

<div class="app" id="app" hidden>
  <!-- SIDEBAR -->
  <aside class="side">
    <div class="brand">4housing</div>
    <div class="brand-sub">Administración &amp; Finanzas</div>
    <nav id="nav">
      <div class="nav-group-lbl">Finanzas</div>
      <button class="navbtn active" type="button" data-vista="sol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2.5h9l3 3v16h-12z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Compras ↔ Finanzas</span></button>
      <button class="navbtn" type="button" data-vista="cuy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4.5h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17.5a3 3 0 0 1 3-3h11"/><path d="M8 8.5h6M8 11.5h4"/></svg><span>Contabilidad UY</span></button>
      <button class="navbtn" type="button" data-vista="tar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg><span>Tareas asignadas</span></button>
    </nav>
    <div class="sp"></div>
    <div class="data-actions">
      <div class="lbl">Datos</div>
      <button class="minib" id="btn-salir" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Cerrar sesión</span>
      </button>
      <div class="autosave" id="who-nombre">—</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Compras ↔ Finanzas</h1>
        <div class="sub" id="pageSub">Pedidos de Compras a Finanzas e informes de Tango</div>
      </div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="main"><div class="empty">Cargando…</div></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-h"><h3 id="modalTitle"></h3><button class="x" type="button" id="modalX">&times;</button></div>
    <div class="modal-b" id="modalBody"></div>
    <div class="modal-f" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/portal/nav.js" defer></script>
<script>
/* ==========================================================================
   Administración y Finanzas — mismo shell de acceso que el portal y mismo diseño que Compras / EERR.
   Proyecto Supabase compartido (config idéntica al portal y demás apps).
   ========================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://wcpkpwxhqdcdljfwzcmy.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_08decRYdCRUdtO5zogvJVg_VEBCN9pf',
};
const SECTOR = 'adminfin';

const $main = document.getElementById('main');
const $app  = document.getElementById('app');
const $gate = document.getElementById('gate');
let sb = null;

function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

// Pantalla de acceso: mismo cuadro centrado que authScreen() de Compras.
function pantallaAcceso(msg, btn, onClick){
  $app.hidden = true; $gate.hidden = false;
  $gate.innerHTML = '<div class="gate-card"><div class="g-brand">4housing</div><div class="g-sub">Administración &amp; Finanzas</div>'
    + '<div class="g-msg">' + msg + '</div>' + (btn ? '<button class="btn" id="gate-btn" type="button">' + esc(btn) + '</button>' : '') + '</div>';
  if (btn && onClick) document.getElementById('gate-btn').addEventListener('click', onClick);
}

function vistaLogin(){
  pantallaAcceso('Ingresá con tu cuenta de Microsoft de la organización para acceder.', 'Iniciar sesión con Microsoft', async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'azure',
      options: { scopes: 'openid profile email', redirectTo: window.location.origin + window.location.pathname }
    });

// Permisos por sección (pantalla Usuarios del portal → perfiles_sector.permisos, SECCIONES.adminfin de portal/admin.html).
// Mismo criterio que el portal y que public.adminfin_puede_ver / _editar: dirección = todo; sin listas guardadas = ve
// todo salvo "tareas_todas" y edita según el cargo (Solo visión no edita, "editor" solo lo tildado).
const ADMINFIN_SECCIONES = ['solicitudes', 'cuy', 'tareas', 'tareas_todas'];
const VISTA_SECCION = { sol:'solicitudes', cuy:'cuy', tar:'tareas' };
const PERM = { ver:new Set(), editar:new Set() };
function permisosAdminfin(perfil, fila){
  if (perfil.es_direccion) { ADMINFIN_SECCIONES.forEach(x => { PERM.ver.add(x); PERM.editar.add(x); }); return; }
  const pm = (fila && fila.permisos) || {}, cargo = String((fila && fila.cargo) || '').toLowerCase();
  const ver = Array.isArray(pm.ver) ? pm.ver : ADMINFIN_SECCIONES.filter(x => x !== 'tareas_todas');
  const soloVer = ['lector','lectura'].includes(cargo);
  const editar = soloVer ? [] : Array.isArray(pm.editar) ? pm.editar : (cargo === 'editor' ? [] : ADMINFIN_SECCIONES.filter(x => x !== 'tareas_todas'));
  ver.forEach(x => PERM.ver.add(x)); editar.filter(x => PERM.ver.has(x)).forEach(x => PERM.editar.add(x));
}
const puedeVerVista = v => PERM.ver.has(VISTA_SECCION[v]);
function vistaApp(perfil, cargo, fila){
  $gate.hidden = true; $app.hidden = false;
  document.getElementById('who-nombre').textContent = (perfil.nombre || perfil.email || '') + (cargo ? ' · ' + cargo : '');
  permisosAdminfin(perfil, fila);
  SP.uid = perfil.id; SP.yo = perfil.email || '';
  // solo las solapas habilitadas en el portal
  document.querySelectorAll('#nav .navbtn').forEach(b => { b.hidden = !puedeVerVista(b.dataset.vista); });
  const pedida = location.hash === '#contabilidad-uy' ? 'cuy' : location.hash === '#tareas' || location.hash === '#impuestos' ? 'tar' : 'sol';
  if (location.hash === '#impuestos') { TAR.modo = 'lista'; TAR.cat = 'imp'; }   // enlace viejo a la solapa Impuestos
  const v = puedeVerVista(pedida) ? pedida : ['sol', 'cuy', 'tar'].find(puedeVerVista);
  if (!v) { pantallaAcceso('Tu usuario (<b>' + esc(perfil.nombre || perfil.email) + '</b>) tiene acceso a Administración y Finanzas pero ninguna sección habilitada.<br><span style="font-size:12px;color:var(--muted)">Pedile a dirección que te tilde las secciones en la pantalla de Usuarios del portal.</span>', 'Cerrar sesión', salir); return; }
  irVista(v);
  if (PERM.ver.has('solicitudes')) spCargar();
}

/* ---------- Navegación entre solapas del menú lateral ---------- */
let VISTA = 'sol';
const VISTAS = {
  sol: { titulo:'Compras ↔ Finanzas', sub:'Pedidos de pago, facturas sin OC e informes de Tango, compartidos con la app de Compras', hash:'' },
  cuy: { titulo:'Contabilidad UY', sub:'Facturas (CFE) recibidas por Avance Oriental SAS · RUT 220754030013 · montos en pesos uruguayos', hash:'#contabilidad-uy' },
  tar: { titulo:'Tareas asignadas', sub:'Tareas fijas (todos los meses) y puntuales: quién asigna a quién, vencimientos, adjuntos y comentarios', hash:'#tareas' },
};
function irVista(v){
  VISTA = VISTAS[v] && puedeVerVista(v) ? v : (['sol', 'cuy', 'tar'].find(puedeVerVista) || 'sol');
  SP.editar = PERM.editar.has(VISTA_SECCION[VISTA]);   // editar según el tilde de la sección en el portal
  document.querySelectorAll('#nav .navbtn').forEach(b => b.classList.toggle('active', b.dataset.vista === VISTA));
  document.getElementById('pageTitle').textContent = VISTAS[VISTA].titulo;
  document.getElementById('pageSub').textContent = VISTAS[VISTA].sub;
  try { history.replaceState(null, '', location.pathname + location.search + VISTAS[VISTA].hash); } catch(e) {}
  if (VISTA === 'tar') { if (!TAR.cargado) { document.getElementById('topActions').innerHTML = ''; $main.innerHTML = '<div class="empty">Cargando…</div>'; tarCargar(); } else tarRender(); return; }
  if (VISTA === 'cuy' && !CUY.cargado) { document.getElementById('topActions').innerHTML = ''; $main.innerHTML = '<div class="empty">Cargando…</div>'; cuyCargar(); return; }
  spRender();
}
document.querySelectorAll('#nav .navbtn').forEach(b => b.addEventListener('click', () => irVista(b.dataset.vista)));

/* ==========================================================================
   Tareas: quién asigna a quién, fecha, vencimiento, estado, adjuntos y comentarios.
   Tablas: sql/2026-10_tareas.sql (adminfin_tareas, _comentarios, _adjuntos, _supervisores; bucket adminfin-tareas).
   Los supervisores ven todas; el resto, las que le asignaron o las que creó (lo controla la base, RLS).
   ========================================================================== */
const TAR_T = 'adminfin_tareas', TAR_COM_T = 'adminfin_tareas_comentarios', TAR_ADJ_T = 'adminfin_tareas_adjuntos', TAR_BUCKET = 'adminfin-tareas';
const TAR = { cargado:false, err:'', lista:[], com:[], adj:[], usuarios:[], sup:false, vista:null, estado:'abiertas',
  fijas:[], meses:[], errFij:'', modo:'mes', per:'', mesVer:'abiertas', fijLista:'', hist:[], errHist:'', histVer:'eliminada' };
const TAR_HIST_T = 'adminfin_tareas_historial';
const TAR_FIJ_T = 'adminfin_tareas_fijas', TAR_MES_T = 'adminfin_tareas_meses';
const TAR_EST = { pendiente:'Pendiente', en_curso:'En gestión', hecha:'Cumplido' };
const TAR_ALIAS = {   // nombre a mostrar por mail de login (pedido de dirección, oct 2026)
  'administracion@4housing.com.ar': 'Carranza, A.', 'valentinaquiencke@4housing.com.ar': 'Quiencke, V.',
  'facturacion@4housing.com.ar': 'Cittar, S.', 'micaela@4housing.com.ar': 'Seoane, M.', 'proveedores@4housing.com.ar': 'Tesouro, S.' };
const TAR_BADGE = { pendiente:'b-ambar', en_curso:'b-azul', hecha:'b-verde' };
const tarNom = id => { const u = TAR.usuarios.find(x => x.id === id); return u ? (u.nombre || u.email) : (id === SP.uid ? 'Yo' : '—'); };
// etapas: el vencimiento de pago si tiene (impositivos; columnas reg_*: sql/2026-10_tareas_registro.sql) y la tarea
// (cumplida = registrada / conciliada)
const tarEtapas = t => (t.reg_estado ? [{ etapa: 'Vto de pago', estado: t.reg_estado, vencimiento: t.reg_vencimiento, completada_en: t.reg_completada_en, quien: t.reg_responsable || t.asignado_a }] : [])
  .concat([{ etapa: 'Tarea', estado: t.estado, vencimiento: t.vencimiento, completada_en: t.completada_en, fecha: t.fecha_cumplido, quien: t.asignado_a }]);
const tarEsImp = t => /^impuesto/i.test(t.lista || '');
const tarEsPago = (t, campo) => campo === 'reg_estado' || t.lista === 'Proveedores';   // etapa donde "cumplido" = pagado
const tarEstNom = (t, campo, k) => k === 'hecha' ? (tarEsPago(t, campo) ? 'Pagado' : tarEsImp(t) ? 'Registrado' : 'Cumplido') : TAR_EST[k];
const tarEstOpts = (t, campo, v) => Object.keys(TAR_EST).map(k => '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + tarEstNom(t, campo, k) + '</option>').join('');
// Cambia el estado de una etapa; al marcar "Pagado" pide la fecha de pago (propone la de hoy). desdeDetalle: vuelve a abrir la tarea.
async function tarCambiarEstado(id, campo, valor, desdeDetalle){
  const t = TAR.lista.find(x => x.id === id); if (!t) return;
  const pago = tarEsPago(t, campo), cumplido = campo === 'estado' && !tarPasos(t) && !pago && (t.estado !== 'hecha' || valor !== 'hecha');
  const guardar = async fecha => {
    const upd = { [campo]: valor }; if (pago) upd.fecha_pago = valor === 'hecha' ? fecha : null;
    if (cumplido) upd.fecha_cumplido = valor === 'hecha' ? fecha : null;
    const { data, error } = await sb.from(TAR_T).update(upd).eq('id', id).select();
    if (error || !data || !data.length) toast('No se guardó: ' + ((error && error.message) || 'sin permiso'));
    else { TAR.lista[TAR.lista.indexOf(t)] = data[0]; if (cumplido && valor === 'hecha') await tarAvisoFecha(t, 'Cumplido', fecha);
      toast(tarEstNom(data[0], campo, valor) + ((pago || cumplido) && valor === 'hecha' ? ' · ' + fmtCorta(fecha) + (fecha !== hoyISO() ? ' · ⚠ no es la fecha de hoy' : '') : '')); }
    if (desdeDetalle) { tarRender(); tarDetalle(id); } else { cerrarModal(); tarRender(); }
  };
  if (cumplido && valor === 'hecha') return tarPedirCumplido(t, f => guardar(f), () => { if (desdeDetalle) tarDetalle(id); else { cerrarModal(); tarRender(); } });
  if (!(pago && valor === 'hecha')) return guardar();
  abrirModal('Fecha de pago · ' + t.titulo, '<div class="frow"><div class="field"><label>¿Qué día se pagó?</label><input type="date" id="fp-f" value="' + (t.fecha_pago || hoyISO()) + '"></div></div><div class="err" id="fp-err"></div>',
    '<button class="btn ghost" id="fp-no">Cancelar</button><button class="btn" id="fp-ok">Guardar</button>');
  const $ = i => document.getElementById(i);
  $('fp-no').addEventListener('click', () => { if (desdeDetalle) tarDetalle(id); else { cerrarModal(); tarRender(); } });
  $('fp-ok').addEventListener('click', () => { const f = $('fp-f').value; if (!/^20\d\d-\d\d-\d\d$/.test(f)) { $('fp-err').textContent = 'Elegí la fecha.'; return; } $('fp-ok').disabled = true; guardar(f); });
}
const tarHecha = t => t.estado === 'hecha' && (!t.reg_estado || t.reg_estado === 'hecha');
const tarVencida = t => tarEsImp(t) ? impVencido(t) : tarEtapas(t).some(e => e.estado !== 'hecha' && e.vencimiento && String(e.vencimiento) < hoyISO());
const tarResp = t => t.responsable || t.asignado_a;   // responsable: quien responde (no cambia al transferir)
// tareas del mes (con período): solo supervisión las modifica o transfiere; el resto solo cambia el estado (lo controla la base)
const tarPuedeEditar = t => TAR.sup || (!t.periodo && (t.asignado_por === SP.uid || tarResp(t) === SP.uid));
const tarPuedeTransferir = t => tarPuedeEditar(t) || (!t.periodo && t.asignado_a === SP.uid);
async function tarCargar(){
  try {
    const [lista, com, adj, us, sup] = await Promise.all([selTodo(TAR_T, '*', 'id'), selTodo(TAR_COM_T, '*', 'id'), selTodo(TAR_ADJ_T, '*', 'id'),
      sb.rpc('adminfin_tareas_usuarios'), sb.rpc('adminfin_tareas_es_supervisor')]);
    if (us.error) throw us.error; if (sup.error) throw sup.error;
    // nombres a mostrar en Tareas (formato "Apellido, I." como en OGs), por mail de login
    const usuarios = (us.data || []).map(u => Object.assign({}, u, { nombre: TAR_ALIAS[String(u.email || '').toLowerCase()] || u.nombre }))
      .sort((a, b) => String(a.nombre || a.email).localeCompare(String(b.nombre || b.email), 'es'));
    Object.assign(TAR, { lista, com, adj, usuarios, sup: !!sup.data, err:'', cargado:true });
    // tareas fijas mensuales (sql/2026-10_tareas_fijas.sql): si falta correrlo, el resto de Tareas sigue andando
    try { const [fijas, meses] = await Promise.all([selTodo(TAR_FIJ_T, '*', 'orden'), selTodo(TAR_MES_T, '*', 'periodo')]); Object.assign(TAR, { fijas, meses, errFij:'' }); }
    catch (e) { Object.assign(TAR, { fijas:[], meses:[], errFij: e.message || String(e) }); }
    // índice mensual guardado al cerrar cada mes (sql/2026-10_tareas_indice.sql)
    try { TAR.indices = await selTodo('adminfin_tareas_indices', '*', 'id'); TAR.errInd = ''; } catch (e) { TAR.indices = []; TAR.errInd = e.message || String(e); }
    // feriados (sql/2026-10_tareas_vencimientos.sql): para calcular días hábiles
    try { TAR.feriados = await selTodo('adminfin_feriados', '*', 'fecha'); TAR.errFer = ''; } catch (e) { TAR.feriados = []; TAR.errFer = e.message || String(e); }
    // historial (sql/2026-10_tareas_historial.sql): solo supervisión
    if (TAR.sup) { try { TAR.hist = await selTodo(TAR_HIST_T, '*', 'id'); TAR.errHist = ''; } catch (e) { TAR.hist = []; TAR.errHist = e.message || String(e); } }
    if (!TAR.vista) TAR.vista = TAR.sup ? 'todas' : 'mias';
    if (!TAR.cat) TAR.cat = 'cierre';
  } catch (e) { TAR.err = e.message || String(e); TAR.cargado = true; }
  if (VISTA === 'tar') tarRender();
}
// Igual que en Contabilidad UY: al volver a dibujar la MISMA vista (después de guardar un cambio) se mantiene el scroll
// de la página y el de cada tabla; si cambió la solapa / el mes / la lista, arranca desde arriba.
let TAR_VISTA = '';
function tarRender(){
  const vista = [VISTA, TAR.impPer, TAR.cat, TAR.indAgr, TAR.modo, TAR.per, TAR.fijLista, TAR.vista, TAR.estado, TAR.mesVer, TAR.histVer].join('|'), misma = vista === TAR_VISTA;
  const y = window.scrollY, x = window.scrollX, tablas = misma ? [...$main.querySelectorAll('.tbl-hscroll')].map(t => [t.scrollTop, t.scrollLeft]) : [];
  TAR_VISTA = vista;
  tarRender0();
  if (!misma) return;
  $main.querySelectorAll('.tbl-hscroll').forEach((t, i) => { if (tablas[i]) { t.scrollTop = tablas[i][0]; t.scrollLeft = tablas[i][1]; } });
  window.scrollTo(x, y);
}
function tarRender0(){
  const ta = document.getElementById('topActions'); ta.innerHTML = '';
  if (TAR.err) { $main.innerHTML = '<div class="card"><div class="empty">No pude leer las tareas: ' + esc(TAR.err) + '<br><span class="muted">Falta correr sql/2026-10_tareas.sql en Supabase.</span></div></div>'; return; }
  const m = (id, l) => '<button class="mtab' + (TAR.modo === id ? ' active' : '') + '" data-tr-modo="' + id + '">' + l + '</button>';
  const tabs = '<div class="mtabs" style="margin:0 0 14px">' + m('mes', 'Tareas del mes') + m('lista', 'Todas las tareas') + m('fijas', 'Tareas fijas (plantilla)') + m('indice', 'Índice mensual') + (TAR.sup ? m('hist', 'Historial y eliminadas') : '') + m('ayuda', 'Instructivo') + '</div>';
  if (TAR.modo === 'hist' && !TAR.sup) TAR.modo = 'mes';
  if (TAR.modo === 'mes') tarRenderMes(tabs); else if (TAR.modo === 'ayuda') tarRenderAyuda(tabs); else if (TAR.modo === 'indice') tarRenderIndice(tabs); else if (TAR.modo === 'hist') tarRenderHist(tabs); else if (TAR.modo === 'fijas') tarRenderFijas(tabs); else tarRenderLista(tabs);
  $main.querySelectorAll('[data-tr-modo]').forEach(b => b.addEventListener('click', () => { TAR.modo = b.dataset.trModo; tarRender(); }));
}
// Categorías de "Todas las tareas": por lista de la plantilla; lo que no es de ninguna (puntuales, agregadas a mano) = Tareas varias
const TAR_CATS = [['cierre', 'Cierre de mes'], ['imp', 'Impuestos'], ['prov', 'Proveedores'], ['varias', 'Tareas varias']];
const tarCat = t => tarEsImp(t) ? 'imp' : /^cierre/i.test(t.lista || '') ? 'cierre' : /^proveedor/i.test(t.lista || '') ? 'prov' : 'varias';
const TAR_VER = [['todas', 'Todas'], ['mias', 'Las mías (asignadas a mí, responsable o quien paga)'], ['creadas', 'Creadas por mí'], ['resp', 'Delegadas (soy responsable)']];
/* ---------- Pasos con fecha: Impuestos (Presentado / Pagado / Registrado, según lo que requiera cada uno) y
   Proveedores (Registrada / Pagada). Cierre de mes y el resto: estado como siempre.
   Cada paso se marca con la fecha del día; si se carga otra fecha, se avisa y queda un comentario automático. ---------- */
const PASO_TXT = { pres: ['Presentado', 'DDJJ presentada / VEP generado'], pago: ['Pagado', ''], reg: ['Registrado', 'registro contable'] };
const PASO_TXT_PROV = { reg: ['Registrada', 'factura registrada'], pago: ['Pagada', ''] };
// [clave, columna, nombre, aclaración]
function tarPasos(t){
  if (tarEsImp(t)) { const r = impReq(t); return IMP_PASOS.filter(([k]) => r[k]).map(([k, c]) => [k, c, PASO_TXT[k][0], PASO_TXT[k][1]]); }
  if (tarCat(t) === 'prov') return [['reg', 'fecha_registro', ...PASO_TXT_PROV.reg], ['pago', 'fecha_pago', ...PASO_TXT_PROV.pago]];
  return null;
}
const PASO_AVISO = '⚠ Fecha distinta a la del día';
// ¿hay un aviso automático de fecha cambiada para este paso?
const tarPasoAviso = (t, nombre) => TAR.com.some(c => c.tarea_id === t.id && String(c.texto || '').startsWith(PASO_AVISO + ' · ' + nombre + ':'));
// Deja el comentario de auditoría cuando una fecha cargada no es la del día
async function tarAvisoFecha(t, nombre, fecha){
  if (!fecha || fecha === hoyISO()) return;
  const texto = PASO_AVISO + ' · ' + nombre + ': ' + fmtCorta(fecha) + ' (cargado el ' + fmtCorta(hoyISO()) + ' por ' + tarNom(SP.uid) + ').';
  const r = await sb.from(TAR_COM_T).insert({ tarea_id: t.id, texto, autor: SP.uid }).select();
  if (!r.error && r.data) TAR.com.push(r.data[0]);
}
// Cierre de mes y tareas varias: "Cumplido" con fecha (propone la del día; otra fecha → aviso + comentario)
function tarPedirCumplido(t, alGuardar, alCancelar){
  const hoy = hoyISO(), v0 = t.fecha_cumplido || (t.estado === 'hecha' && t.completada_en ? hoyLocal(t.completada_en) : hoy);
  abrirModal('Cumplido · ' + t.titulo, '<div class="frow"><div class="field"><label>¿Qué día se cumplió?</label><input type="date" id="fc-f" value="' + v0 + '" max="' + hoy + '"></div></div>'
    + '<div class="muted" style="font-size:12px">Te propone la fecha de hoy. Si se cumplió otro día, cambiala: queda registrado que se cargó a mano.</div>'
    + '<div class="warn" id="fc-av" style="font-size:12.5px;margin-top:8px"></div><div class="err" id="fc-err"></div>',
    '<button class="btn ghost" id="fc-no">Cancelar</button><button class="btn" id="fc-ok">Guardar</button>');
  const $ = i => document.getElementById(i), av = () => { const f = $('fc-f').value; $('fc-av').textContent = f && f !== hoy ? '⚠ No es la fecha de hoy (' + fmtCorta(hoy) + '): queda un aviso en los comentarios de la tarea.' : ''; };
  $('fc-f').addEventListener('input', av); av();
  $('fc-no').addEventListener('click', alCancelar);
  $('fc-ok').addEventListener('click', () => { const f = $('fc-f').value; if (!/^20\d\d-\d\d-\d\d$/.test(f)) { $('fc-err').textContent = 'Elegí la fecha.'; return; } if (f > hoy) { $('fc-err').textContent = 'No puede ser una fecha futura.'; return; } $('fc-ok').disabled = true; alGuardar(f); });
}
async function tarGuardarCumplido(t, fecha){
  try {
    const { data, error } = await sb.from(TAR_T).update({ fecha_cumplido: fecha }).eq('id', t.id).select();
    if (error) throw error; if (!data || !data.length) throw new Error('sin permiso');
    TAR.lista[TAR.lista.indexOf(t)] = data[0]; await tarAvisoFecha(t, 'Cumplido', fecha);
    toast('Cumplido el ' + fmtCorta(fecha) + (fecha !== hoyISO() ? ' · ⚠ no es la fecha de hoy' : ''));
  } catch (e) { toast('No se guardó: ' + (e.message || e) + (/fecha_cumplido/.test(String(e.message)) ? ' (falta correr sql/2026-10_tareas_fecha_cumplido.sql)' : '')); }
}
// Guarda la fecha de un paso y recalcula la tarea: cumplida con todos los pasos; con alguno, en gestión.
// La etapa de pago (reg_estado, si la tarea la tiene) sigue a la fecha de pago.
async function tarGuardarPaso(t, campo, fecha){
  const pasos = tarPasos(t) || [], paso = pasos.find(p => p[1] === campo); if (!paso) return false;
  const n = Object.assign({}, t, { [campo]: fecha || null });
  const falta = pasos.filter(p => !n[p[1]]), alguna = pasos.some(p => n[p[1]]);
  const upd = { [campo]: fecha || null, estado: !falta.length ? 'hecha' : alguna ? 'en_curso' : 'pendiente' };
  if (t.reg_estado) upd.reg_estado = !pasos.some(p => p[0] === 'pago') || n.fecha_pago ? 'hecha' : 'pendiente';
  try {
    const { data, error } = await sb.from(TAR_T).update(upd).eq('id', t.id).select();
    if (error) throw error; if (!data || !data.length) throw new Error('sin permiso');

/* ---------- Impuestos: las tareas del mes de la lista "Impuestos" (Pago y Registro AGIP, ARBA, Sicore, SUSS, CM, IVA) ----------
   Mismos datos que Tareas (adminfin_tareas). Todos tienen F. de vencimiento (reg_vencimiento: el vto impositivo, para
   presentar o pagar). Cada impuesto requiere Presentación, Pago y/o Registro contable (tildes de la plantilla, copiados
   al mes: req_*; sql/2026-10_impuestos_proveedores.sql). Se carga la fecha de cada paso:
     · pago → reg_estado (la etapa de pago; si no requiere pago, nace resuelta)
     · la tarea (estado) queda cumplida cuando están todas las fechas que requiere; con alguna, "En gestión".
   Borrar una fecha vuelve atrás. Vencimientos y responsables: plantilla (Tareas fijas, lista Impuestos). */
const impNombre = t => String(t.titulo || '').replace(/^pago y registro\s*/i, '') || t.titulo;
// tareas generadas antes de los tildes: pago y registro (como funcionaba)
const impReq = t => ({ pres: t.req_presentacion == null ? false : !!t.req_presentacion, pago: t.req_pago == null ? true : !!t.req_pago, reg: t.req_registro == null ? true : !!t.req_registro });
const IMP_PASOS = [['pres', 'fecha_presentacion', 'Presentación', 'presentar', 'presentado'], ['pago', 'fecha_pago', 'Pago', 'pagar', 'pagado'], ['reg', 'fecha_registro', 'Registro contable', 'registrar', 'registrado']];
const impFaltan = t => { const r = impReq(t); return IMP_PASOS.filter(([k, c]) => r[k] && !t[c]); };
const impVto = t => t.reg_vencimiento || t.vencimiento;   // presentación y pago
// vencido = pasó el vto y falta presentar o pagar, o pasó el plazo del registro (vto + 2 hábiles) y falta registrar
const impVencido = t => { const f = impFaltan(t), hoy = hoyISO(), v = impVto(t);
  return (!!v && String(v) < hoy && f.some(([k]) => k !== 'reg')) || (!!t.vencimiento && String(t.vencimiento) < hoy && f.some(([k]) => k === 'reg')); };
function impSituacion(t){
  const f = impFaltan(t);
  if (!f.length) return ['Completo', 'b-verde'];
  if (impVencido(t)) return ['Vencido · falta ' + f.map(x => x[3]).join(', '), 'b-rojo'];   // (vto o, para el registro, vto + 2 hábiles)
  if (f.length < IMP_PASOS.filter(([k]) => impReq(t)[k]).length) return ['Falta ' + f.map(x => x[3]).join(', '), 'b-azul'];
  return ['Pendiente', 'b-ambar'];
}

// Compara el Excel con la plantilla: { cambios:[{id, titulo, upd, txt}], nuevas:[{fila}], errores:[texto], igual:n }
function tarFijasPlan(rows){
  const plan = { cambios: [], nuevas: [], errores: [], igual: 0 }, txt = v => String(v == null ? '' : v).trim();
  const vistos = new Set();
  rows.forEach((r, i) => {
    const n = i + 2, lista = txt(r['Lista']), titulo = txt(r['Tarea']);
    if (!lista && !titulo && !txt(r['ID'])) return;   // fila vacía
    const err = m => plan.errores.push('Fila ' + n + (titulo ? ' (' + titulo + ')' : '') + ': ' + m);
    const id = txt(r['ID']) ? parseInt(txt(r['ID']), 10) : null, f0 = id ? TAR.fijas.find(f => f.id === id) : null;
    if (id && !f0) return err('el ID ' + id + ' no existe en la plantilla (para una tarea nueva dejá el ID vacío)');
    if (id && vistos.has(id)) return err('el ID ' + id + ' está repetido'); if (id) vistos.add(id);
    if (!lista || !titulo) return err('faltan Lista o Tarea');
    const mail = txt(r['Responsable (mail)']).toLowerCase(), u = TAR.usuarios.find(x => String(x.email || '').toLowerCase() === mail || String(x.nombre || '').toLowerCase() === mail);
    if (!u) return err(mail ? 'no encuentro al responsable «' + mail + '»' : 'falta el responsable');
    const tipoT = txt(r['Vence: tipo (Día / Hábil)']).toLowerCase(), tipo = /h[aá]bil/.test(tipoT) ? 'habil' : /d[ií]a/.test(tipoT) || !tipoT ? 'dia' : null;
    if (!tipo) return err('tipo de vencimiento «' + tipoT + '»: tiene que ser Día o Hábil');
    const dia = parseInt(txt(r['Vence: día o n° de día hábil']), 10);
    if (!(dia >= 1 && dia <= 31)) return err('el día de vencimiento tiene que ser de 1 a 31');
    const mesT = txt(r['Vence: mes (Siguiente / Mismo)']).toLowerCase(), mes = /mism/.test(mesT) ? 0 : /sig/.test(mesT) || !mesT ? 1 : null;
    if (mes == null) return err('mes «' + mesT + '»: tiene que ser Siguiente o Mismo');
    const actT = txt(r['Activa (Sí / No)']).toLowerCase(), activa = !actT ? true : /^(s[ií]|x|1|true)$/.test(actT) ? true : /^(no|0|false)$/.test(actT) ? false : null;
    if (activa == null) return err('Activa «' + actT + '»: tiene que ser Sí o No');
    const veces = txt(r['Veces por mes']) ? parseInt(txt(r['Veces por mes']), 10) : 1;
    if (!(veces >= 1 && veces <= 31)) return err('Veces por mes: de 1 a 31');
    const orden = txt(r['Orden']) !== '' && !isNaN(+txt(r['Orden'])) ? Math.round(+txt(r['Orden'])) : null;
    const fila = { lista, titulo, descripcion: txt(r['Detalle']) || null, responsable: u.id, activa, veces };
    if (orden != null) fila.orden = orden;
    // vencimiento: en Impuestos es el vto del impuesto (campos de pago) y la tarea vence igual (el registro se calcula a +2 hábiles al generar)
    if (/^impuesto/i.test(lista)) Object.assign(fila, { dia_registro: dia, tipo_registro: tipo, mes_registro: mes, dia_vence: dia, tipo_vence: tipo, mes_vence: mes });
    else Object.assign(fila, { dia_vence: dia, tipo_vence: tipo, mes_vence: mes });
    if (!f0) { if (fila.orden == null) fila.orden = Math.max(0, ...TAR.fijas.map(f => f.orden || 0)) + 10 * (plan.nuevas.length + 1); plan.nuevas.push({ fila }); return; }
    const nom = { lista:'lista', titulo:'nombre', descripcion:'detalle', responsable:'responsable', activa:'activa', veces:'veces', orden:'orden' };
    const vtoDe = (o, c) => o[c[0]] ? (o[c[1]] === 'habil' ? o[c[0]] + '° hábil' : 'día ' + o[c[0]]) + ' ' + (+o[c[2]] === 0 ? 'mismo mes' : 'mes sig.') : 'sin vto';
    const upd = {}, cambios = [];
    Object.keys(fila).forEach(k => { const a = f0[k] == null ? null : f0[k], b = fila[k] == null ? null : fila[k];
      if (String(a) !== String(b)) { upd[k] = fila[k]; if (nom[k]) cambios.push(nom[k] + ': ' + (k === 'responsable' ? tarNom(a) + ' → ' + tarNom(b) : k === 'activa' ? (a ? 'sí' : 'no') + ' → ' + (b ? 'sí' : 'no') : (a == null ? '—' : a) + ' → ' + (b == null ? '—' : b))); } });
    const c0 = tarVtoCampos(f0), c1 = tarVtoCampos(fila);
    if (vtoDe(f0, c0) !== vtoDe(fila, c1)) cambios.push('vencimiento: ' + vtoDe(f0, c0) + ' → ' + vtoDe(fila, c1));
    if (Object.keys(upd).length) plan.cambios.push({ id: f0.id, titulo: f0.titulo, upd, txt: cambios.length ? cambios : ['iguala el plazo interno de la tarea al vto (sin cambios a la vista)'] }); else plan.igual++;
  });
  return plan;
}

/* ==========================================================================
   Solicitudes de pago — misma solapa que en la app de Compras (4housing-compras),
   sobre las MISMAS tablas del proyecto wcpk (no hay copia ni sincronización):
     · Pendientes de facturar · Pagos solicitados · Pagos a realizar
   Estados: Compras pide (Pendiente) o cancela (Cancelada); Administración informa En gestión y Pagada.
   Reparto: Compras pide el pago (adjunta la FAC / tilda la factura); Administración sube los 3 informes
   de Tango (Informe OC, Pendientes de facturar, Pagos a realizar) y responde la gestión de cada pedido
   (confirmar lectura, fecha estimada de pago, mensajes). Escritura solo por funciones:
   compras_informe_cargar / compras_pagos_realizar_importar / compras_solpago_adminfin.
   ========================================================================== */
const SP = { editar:false, tab:'solicitudes', filtro:'Pendiente', lista:[], pend:[], pagos:[], oci:[], prov:{}, meta:[], yo:'',
             fs:[], fsErr:'', fsFiltro:'abiertas', compradores:[],
             q:{}, colf:{}, fecha:{}, sort:{}, actual:null, grupos:[] };
const FAC_CARGADA = 'FAC cargada';

const activa = s => s && s.estado !== 'Cancelada';   // un pedido cancelado no bloquea volver a pedir esa factura
// Quién y cuándo, para cada comentario: "usuario · 02/10/2026 11:26"
function cuando(h){
  const d = h && h.fecha ? new Date(h.fecha) : null;
  return esc((h && h.autor) || '') + ' · ' + (d && !isNaN(d) ? d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}) : '');

function fechaPago(s){ return s.fecha_pago || s.fecha_pago_estimada || ''; }
// Columna "Pago": pagada / fecha estimada / fuera del informe
function pagoTxt(s){
  if (s.estado === 'Pagada') return 'Pagada' + (s.fecha_pago ? ' ' + fmtFecha(s.fecha_pago) : '');
  return (s.fecha_pago_estimada ? 'Estimada ' + fmtFecha(s.fecha_pago_estimada) : '—')
    + (s.salio_informe_en ? '<div style="color:#b3853a" title="Ya no figura en Pagos a realizar: se estima pagada, anulada u otro motivo">⚠ fuera del informe ' + fmtFecha(s.salio_informe_en) + '</div>' : '');
}
const ICO = { pdf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v6h6"/></svg>',

const INFORMES = [['oc_informe','Informe OC'], ['pend_facturar','Pendientes de facturar'], ['pagos_realizar','Pagos a realizar']];

function fmtFecha(v){ if(!v) return '—'; const p=String(v).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : String(v); }
function fmtNum(v){ return (+v||0).toLocaleString('es-AR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtMonto(v, mon){ if(v==null || v==='') return '—'; return (mon==='USD'?'US$ ':'$ ') + fmtNum(v); }
// N° de OC de Tango sin punto de venta ni ceros adelante (" 0000100031125" -> "31125"), igual que en Compras.
function nroOC(v){ const t=String(v==null?'':v).trim(); const m=t.match(/^(\d{5})-?(\d{8})$/); return m ? (m[2].replace(/^0+/,'')||'0') : t; }
function fold(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function key(prov, nro){ return String(prov==null?'':prov).trim().toUpperCase() + '|' + String(nro==null?'':nro).trim().toUpperCase(); }
// Misma clave que public.compras_clave_fac(): proveedor + N° sin espacios/guiones, en mayúsculas.
function claveFac(prov, nro){ return String(prov==null?'':prov).replace(/\s/g,'').toUpperCase() + '|' + String(nro==null?'':nro).replace(/[^A-Za-z0-9]/g,'').toUpperCase(); }
function provNombre(cod){ return SP.prov[String(cod||'').trim().toUpperCase()] || ''; }
let _toastT=null;

// Modal con la misma estructura que openModal() de Compras: título / cuerpo / pie con botones
function abrirModal(titulo, cuerpo, pie, ancho){
  document.getElementById('modalTitle').textContent = titulo;
  document.getElementById('modalBody').innerHTML = cuerpo;
  document.getElementById('modalFoot').innerHTML = pie || '';

function cerrarModal(){ document.getElementById('modalBg').classList.remove('open'); SP.actual=null; }
document.getElementById('modalX').addEventListener('click', cerrarModal);
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') cerrarModal(); });

// supabase-js trae de a 1000 filas: paginar (el Informe OC tiene miles)
async function selTodo(tabla, cols, orden){
  let out=[];
  for (let i=0; i<100; i++) {
    let q = sb.from(tabla).select(cols).range(i*1000, i*1000+999);
    if (orden) q = q.order(orden, { ascending:true });
    const { data, error } = await q;
    if (error) throw error;
    out = out.concat(data||[]);
    if (!data || data.length < 1000) break;
  }
  return out;
}

async function spCargar(){
  try {
    const [lista, pend, pagos, oci, prov, meta] = await Promise.all([
      selTodo('compras_solicitudes_pago', '*', 'id'),
      selTodo('compras_pend_facturar', '*', 'id'),
      selTodo('compras_pagos_realizar', '*', 'id'),
      selTodo('compras_oc_informe', 'oc_numero, proveedor_cod, clasif_cod, remito_numero, comprobante_numero, comprador, fecha_emision, estado_oc', 'id'),
      selTodo('compras_proveedores', 'codigo, razon, comercial', 'id'),
      selTodo('compras_informes_meta', '*', null),
    ]);
    SP.lista = lista.reverse(); SP.pend = pend; SP.pagos = pagos; SP.oci = oci; SP.meta = meta;
    SP.prov = {}; prov.forEach(p => { SP.prov[String(p.codigo||'').trim().toUpperCase()] = p.razon || p.comercial || ''; });
  } catch (error) {
    if (VISTA !== 'sol') return;
    $main.innerHTML = '<div class="card"><div class="empty">No pude leer los datos de Compras ↔ Finanzas: ' + esc(error.message)
      + '<br><span class="muted">Si dice "permission denied", falta correr el SQL de habilitación (sql/2026-10_solpago_carga_adminfin.sql del repo 4housing-compras).</span></div></div>';
    return;
  }
  await fsCargar();
  SP.cargado = true;
  if (VISTA === 'sol') spRender();
}

/* ---------- Constancia de los informes ---------- */
// Período que cubre el Informe OC cargado (fecha de emisión de las OC): recordatorio de desde qué fecha exportarlo
// de Tango la próxima vez (cada carga reemplaza la anterior, así que tiene que volver a abarcar todo el período).
function ociPeriodoNota(){
  // Las OC abiertas (Emitida / Autorizada) se guardan aunque sean viejas: el período se mide con las demás
  const fs = SP.oci.filter(r => !ocAbierta(r.estado_oc)).map(r => String(r.fecha_emision || '').slice(0,10)).filter(f => /^\d{4}-\d{2}-\d{2}$/.test(f)).sort();
  if (!fs.length) return '';
  return '<div style="margin-top:6px"><b>📌 Informe OC:</b> trae OC emitidas del <b>' + fmtFecha(fs[0]) + '</b> al ' + fmtFecha(fs[fs.length - 1])
    + ', más las que siguen abiertas de antes (' + new Set(SP.oci.map(r => r.oc_numero)).size + ' OC). Para actualizarlo, exportalo de Tango (puede ser completo) y al cargarlo elegí desde qué fecha guardar: la carga nueva reemplaza a la anterior.</div>';
}
function metaDe(inf){ return SP.meta.find(m => m.informe === inf) || null; }
function metaTxt(inf){
  const m = metaDe(inf); if (!m) return 'todavía no se cargó';
  const t = m.importado_en ? new Date(m.importado_en) : null;
  return 'reporte del ' + fmtFecha(m.fecha_reporte) + ' · subido el ' + (t ? t.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + t.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}) : '—') + (m.importado_por ? ' por ' + m.importado_por : '');
}

/* ---------- Tabla genérica: búsqueda, filtro tipo Excel por columna, rango de fechas, ancho ajustable ---------- */
// cols: { id, t, v(r) → valor de filtro (o null), fecha(r) → 'YYYY-MM-DD' (filtro por rango), td(r) → html, cls }
// Orden: clic en el título (no en ▾ ni en el borde de ajuste). c.s(r) = clave de orden (por defecto c.fecha / c.v).
function tablaOrdenar(ns, cols, rows){
  const o = SP.sort[ns]; const c = o && cols.find(x => x.id === o.col); if (!c) return rows;
  const k = c.s || c.fecha || c.v; if (!k) return rows;
  return rows.slice().sort((a,b) => {
    const x = k(a), y = k(b);
    if (x == null || x === '') return 1; if (y == null || y === '') return -1;   // vacíos siempre al final
    const r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'es', { numeric:true });
    return r * o.dir;
  });
}
function tablaFiltrar(ns, cols, rows, texto){
  return tablaOrdenar(ns, cols, tablaFiltrarSinOrden(ns, cols, rows, texto));
}
function tablaFiltrarSinOrden(ns, cols, rows, texto){
  const q = fold(SP.q[ns] || ''), cf = SP.colf[ns] || {}, fr = SP.fecha[ns] || {};
  return rows.filter(r => (!q || fold(texto(r)).includes(q))
    && cols.every(c => {
      if (c.fecha && fr[c.id]) { const d = c.fecha(r) || ''; if (!d) return false; if (fr[c.id].desde && d < fr[c.id].desde) return false; if (fr[c.id].hasta && d > fr[c.id].hasta) return false; }
      return !c.v || !cf[c.id] || cf[c.id].includes(c.v(r));
    }));
}
function tablaHayFiltros(ns){ return Object.keys(SP.colf[ns]||{}).length > 0 || Object.keys(SP.fecha[ns]||{}).length > 0; }
function tablaHerramientas(ns, placeholder){
  return '<div class="tools"><input type="search" data-q="' + ns + '" placeholder="' + esc(placeholder) + '" value="' + esc(SP.q[ns]||'') + '">'
    + '<span style="margin-left:auto"></span>'
    + (tablaHayFiltros(ns) ? '<button class="btn ghost sm" data-limpiar="' + ns + '">Limpiar filtros</button>' : '')
    + '<button class="btn ghost sm" data-ajustar="' + ns + '">Auto-ajustar columnas</button></div>';
}
// "Ordenar por" visible (además del clic en el título): columnas que se pueden ordenar + sentido
function tablaOrdenHtml(ns, cols){
  const o = SP.sort[ns] || {}, ops = cols.filter(c => c.t && (c.s || c.fecha || c.v));
  return '<span style="font-size:12px;color:var(--muted)">Ordenar por</span><select class="tc-in" style="width:auto;text-align:left" data-ordsel="' + ns + '"><option value="">(como viene)</option>'
    + ops.map(c => '<option value="' + c.id + '"' + (o.col === c.id ? ' selected' : '') + '>' + esc(c.t) + '</option>').join('') + '</select>'
    + (o.col ? '<button class="btn ghost sm" data-orddir="' + ns + '" title="Cambiar el sentido">' + (o.dir === -1 ? '▼ mayor a menor' : '▲ menor a mayor') + '</button>' : '');
}
function tablaHtml(ns, cols, filas, pie, claseFila){
  const on = c => (c.fecha ? !!(SP.fecha[ns]||{})[c.id] : !!(SP.colf[ns]||{})[c.id]);
  const o = SP.sort[ns];
  const th = c => '<th data-col="' + c.id + '"' + ((c.s || c.fecha || c.v) ? ' data-sort="' + ns + '|' + c.id + '" title="Ordenar" style="cursor:pointer"' : '') + '>' + esc(c.t)
    + (o && o.col === c.id ? (o.dir === 1 ? ' ▲' : ' ▼') : '')
    + ((c.v || c.fecha) ? ' <button class="xlfbtn' + (on(c) ? ' on' : '') + '" data-f="' + ns + '|' + c.id + '" title="Filtrar">▾</button>' : '')
    + '<span class="col-resizer"></span></th>';
  return '<div class="tbl-hscroll"><table class="grid" data-tbl="' + ns + '"><thead><tr>' + cols.map(th).join('') + '</tr></thead><tbody>'
    + filas.map(r => { const k = claseFila ? claseFila(r) : '';
        return '<tr' + (k ? ' class="' + k + '"' : '') + '>' + cols.map(c => '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + c.td(r) + '</td>').join('') + '</tr>'; }).join('')
    + '</tbody>' + (pie || '') + '</table></div>';
}
const TABLAS = {};   // ns → { cols, base() } para armar los filtros
function tablaEventos(){
  $main.querySelectorAll('[data-q]').forEach(inp => inp.addEventListener('input', () => {
    const ns = inp.dataset.q, pos = inp.selectionStart; SP.q[ns] = inp.value; spRender();
    const n = $main.querySelector('[data-q="' + ns + '"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch(e) {} }
  }));
  $main.querySelectorAll('[data-limpiar]').forEach(b => b.addEventListener('click', () => { SP.colf[b.dataset.limpiar] = {}; SP.fecha[b.dataset.limpiar] = {}; spRender(); }));
  $main.querySelectorAll('[data-ajustar]').forEach(b => b.addEventListener('click', () => { try { localStorage.removeItem('adminfin:colw:' + b.dataset.ajustar); } catch(e) {} spRender(); }));
  $main.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const [ns, col] = b.dataset.f.split('|'); filtroAbrir(ns, col, b); }));
  $main.querySelectorAll('[data-ordsel]').forEach(se => se.addEventListener('change', () => { const ns = se.dataset.ordsel;
    if (se.value) SP.sort[ns] = { col: se.value, dir: 1 }; else delete SP.sort[ns]; spRender(); }));
  $main.querySelectorAll('[data-orddir]').forEach(b => b.addEventListener('click', () => { const o = SP.sort[b.dataset.orddir]; if (o) { o.dir = -o.dir; spRender(); } }));
  $main.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', e => {
    if (e.target.closest('.xlfbtn, .col-resizer')) return;
    const [ns, col] = th.dataset.sort.split('|'); const o = SP.sort[ns];
    SP.sort[ns] = { col, dir: (o && o.col === col && o.dir === 1) ? -1 : 1 }; spRender();
  }));
  $main.querySelectorAll('table[data-tbl]').forEach(colAnchos);
}
function popCerrar(){ const p = document.getElementById('fpop'); if (p) p.remove(); document.removeEventListener('mousedown', popFuera, true); }
function popFuera(e){ const p = document.getElementById('fpop'); if (p && !p.contains(e.target) && !(e.target.closest && e.target.closest('.xlfbtn'))) popCerrar(); }
function popUbicar(pop, btn){
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect(), vw = document.documentElement.clientWidth;
  pop.style.top = (window.scrollY + r.bottom + 4) + 'px';
  pop.style.left = (window.scrollX + Math.max(8, Math.min(r.left, vw - 310))) + 'px';
  setTimeout(() => document.addEventListener('mousedown', popFuera, true), 0);
}
function filtroAbrir(ns, colId, btn){
  popCerrar();
  const T = TABLAS[ns]; const col = T && T.cols.find(c => c.id === colId); if (!col) return;
  const pop = document.createElement('div'); pop.id = 'fpop'; pop.className = 'fpop';
  if (col.fecha) {
    const cur = (SP.fecha[ns]||{})[colId] || {};
    pop.innerHTML = '<div class="fp-h">Rango de fechas</div>'
      + '<label class="fp-lbl">Desde</label><input type="date" id="fp-d" value="' + esc(cur.desde||'') + '">'
      + '<label class="fp-lbl">Hasta</label><input type="date" id="fp-h" value="' + esc(cur.hasta||'') + '">'
      + '<div class="fp-row"><button class="btn sm" id="fp-ok">Aplicar</button><button class="btn ghost sm" id="fp-clr">Limpiar</button></div>';
    popUbicar(pop, btn);
    pop.querySelector('#fp-ok').addEventListener('click', () => {
      const d = pop.querySelector('#fp-d').value, h = pop.querySelector('#fp-h').value;
      SP.fecha[ns] = SP.fecha[ns] || {}; if (d || h) SP.fecha[ns][colId] = { desde:d, hasta:h }; else delete SP.fecha[ns][colId];
      popCerrar(); spRender();
    });
    pop.querySelector('#fp-clr').addEventListener('click', () => { if (SP.fecha[ns]) delete SP.fecha[ns][colId]; popCerrar(); spRender(); });
    return;
  }
  const vals = [...new Set(T.base().map(col.v))].sort((a,b) => String(a).localeCompare(String(b), 'es', { numeric:true }));
  const sel = new Set((SP.colf[ns]||{})[colId] || vals);
  pop.innerHTML = '<input type="text" id="fp-q" placeholder="Buscar">'
    + '<label class="fp-all"><input type="checkbox" id="fp-all"' + (sel.size === vals.length ? ' checked' : '') + '>(Seleccionar todo)</label>'
    + '<div class="flist">' + vals.map(v => '<label data-v="' + esc(fold(v)) + '"><input type="checkbox" class="fp-chk" value="' + esc(v) + '"' + (sel.has(v) ? ' checked' : '') + '>' + esc(v) + '</label>').join('') + '</div>'
    + '<div class="fp-row"><button class="btn sm" id="fp-ok">Aplicar</button><button class="btn ghost sm" id="fp-clr">Limpiar</button></div>';
  popUbicar(pop, btn);
  const visibles = () => [...pop.querySelectorAll('.flist label')].filter(l => l.style.display !== 'none');
  pop.querySelector('#fp-q').addEventListener('input', e => { const q = fold(e.target.value); pop.querySelectorAll('.flist label').forEach(l => { l.style.display = (!q || l.dataset.v.includes(q)) ? '' : 'none'; }); });
  pop.querySelector('#fp-all').addEventListener('change', e => visibles().forEach(l => { l.querySelector('input').checked = e.target.checked; }));
  pop.querySelector('#fp-ok').addEventListener('click', () => {
    const chk = [...pop.querySelectorAll('.fp-chk')].filter(c => c.checked).map(c => c.value);
    SP.colf[ns] = SP.colf[ns] || {}; if (chk.length === vals.length) delete SP.colf[ns][colId]; else SP.colf[ns][colId] = chk;
    popCerrar(); spRender();
  });
  pop.querySelector('#fp-clr').addEventListener('click', () => { if (SP.colf[ns]) delete SP.colf[ns][colId]; popCerrar(); spRender(); });
  pop.querySelector('#fp-q').focus();
}
// Ancho de columnas: se tira del borde derecho del título; queda guardado en este navegador, por tabla
function colAnchos(table){
  const k = 'adminfin:colw:' + table.dataset.tbl;
  const ths = [...table.querySelectorAll('thead th')];
  let saved = null; try { saved = JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) {}
  if (saved && saved.length === ths.length) { table.classList.add('grid-fixed'); ths.forEach((th,i) => { th.style.width = saved[i] + 'px'; }); }
  ths.forEach(th => {
    const rs = th.querySelector('.col-resizer'); if (!rs) return;
    rs.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      if (!table.classList.contains('grid-fixed')) { ths.forEach(t => { t.style.width = t.getBoundingClientRect().width + 'px'; }); table.classList.add('grid-fixed'); }
      const x0 = e.clientX, w0 = th.getBoundingClientRect().width;
      rs.classList.add('active'); document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
      const mover = ev => { th.style.width = Math.max(32, w0 + ev.clientX - x0) + 'px'; };
      const soltar = () => {
        document.removeEventListener('mousemove', mover); document.removeEventListener('mouseup', soltar);
        rs.classList.remove('active'); document.body.style.cursor = ''; document.body.style.userSelect = '';
        try { localStorage.setItem(k, JSON.stringify(ths.map(t => Math.round(t.getBoundingClientRect().width)))); } catch(e) {}
      };
      document.addEventListener('mousemove', mover); document.addEventListener('mouseup', soltar);
    });
  });
}

// Todas las tablas llaman a spRender() al filtrar/ordenar: dibuja la solapa activa.
function spRender(){ if (VISTA === 'tar') tarRender(); else if (VISTA === 'cuy') cuyRender(); else if (SP.cargado) spRenderSol(); else $main.innerHTML = '<div class="empty">Cargando…</div>'; }
function spRenderSol(){
  const tab = (id, l) => '<button class="mtab' + (SP.tab === id ? ' active' : '') + '" data-tab="' + id + '">' + l + '</button>';
  // Carga de informes: arriba a la derecha, como los botones de acción de la topbar de Compras
  document.getElementById('topActions').innerHTML = SP.editar
    ? INFORMES.map(([k,l]) => '<button class="btn ghost" data-cargar="' + k + '">' + ICO.upload + 'Cargar ' + esc(l) + '</button>').join('') : '';
  document.querySelectorAll('#topActions [data-cargar]').forEach(b => b.addEventListener('click', () => abrirCarga(b.dataset.cargar)));
  $main.innerHTML =
      '<div class="mtabs" style="margin:4px 0 14px">' + tab('pendfac','Pendientes de facturar') + tab('solicitudes','Pagos solicitados') + tab('pagos','Pagos a realizar') + tab('sinoc','Facturas sin OC' + (SP.fs.filter(fsAbierta).length ? ' (' + SP.fs.filter(fsAbierta).length + ')' : '')) + tab('ayuda','Instructivo') + '</div>'
    + '<div class="meta-bar"><strong>Informes de Tango</strong> (los carga Administración y Finanzas; Compras los consulta; cada carga reemplaza la anterior): '
    +   INFORMES.map(([k,l]) => '<span style="white-space:nowrap">' + esc(l) + ': ' + esc(metaTxt(k)) + '</span>').join(' &nbsp;·&nbsp; ')
    +   ociPeriodoNota() + '</div>'
    + (SP.tab === 'ayuda' ? spGuia() : '<div class="card">' + (SP.tab === 'pendfac' ? vistaPendFac() : SP.tab === 'pagos' ? vistaPagos() : SP.tab === 'sinoc' ? vistaSinOC() : vistaSolicitudes()) + '</div>');
  $main.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { SP.tab = b.dataset.tab; spRender(); }));
  $main.querySelectorAll('[data-sp-ir]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); SP.tab = a.dataset.spIr; spRender(); window.scrollTo(0, 0); }));
  $main.querySelectorAll('[data-filtro]').forEach(b => b.addEventListener('click', () => { SP.filtro = b.dataset.filtro; spRender(); }));
  $main.querySelectorAll('[data-abrir]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); spDetalle(b.dataset.abrir); }));
  $main.querySelectorAll('[data-pdf]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); spVerPdf(a.dataset.pdf); }));
  $main.querySelectorAll('[data-fs-filtro]').forEach(b => b.addEventListener('click', () => { SP.fsFiltro = b.dataset.fsFiltro; spRender(); }));
  $main.querySelectorAll('[data-fs-abrir]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); fsDetalle(b.dataset.fsAbrir); }));
  $main.querySelectorAll('[data-fs-pdf]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); fsVerPdf(b.dataset.fsPdf); }));
  const fsN = document.getElementById('fs-nueva'); if (fsN) fsN.addEventListener('click', fsNueva);
  tablaEventos();
}

      + '<li><b>⚠ fuera del informe dd/mm</b>: la factura ya no figura en Pagos a realizar (se estima pagada, anulada u otro motivo). Conviene confirmar y, si corresponde, marcarla Pagada.</li>'
      + '<li><b>✓ leída por Adm.</b>: Administración ya tomó el pedido.</li>'
      + '<li><b>⚠ en la columna FAC</b>: el neto de la factura no coincide con lo pendiente de la OC.</li>'
      + '<li>En Pagos a realizar, «—» en Auxiliar / OC / Remito: la factura no está en el Informe OC (factura sin OC o Informe OC desactualizado).</li>'
      + '<li>En Facturas sin OC, debajo de la OC: «✓ en el Informe OC», «no está en el Informe OC» (puede ser una OC nueva, todavía no exportada) o «⚠ OC de otro proveedor».</li></ul>')
    + guiaSec('Quién puede hacer qué', 'Se define en el portal → Usuarios, en la sección de esta solapa (la que antes se llamaba «Solicitudes de pago»). Con «Editar» se ven los botones de carga de informes, el alta de facturas sin OC y las acciones de cada pedido o factura; con «Ver» (o cargo lector) solo se consulta: abrir el detalle, ver el PDF y filtrar. Dirección ve y edita todo.');
}
// Encabezado de card igual que Compras: título + texto explicativo en gris
function cardH(titulo, meta){ return '<div class="card-h"><h3>' + esc(titulo) + '</h3><span class="meta">' + meta + '</span></div>'; }
function badge(est){ return '<span class="badge ' + (SP_BADGE[est]||'') + '">' + esc(est) + '</span>'; }

/* ---------- Pestaña: Pendientes de facturar ---------- */
function moneda(m){ return /extranj/i.test(m||'') ? 'USD' : 'ARS'; }
function difiere(s){ return s.neto_oc != null && s.neto_oc !== '' && Math.abs((+s.monto||0) - (+s.neto_oc||0)) > 1; }
function vistaPendFac(){
  const g = {};
  SP.pend.forEach(r => {
    const k = key(r.proveedor_cod, nroOC(r.oc_numero));
    const o = (g[k] = g[k] || { oc_numero:nroOC(r.oc_numero), proveedor_cod:r.proveedor_cod, fecha_ingreso:r.fecha_ingreso, comprador:r.comprador,
      clasif_cod:r.clasif_cod, clasif_desc:r.clasif_desc, estado:r.estado, moneda:r.moneda, pend:0, total:0, renglones:0 });
    o.pend += (+r.pend_facturar_sin_imp||0); o.total += (+r.total_pedido_sin_imp||0); o.renglones++;
  });
  const todos = Object.values(g).sort((a,b) => String(b.fecha_ingreso||'').localeCompare(String(a.fecha_ingreso||'')));
  const sols = {}; SP.lista.forEach(s => { const k = key(s.proveedor_cod, nroOC(s.oc_numero)); (sols[k] = sols[k] || []).push(s); });
  const solsDe = o => sols[key(o.proveedor_cod, o.oc_numero)] || [];
  const cols = [
    { id:'oc', t:'OC', v:o => o.oc_numero, s:o => +o.oc_numero || o.oc_numero, td:o => '<strong>' + esc(o.oc_numero) + '</strong><div class="muted">' + o.renglones + ' renglón' + (o.renglones===1?'':'es') + '</div>' },
    { id:'prov', t:'Proveedor', v:o => o.proveedor_cod || '(sin proveedor)', td:o => '<strong>' + esc(o.proveedor_cod||'') + '</strong> ' + esc(provNombre(o.proveedor_cod)) },
    { id:'ing', t:'Ingreso', fecha:o => o.fecha_ingreso, td:o => fmtFecha(o.fecha_ingreso) },
    { id:'comp', t:'Comprador', v:o => o.comprador || '(sin comprador)', td:o => esc(o.comprador||'') },
    { id:'aux', t:'Auxiliar', v:o => o.clasif_desc || o.clasif_cod || '(sin auxiliar)', td:o => esc(o.clasif_desc || o.clasif_cod || '—') },
    { id:'pend', t:'Pendiente s/imp.', v:null, s:o => o.pend, cls:'num', td:o => fmtMonto(o.pend, moneda(o.moneda)) + '<div class="muted">de ' + fmtMonto(o.total, moneda(o.moneda)) + '</div>' },
    { id:'est', t:'Estado OC', v:o => o.estado || '(sin estado)', td:o => esc(o.estado||'') },
    { id:'fac', t:'FAC', v:o => { const ss = solsDe(o).filter(activa); return !ss.length ? 'Sin FAC' : (ss.some(x => x.estado === FAC_CARGADA) ? 'FAC cargada (sin pedir pago)' : 'Pago pedido'); },
      td:o => solsDe(o).map(s => '<div style="white-space:nowrap">'
        + '<a href="#" class="lnk" data-abrir="' + s.id + '">' + esc(s.nro_factura || 's/n') + '</a>'
        + (difiere(s) ? ' <span title="El neto de la FAC no coincide con lo pendiente de la OC" style="color:#b3261e">⚠</span>' : '') + ' ' + badge(s.estado || 'Pendiente') + '</div>').join('') || '<span class="muted">—</span>' },
  ];
  TABLAS.pendfac = { cols, base:() => todos };
  const texto = o => [o.oc_numero, o.proveedor_cod, provNombre(o.proveedor_cod), o.comprador, o.clasif_cod, o.clasif_desc, solsDe(o).map(s => s.nro_factura).join(' ')].join(' ');
  SP.grupos = tablaFiltrar('pendfac', cols, todos, texto);
  const head = cardH('Pendientes de facturar', 'OCs de Tango con saldo sin facturar. Compras adjunta la FAC de cada OC y pide el pago; acá se ve en qué quedó cada una. Última actualización: ' + esc(metaTxt('pend_facturar')) + '.');
  if (!todos.length) return head + '<div class="empty">Todavía no hay datos: cargá el informe "Pendientes de facturar".</div>';
  return head + tablaHerramientas('pendfac', 'Buscar OC, proveedor, comprador, auxiliar o FAC…')
    + (SP.grupos.length ? tablaHtml('pendfac', cols, SP.grupos) : '<div class="empty">Ninguna OC coincide con los filtros.</div>');
}

/* ---------- Pestaña: Pagos solicitados ---------- */
