<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración y Finanzas · 4housing</title>
<meta name="theme-color" content="#5f7a4e">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f5f4f1; --paper:#ffffff; --ink:#20262e; --ink-soft:#5b646e; --ink-faint:#8b939c;
    --line:#dfe2e6; --accent:#235a8f; --accent-soft:#e6eef6; --accent-ink:#12395e;
    --ok:#1a7a45; --warn:#9a5a12; --warn-soft:#f7efe0;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181d; --paper:#1b2128; --ink:#e8ebee; --ink-soft:#a4adb6; --ink-faint:#6e7883;
      --line:#2c343d; --accent:#7bafe0; --accent-soft:#1e3349; --accent-ink:#bcdcff;
      --ok:#5fc98d; --warn:#e0a352; --warn-soft:#3a2d15;
    }
  }
  *{box-sizing:border-box;margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;min-height:100vh;}
  .wrap{max-width:880px;margin:0 auto;padding:2rem 1.25rem 4rem;}
  header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-bottom:1.25rem;border-bottom:1px solid var(--line);margin-bottom:2rem;}
  header[hidden]{display:none;}
  .brand{display:flex;align-items:baseline;gap:.6rem;}
  .brand h1{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;}
  .brand .tag{font-family:var(--mono);font-size:.7rem;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:.05rem .4rem;letter-spacing:.06em;}
  .who{display:flex;align-items:center;gap:.8rem;font-size:.85rem;color:var(--ink-soft);}
  .who b{color:var(--ink);font-weight:600;}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:.5rem 1rem;}
  button:hover{border-color:var(--accent);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:.65rem 1.3rem;display:inline-flex;align-items:center;gap:.6rem;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{border:none;background:none;color:var(--ink-soft);padding:.3rem .5rem;font-size:.83rem;text-decoration:none;}
  .btn-ghost:hover{color:var(--ink);}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:2.2rem;max-width:460px;margin:8vh auto 0;text-align:center;}
  .card h2{font-size:1.25rem;margin-bottom:.5rem;}
  .card p{color:var(--ink-soft);font-size:.92rem;margin-bottom:1.4rem;}
  .card .fine{font-size:.78rem;color:var(--ink-faint);margin:1.2rem 0 0;}
  .notice{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:1rem 1.2rem;font-size:.9rem;max-width:560px;margin:6vh auto 0;}
  .notice code{font-family:var(--mono);font-size:.83em;}
  .msg{color:var(--ink-soft);font-size:.9rem;padding:2rem 0;text-align:center;}

  /* ---- Solicitudes de pago (espejo de la app de Compras) ---- */
  body.app .wrap{max-width:1280px;}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem;}
  .panel-h{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem;}
  .panel-h h2{font-size:1.1rem;}
  .panel-h .sub{color:var(--ink-soft);font-size:.82rem;flex:1;min-width:240px;}
  .chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem;}
  .chip{font-size:.8rem;padding:.3rem .75rem;border-radius:999px;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem;}
  input[type=search],input[type=date],input[type=text],textarea{font:inherit;font-size:.88rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:.45rem .6rem;}
  input[type=search]{flex:1;min-width:220px;max-width:420px;}
  textarea{width:100%;resize:vertical;}
  .tbl-wrap{overflow-x:auto;}
  table.tbl{width:100%;border-collapse:collapse;font-size:.83rem;}
  table.tbl th{text-align:center;vertical-align:middle;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;padding:.5rem 1rem .5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap;position:relative;}
  table.tbl.fixed{table-layout:fixed;}
  table.tbl.fixed th{white-space:normal;line-height:1.3;}
  table.tbl.fixed td{overflow:hidden;text-overflow:ellipsis;}
  /* Tirador para ajustar el ancho a mano: borde derecho de cada título */
  .col-rs{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;}
  .col-rs:hover,.col-rs.on{background:var(--accent-soft);}
  /* Filtro tipo Excel por columna */
  .fbtn{border:none;background:none;padding:0 .2rem;font-size:.7rem;color:var(--ink-faint);cursor:pointer;}
  .fbtn.on{color:var(--accent);font-weight:700;}
  .fpop{position:absolute;z-index:70;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:.5rem;min-width:210px;max-width:300px;font-size:.82rem;}
  .fpop input[type=text]{width:100%;margin-bottom:.4rem;}
  .fpop .flist{max-height:230px;overflow:auto;}
  .fpop label{display:flex;gap:.4rem;align-items:center;padding:.15rem .2rem;cursor:pointer;}
  table.tbl td{padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top;}
  table.tbl td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-faint);font-size:.75rem;}
  .badge{display:inline-block;font-size:.72rem;font-weight:600;padding:.1rem .5rem;border-radius:999px;white-space:nowrap;}
  .b-pend{background:var(--warn-soft);color:var(--warn);}
  .b-gest{background:var(--accent-soft);color:var(--accent-ink);}
  .b-pag{background:color-mix(in srgb, var(--ok) 15%, transparent);color:var(--ok);}
  .b-gris{background:var(--line);color:var(--ink-soft);}
  .b-canc{background:color-mix(in srgb, #b3261e 12%, transparent);color:#b3261e;}
  table.tbl th[data-sort]{cursor:pointer;}
  /* Solapas de la app (sección) y pestañas internas */
  .secciones{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin:-1rem 0 1rem;}
  .sec{font-size:.88rem;font-weight:600;padding:.5rem .9rem;border-bottom:2px solid transparent;color:var(--ink-soft);}
  .sec.on{color:var(--accent);border-bottom-color:var(--accent);}
  .stabs{display:flex;gap:.3rem;margin-bottom:.8rem;flex-wrap:wrap;}
  .stab{font-size:.85rem;font-weight:600;border:none;background:none;color:var(--ink-soft);padding:.45rem .8rem;border-bottom:2px solid transparent;border-radius:0;}
  .stab.on{color:var(--accent);border-bottom-color:var(--accent);}
  .stab:hover{color:var(--ink);}
  table.tbl tfoot td{padding:.55rem .6rem;border-top:1px solid var(--line);}
  .btn-sm{font-size:.8rem;padding:.3rem .7rem;}
  a.lnk{color:var(--accent);text-decoration:none;}
  a.lnk:hover{text-decoration:underline;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--paper);border:1px solid var(--line);border-radius:10px;width:100%;max-width:640px;padding:1.2rem 1.3rem;}
  .modal h3{font-size:1.05rem;margin-bottom:.8rem;}
  .kv{font-size:.86rem;line-height:1.75;}
  .kv b{font-weight:600;}
  .box{border:1px solid var(--line);border-radius:8px;padding:.8rem;margin-top:.9rem;}
  .box h4{font-size:.85rem;margin-bottom:.5rem;}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.4rem;}
  .hist{max-height:220px;overflow:auto;}
  .hist div.it{border-bottom:1px solid var(--line);padding:.45rem 0;font-size:.84rem;}
  .foot{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem;}
  .err{color:#b3261e;font-size:.82rem;min-height:1.1em;margin-top:.4rem;}
  .okmsg{color:var(--ok);font-size:.82rem;}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:8px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;}
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr" hidden>
    <div class="brand"><h1>Administración y Finanzas</h1><span class="tag">4HOUSING</span></div>
    <div class="who"><span id="who-nombre"></span><a class="btn-ghost" href="/portal/">Portal</a><button class="btn-ghost" id="btn-salir">Salir</button></div>
  </header>

<script src="/portal/nav.js" defer></script>
<script>
/* ==========================================================================
   Administración y Finanzas — esqueleto vacío, mismo shell de acceso que el portal.
   Proyecto Supabase compartido (config idéntica al portal y demás apps).
   ========================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://wcpkpwxhqdcdljfwzcmy.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_08decRYdCRUdtO5zogvJVg_VEBCN9pf',
};
const SECTOR = 'adminfin';

const $main = document.getElementById('main');
const $hdr  = document.getElementById('hdr');
let sb = null;

function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function vistaLogin(){

  $main.innerHTML = `
    <div class="card">
      <h2>Administración y Finanzas</h2>
      <p>Acceso interno. Ingresá con tu cuenta Microsoft de la organización.</p>
      <button class="btn-primary" id="btn-ms">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="0" y="0" width="7.4" height="7.4" fill="#f25022"/><rect x="8.6" y="0" width="7.4" height="7.4" fill="#7fba00"/><rect x="0" y="8.6" width="7.4" height="7.4" fill="#00a4ef"/><rect x="8.6" y="8.6" width="7.4" height="7.4" fill="#ffb900"/></svg>
        Ingresar con Microsoft

}

    <div class="card">

    </div>`;
  document.getElementById('btn-salir-2').addEventListener('click', salir);
}

function vistaSinSector(perfil){

  $main.innerHTML = `

      <a class="btn-ghost" href="/portal/">Volver al portal</a>
    </div>`;
}

function vistaApp(perfil, cargo){
  $hdr.hidden = false;
  document.body.classList.add('app');
  document.getElementById('who-nombre').innerHTML =
    '<b>' + esc(perfil.nombre || perfil.email) + '</b>' + (cargo ? ' · ' + esc(cargo) : '');
  // Mismo criterio que public.puede_editar_sector(): los cargos lector/lectura solo ven.
  SP.editar = !!perfil.es_direccion || !['lector','lectura'].includes(String(cargo || '').toLowerCase());
  spCargar();
}

/* ==========================================================================
   Solicitudes de pago — misma solapa que en la app de Compras (4housing-compras),
   sobre las MISMAS tablas del proyecto wcpk (no hay copia ni sincronización):
     · Pendientes de facturar · Pagos solicitados · Pagos a realizar
   Estados: Compras pide (Pendiente) o cancela (Cancelada); Administración informa En gestión y Pagada.
   Reparto: Compras pide el pago (adjunta la FAC / tilda la factura); Administración sube los 3 informes
   de Tango (Informe OC, Pendientes de facturar, Pagos a realizar) y responde la gestión de cada pedido
   (confirmar lectura, fecha estimada de pago, mensajes). Escritura solo por funciones:
   compras_informe_cargar / compras_pagos_realizar_importar / compras_solpago_adminfin.
   ========================================================================== */
const SP = { editar:false, tab:'solicitudes', filtro:'Pendiente', lista:[], pend:[], pagos:[], oci:[], prov:{}, meta:[],
             q:{}, colf:{}, fecha:{}, sort:{}, actual:null, grupos:[] };
const FAC_CARGADA = 'FAC cargada';
const SP_BADGE = { 'FAC cargada':'b-gris', 'Pendiente':'b-pend', 'En gestión':'b-gest', 'Pagada':'b-pag', 'Cancelada':'b-canc' };
const activa = s => s && s.estado !== 'Cancelada';   // un pedido cancelado no bloquea volver a pedir esa factura
// Quién y cuándo, para cada comentario: "usuario · 02/10/2026 11:26"
function cuando(h){
  const d = h && h.fecha ? new Date(h.fecha) : null;
  return esc((h && h.autor) || '') + ' · ' + (d && !isNaN(d) ? d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}) : '');
}
// Columna "Pago": pagada / fecha estimada / fuera del informe
function pagoTxt(s){
  if (s.estado === 'Pagada') return 'Pagada' + (s.fecha_pago ? ' ' + fmtFecha(s.fecha_pago) : '');
  return (s.fecha_pago_estimada ? 'Estimada ' + fmtFecha(s.fecha_pago_estimada) : '—')
    + (s.salio_informe_en ? '<div style="color:var(--warn)" title="Ya no figura en Pagos a realizar: se estima pagada, anulada u otro motivo">⚠ fuera del informe ' + fmtFecha(s.salio_informe_en) + '</div>' : '');
}
const INFORMES = [['oc_informe','Informe OC'], ['pend_facturar','Pendientes de facturar'], ['pagos_realizar','Pagos a realizar']];

function fmtFecha(v){ if(!v) return '—'; const p=String(v).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : String(v); }
function fmtNum(v){ return (+v||0).toLocaleString('es-AR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtMonto(v, mon){ if(v==null || v==='') return '—'; return (mon==='USD'?'US$ ':'$ ') + fmtNum(v); }
// N° de OC de Tango sin punto de venta ni ceros adelante (" 0000100031125" -> "31125"), igual que en Compras.
function nroOC(v){ const t=String(v==null?'':v).trim(); const m=t.match(/^(\d{5})-?(\d{8})$/); return m ? (m[2].replace(/^0+/,'')||'0') : t; }
function fold(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function key(prov, nro){ return String(prov==null?'':prov).trim().toUpperCase() + '|' + String(nro==null?'':nro).trim().toUpperCase(); }
// Misma clave que public.compras_clave_fac(): proveedor + N° sin espacios/guiones, en mayúsculas.
function claveFac(prov, nro){ return String(prov==null?'':prov).replace(/\s/g,'').toUpperCase() + '|' + String(nro==null?'':nro).replace(/[^A-Za-z0-9]/g,'').toUpperCase(); }
function provNombre(cod){ return SP.prov[String(cod||'').trim().toUpperCase()] || ''; }
let _toastT=null;
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(()=>el.classList.remove('show'), 3500); }
function abrirModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('modalBg').classList.add('open'); }
function cerrarModal(){ document.getElementById('modalBg').classList.remove('open'); SP.actual=null; }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') cerrarModal(); });

// supabase-js trae de a 1000 filas: paginar (el Informe OC tiene miles)
async function selTodo(tabla, cols, orden){
  let out=[];
  for (let i=0; i<100; i++) {
    let q = sb.from(tabla).select(cols).range(i*1000, i*1000+999);
    if (orden) q = q.order(orden, { ascending:true });
    const { data, error } = await q;
    if (error) throw error;
    out = out.concat(data||[]);
    if (!data || data.length < 1000) break;
  }
  return out;
}

async function spCargar(){
  try {
    const [lista, pend, pagos, oci, prov, meta] = await Promise.all([
      selTodo('compras_solicitudes_pago', '*', 'id'),
      selTodo('compras_pend_facturar', '*', 'id'),
      selTodo('compras_pagos_realizar', '*', 'id'),
      selTodo('compras_oc_informe', 'oc_numero, proveedor_cod, clasif_cod, remito_numero, comprobante_numero, comprador', 'id'),
      selTodo('compras_proveedores', 'codigo, razon, comercial', 'id'),
      selTodo('compras_informes_meta', '*', null),
    ]);
    SP.lista = lista.reverse(); SP.pend = pend; SP.pagos = pagos; SP.oci = oci; SP.meta = meta;
    SP.prov = {}; prov.forEach(p => { SP.prov[String(p.codigo||'').trim().toUpperCase()] = p.razon || p.comercial || ''; });
  } catch (error) {
    $main.innerHTML = '<div class="notice">No pude leer los datos de Solicitudes de pago: ' + esc(error.message)
      + '<br><span class="muted">Si dice "permission denied", falta correr el SQL de habilitación (sql/2026-10_solpago_carga_adminfin.sql del repo 4housing-compras).</span></div>';
    return;
  }
  spRender();
}

/* ---------- Constancia de los informes ---------- */
function metaDe(inf){ return SP.meta.find(m => m.informe === inf) || null; }
function metaTxt(inf){
  const m = metaDe(inf); if (!m) return 'todavía no se cargó';
  const t = m.importado_en ? new Date(m.importado_en) : null;
  return 'reporte del ' + fmtFecha(m.fecha_reporte) + ' · subido el ' + (t ? t.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + t.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}) : '—') + (m.importado_por ? ' por ' + m.importado_por : '');
}

/* ---------- Tabla genérica: búsqueda, filtro tipo Excel por columna, rango de fechas, ancho ajustable ---------- */
// cols: { id, t, v(r) → valor de filtro (o null), fecha(r) → 'YYYY-MM-DD' (filtro por rango), td(r) → html, cls }
// Orden: clic en el título (no en ▾ ni en el borde de ajuste). c.s(r) = clave de orden (por defecto c.fecha / c.v).
function tablaOrdenar(ns, cols, rows){
  const o = SP.sort[ns]; const c = o && cols.find(x => x.id === o.col); if (!c) return rows;
  const k = c.s || c.fecha || c.v; if (!k) return rows;
  return rows.slice().sort((a,b) => {
    const x = k(a), y = k(b);
    if (x == null || x === '') return 1; if (y == null || y === '') return -1;   // vacíos siempre al final
    const r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'es', { numeric:true });
    return r * o.dir;
  });
}
function tablaFiltrar(ns, cols, rows, texto){
  return tablaOrdenar(ns, cols, tablaFiltrarSinOrden(ns, cols, rows, texto));
}
function tablaFiltrarSinOrden(ns, cols, rows, texto){
  const q = fold(SP.q[ns] || ''), cf = SP.colf[ns] || {}, fr = SP.fecha[ns] || {};
  return rows.filter(r => (!q || fold(texto(r)).includes(q))
    && cols.every(c => {
      if (c.fecha && fr[c.id]) { const d = c.fecha(r) || ''; if (fr[c.id].desde && d < fr[c.id].desde) return false; if (fr[c.id].hasta && d > fr[c.id].hasta) return false; }
      return !c.v || !cf[c.id] || cf[c.id].includes(c.v(r));
    }));
}
function tablaHayFiltros(ns){ return Object.keys(SP.colf[ns]||{}).length > 0 || Object.keys(SP.fecha[ns]||{}).length > 0; }
function tablaHerramientas(ns, placeholder){
  return '<div class="tools"><input type="search" data-q="' + ns + '" placeholder="' + esc(placeholder) + '" value="' + esc(SP.q[ns]||'') + '">'
    + '<span style="margin-left:auto"></span>'
    + (tablaHayFiltros(ns) ? '<button class="btn-sm" data-limpiar="' + ns + '">Limpiar filtros</button>' : '')
    + '<button class="btn-sm" data-ajustar="' + ns + '">Ajustar columnas</button></div>';
}
function tablaHtml(ns, cols, filas, pie){
  const on = c => (c.fecha ? !!(SP.fecha[ns]||{})[c.id] : !!(SP.colf[ns]||{})[c.id]);
  const o = SP.sort[ns];
  const th = c => '<th data-col="' + c.id + '"' + ((c.s || c.fecha || c.v) ? ' data-sort="' + ns + '|' + c.id + '" title="Ordenar"' : '') + '>' + esc(c.t)
    + (o && o.col === c.id ? (o.dir === 1 ? ' ▲' : ' ▼') : '')
    + ((c.v || c.fecha) ? ' <button class="fbtn' + (on(c) ? ' on' : '') + '" data-f="' + ns + '|' + c.id + '" title="Filtrar">▾</button>' : '')
    + '<span class="col-rs"></span></th>';
  return '<div class="tbl-wrap"><table class="tbl" data-tbl="' + ns + '"><thead><tr>' + cols.map(th).join('') + '</tr></thead><tbody>'
    + filas.map(r => '<tr>' + cols.map(c => '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + c.td(r) + '</td>').join('') + '</tr>').join('')
    + '</tbody>' + (pie || '') + '</table></div>';
}
const TABLAS = {};   // ns → { cols, base() } para armar los filtros
function tablaEventos(){
  $main.querySelectorAll('[data-q]').forEach(inp => inp.addEventListener('input', () => {
    const ns = inp.dataset.q, pos = inp.selectionStart; SP.q[ns] = inp.value; spRender();

  }));
  $main.querySelectorAll('[data-limpiar]').forEach(b => b.addEventListener('click', () => { SP.colf[b.dataset.limpiar] = {}; SP.fecha[b.dataset.limpiar] = {}; spRender(); }));
  $main.querySelectorAll('[data-ajustar]').forEach(b => b.addEventListener('click', () => { try { localStorage.removeItem('adminfin:colw:' + b.dataset.ajustar); } catch(e) {} spRender(); }));
  $main.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const [ns, col] = b.dataset.f.split('|'); filtroAbrir(ns, col, b); }));
  $main.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', e => {
    if (e.target.closest('.fbtn, .col-rs')) return;
    const [ns, col] = th.dataset.sort.split('|'); const o = SP.sort[ns];
    SP.sort[ns] = { col, dir: (o && o.col === col && o.dir === 1) ? -1 : 1 }; spRender();
  }));

function popCerrar(){ const p = document.getElementById('fpop'); if (p) p.remove(); document.removeEventListener('mousedown', popFuera, true); }
function popFuera(e){ const p = document.getElementById('fpop'); if (p && !p.contains(e.target) && !(e.target.closest && e.target.closest('.fbtn'))) popCerrar(); }
function popUbicar(pop, btn){
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect(), vw = document.documentElement.clientWidth;
  pop.style.top = (window.scrollY + r.bottom + 4) + 'px';
  pop.style.left = (window.scrollX + Math.max(8, Math.min(r.left, vw - 310))) + 'px';
  setTimeout(() => document.addEventListener('mousedown', popFuera, true), 0);
}
function filtroAbrir(ns, colId, btn){
  popCerrar();
  const T = TABLAS[ns]; const col = T && T.cols.find(c => c.id === colId); if (!col) return;
  const pop = document.createElement('div'); pop.id = 'fpop'; pop.className = 'fpop';
  if (col.fecha) {
    const cur = (SP.fecha[ns]||{})[colId] || {};
    pop.innerHTML = '<div style="font-weight:600;margin-bottom:.3rem">Rango de fechas</div>'
      + '<label class="muted" style="display:block">Desde</label><input type="date" id="fp-d" value="' + esc(cur.desde||'') + '" style="width:100%">'
      + '<label class="muted" style="display:block;margin-top:.3rem">Hasta</label><input type="date" id="fp-h" value="' + esc(cur.hasta||'') + '" style="width:100%">'
      + '<div class="row" style="margin-top:.5rem"><button class="btn-primary btn-sm" id="fp-ok" style="flex:1;justify-content:center">Aplicar</button><button class="btn-sm" id="fp-clr" style="flex:1">Limpiar</button></div>';
    popUbicar(pop, btn);
    pop.querySelector('#fp-ok').addEventListener('click', () => {
      const d = pop.querySelector('#fp-d').value, h = pop.querySelector('#fp-h').value;
      SP.fecha[ns] = SP.fecha[ns] || {}; if (d || h) SP.fecha[ns][colId] = { desde:d, hasta:h }; else delete SP.fecha[ns][colId];
      popCerrar(); spRender();
    });
    pop.querySelector('#fp-clr').addEventListener('click', () => { if (SP.fecha[ns]) delete SP.fecha[ns][colId]; popCerrar(); spRender(); });
    return;
  }
  const vals = [...new Set(T.base().map(col.v))].sort((a,b) => String(a).localeCompare(String(b), 'es', { numeric:true }));
  const sel = new Set((SP.colf[ns]||{})[colId] || vals);
  pop.innerHTML = '<input type="text" id="fp-q" placeholder="Buscar">'
    + '<label style="font-weight:600;border-bottom:1px solid var(--line);margin-bottom:.2rem"><input type="checkbox" id="fp-all"' + (sel.size === vals.length ? ' checked' : '') + '>(Seleccionar todo)</label>'
    + '<div class="flist">' + vals.map(v => '<label data-v="' + esc(fold(v)) + '"><input type="checkbox" class="fp-chk" value="' + esc(v) + '"' + (sel.has(v) ? ' checked' : '') + '>' + esc(v) + '</label>').join('') + '</div>'
    + '<div class="row" style="margin-top:.5rem"><button class="btn-primary btn-sm" id="fp-ok" style="flex:1;justify-content:center">Aplicar</button><button class="btn-sm" id="fp-clr" style="flex:1">Limpiar</button></div>';
  popUbicar(pop, btn);
  const visibles = () => [...pop.querySelectorAll('.flist label')].filter(l => l.style.display !== 'none');
  pop.querySelector('#fp-q').addEventListener('input', e => { const q = fold(e.target.value); pop.querySelectorAll('.flist label').forEach(l => { l.style.display = (!q || l.dataset.v.includes(q)) ? '' : 'none'; }); });
  pop.querySelector('#fp-all').addEventListener('change', e => visibles().forEach(l => { l.querySelector('input').checked = e.target.checked; }));
  pop.querySelector('#fp-ok').addEventListener('click', () => {
    const chk = [...pop.querySelectorAll('.fp-chk')].filter(c => c.checked).map(c => c.value);
    SP.colf[ns] = SP.colf[ns] || {}; if (chk.length === vals.length) delete SP.colf[ns][colId]; else SP.colf[ns][colId] = chk;
    popCerrar(); spRender();
  });
  pop.querySelector('#fp-clr').addEventListener('click', () => { if (SP.colf[ns]) delete SP.colf[ns][colId]; popCerrar(); spRender(); });
  pop.querySelector('#fp-q').focus();
}
// Ancho de columnas: se tira del borde derecho del título; queda guardado en este navegador, por tabla
function colAnchos(table){
  const k = 'adminfin:colw:' + table.dataset.tbl;
  const ths = [...table.querySelectorAll('thead th')];
  let saved = null; try { saved = JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) {}
  if (saved && saved.length === ths.length) { table.classList.add('fixed'); ths.forEach((th,i) => { th.style.width = saved[i] + 'px'; }); }
  ths.forEach(th => {
    const rs = th.querySelector('.col-rs'); if (!rs) return;
    rs.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      if (!table.classList.contains('fixed')) { ths.forEach(t => { t.style.width = t.getBoundingClientRect().width + 'px'; }); table.classList.add('fixed'); }
      const x0 = e.clientX, w0 = th.getBoundingClientRect().width;
      rs.classList.add('on'); document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
      const mover = ev => { th.style.width = Math.max(40, w0 + ev.clientX - x0) + 'px'; };
      const soltar = () => {
        document.removeEventListener('mousemove', mover); document.removeEventListener('mouseup', soltar);
        rs.classList.remove('on'); document.body.style.cursor = ''; document.body.style.userSelect = '';
        try { localStorage.setItem(k, JSON.stringify(ths.map(t => Math.round(t.getBoundingClientRect().width)))); } catch(e) {}
      };
      document.addEventListener('mousemove', mover); document.addEventListener('mouseup', soltar);
    });
  });
}

/* ---------- Pestaña: Pagos a realizar ---------- */
function vistaPagos(){
  const rows = SP.pagos.slice().sort((a,b) => String(a.fecha_emision||'').localeCompare(String(b.fecha_emision||'')));
  const idx = {};
  SP.oci.forEach(r => {
    if (!r.comprobante_numero) return;
    const o = (idx[key(r.proveedor_cod, r.comprobante_numero)] = idx[key(r.proveedor_cod, r.comprobante_numero)] || { aux:new Set(), oc:new Set(), rem:new Set(), comp:'' });
    if (r.clasif_cod) o.aux.add(String(r.clasif_cod).trim()); if (r.oc_numero) o.oc.add(nroOC(r.oc_numero)); if (r.remito_numero) o.rem.add(String(r.remito_numero).trim()); if (r.comprador && !o.comp) o.comp = r.comprador;
  });
  SP.idxPagos = idx;
  const m = r => idx[key(r.proveedor_cod, r.comprobante_numero)];
  const lista = (r,k) => { const x = m(r); return x && x[k].size ? [...x[k]].map(esc).join('<br>') : '<span class="muted">—</span>'; };
  const val = (r,k) => { const x = m(r); return x && x[k].size ? [...x[k]].join(' / ') : '(sin dato)'; };
  const solPorFac = {}; SP.lista.filter(activa).forEach(s => { solPorFac[claveFac(s.proveedor_cod, s.nro_factura)] = s; });
  const solDe = r => solPorFac[claveFac(r.proveedor_cod, r.comprobante_numero)] || null;
  const cols = [
    { id:'sol', t:'Pago', v:r => { const s = solDe(r); return s ? (s.estado || 'Pendiente') : 'Sin pedir'; },
      td:r => { const s = solDe(r); return s ? '<a href="#" data-abrir="' + s.id + '">' + badge(s.estado || 'Pendiente') + '</a>' : '<span class="muted">Sin pedir</span>'; } },
    { id:'fe', t:'Fecha de emisión', fecha:r => r.fecha_emision, td:r => fmtFecha(r.fecha_emision) },
    { id:'fc', t:'Fecha contable', v:r => r.fecha_contable ? String(r.fecha_contable).slice(0,7) : '(sin fecha)', td:r => fmtFecha(r.fecha_contable) },
    { id:'tipo', t:'Tipo de comprobante', v:r => r.tipo_comprobante || '(sin tipo)', td:r => esc(r.tipo_comprobante || '') },
    { id:'prov', t:'Cód. proveedor', v:r => r.proveedor_cod || '(sin proveedor)', td:r => '<b title="' + esc(provNombre(r.proveedor_cod)) + '">' + esc(r.proveedor_cod || '') + '</b>' },
    { id:'nro', t:'Nro. Comprobante', v:r => r.comprobante_numero || '', td:r => esc(r.comprobante_numero || '') },
    { id:'tot', t:'Total Pendiente (CTE)', v:null, s:r => +r.total_pend_cte || 0, cls:'num', td:r => fmtNum(r.total_pend_cte) },
    { id:'aux', t:'Auxiliar', v:r => val(r,'aux'), td:r => lista(r,'aux') },
    { id:'oc', t:'Orden de compra', v:r => val(r,'oc'), td:r => lista(r,'oc') },
    { id:'rem', t:'Remito', v:r => val(r,'rem'), td:r => lista(r,'rem') },
  ];
  TABLAS.pagos = { cols, base:() => rows };
  const head = '<div class="panel-h"><h2>Pagos a realizar</h2><div class="sub">Reporte de Tango con el Auxiliar, la OC y el Remito de cada factura (del Informe OC, por proveedor + N° de comprobante). La columna Pago muestra si Compras ya pidió el pago de esa factura. Última actualización: ' + esc(metaTxt('pagos_realizar')) + '.</div></div>';
  if (!rows.length) return head + '<p class="msg">Todavía no hay datos: cargá el informe "Pagos a realizar".</p>';
  const visibles = tablaFiltrar('pagos', cols, rows, r => [r.proveedor_cod, provNombre(r.proveedor_cod), r.comprobante_numero, r.tipo_comprobante, val(r,'aux'), val(r,'oc'), val(r,'rem')].join(' '));
  const sinMatch = rows.filter(r => !m(r)).length;
  const total = visibles.reduce((a,r) => a + (+r.total_pend_cte||0), 0);
  const aviso = !SP.oci.length ? '<p class="err">No hay Informe OC cargado: no se pueden completar Auxiliar / OC / Remito.</p>'
    : (sinMatch ? '<p class="muted" style="margin-bottom:.6rem">' + sinMatch + ' de ' + rows.length + ' facturas no aparecen en el Informe OC (por ejemplo, facturas sin OC, o un Informe OC desactualizado): quedan con "—".</p>' : '');
  const pie = '<tfoot><tr><td colspan="6" class="num"><b>Total (' + visibles.length + (visibles.length !== rows.length ? ' de ' + rows.length : '') + ')</b></td><td class="num"><b>' + fmtNum(total) + '</b></td><td colspan="3"></td></tr></tfoot>';
  return head + aviso + tablaHerramientas('pagos', 'Buscar proveedor, comprobante, auxiliar, OC o remito…')
    + (visibles.length ? tablaHtml('pagos', cols, visibles, pie) : '<p class="msg">Ninguna factura coincide con los filtros.</p>');
}

/* ---------- Detalle de una solicitud ---------- */
async function spVerPdf(id){
  const s = SP.lista.find(x => String(x.id) === String(id)); if (!s || !s.adjunto_path) return;
  const w = window.open('', '_blank');   // se abre antes del await para que el navegador no lo bloquee
  const { data, error } = await sb.storage.from('facturas').createSignedUrl(s.adjunto_path, 3600);
  if (error || !data) { if (w) w.close(); toast('No pude abrir el PDF: ' + ((error && error.message) || 'sin permiso')); return; }
  if (w) w.location = data.signedUrl; else window.location = data.signedUrl;
}
function spDetalle(id){
  const s = SP.lista.find(x => String(x.id) === String(id)); if (!s) return;
  SP.actual = s.id;
  const est = s.estado || 'Pendiente';
  const hist = (s.historial || []).slice().reverse().map(h =>
    '<div class="it">' + esc(h.texto || '') + '<div class="muted">' + cuando(h) + (h.estado_nuevo ? ' · pasó a "' + esc(h.estado_nuevo) + '"' : '') + '</div></div>').join('') || '<p class="muted">Sin comentarios.</p>';
  // Administración informa el estado (En gestión / Pagada), la fecha estimada y deja mensajes.
  const boxPagada = '<div class="box"><h4>Marcar Pagada</h4><div class="row"><label>Fecha de pago *<br><input type="date" id="ac-pag-f"></label><input type="text" id="ac-pag-msg" placeholder="Comentario opcional (ej. transferencia Macro)" style="flex:1;min-width:200px;align-self:flex-end"><button class="btn-primary btn-sm" id="ac-pag-ok" style="align-self:flex-end">Marcar Pagada</button></div></div>';
  const boxCom = '<div class="box"><h4>Dejar un mensaje</h4><textarea id="ac-com" rows="2" placeholder="Mensaje para Compras…"></textarea><div class="row"><button class="btn-sm" id="ac-com-ok">Enviar</button></div></div>';
  let acciones = '';
  if (est === FAC_CARGADA) {
    acciones = '<div class="box"><div class="muted">Compras cargó la FAC pero todavía no pidió el pago.</div></div>';
  } else if (!SP.editar) {
    acciones = '';
  } else if (est === 'Pagada') {
    acciones = boxCom;
  } else if (est === 'Cancelada') {
    acciones = '<div class="box"><div class="muted">Compras canceló este pedido de pago (eso no quiere decir que no se haya pagado).</div></div>' + boxPagada + boxCom;
  } else {
    acciones = (est === 'Pendiente' ? '<div class="box"><h4>En gestión</h4><div class="muted">Avisa a Compras que Finanzas ya la tomó.</div><div class="row"><button class="btn-primary btn-sm" id="ac-leido">Pasar a En gestión</button></div></div>' : '')
      + boxPagada
      + '<div class="box"><h4>Fecha estimada de pago</h4><div class="row"><input type="date" id="ac-fecha" value="' + esc(s.fecha_pago_estimada || '') + '"><input type="text" id="ac-fecha-msg" placeholder="Mensaje opcional (ej. sale con el lote del viernes)" style="flex:1;min-width:200px"><button class="btn-sm" id="ac-fecha-ok">Informar</button></div></div>'
      + boxCom;
  }
  abrirModal(
    '<h3>Solicitud de pago · ' + esc(s.nro_factura || '') + '</h3>'
    + '<div class="kv">'
    + '<b>Proveedor:</b> ' + esc(s.proveedor_cod || '') + ' — ' + esc(s.proveedor || provNombre(s.proveedor_cod)) + '<br>'
    + '<b>Factura:</b> ' + esc(s.nro_factura || '—') + (s.adjunto_path ? ' · <a href="#" class="lnk" id="dt-pdf">ver PDF</a>' : '') + '<br>'
    + '<b>OC:</b> ' + esc(nroOC(s.oc_numero) || '—') + ' &nbsp; <b>Remito:</b> ' + esc(s.remito_numero || '—') + '<br>'
    + '<b>Auxiliar:</b> ' + esc(s.proyecto_cod || '—') + ' &nbsp; <b>Comprador:</b> ' + esc(s.comprador || '—') + '<br>'
    + '<b>Monto:</b> ' + fmtMonto(s.monto, s.moneda) + '<br>'
    + '<b>Estado:</b> ' + badge(est)
    + (s.leido_en ? '<br><b>Leída:</b> ' + esc(s.leido_por || '') + ' · ' + fmtFecha(String(s.leido_en).slice(0,10)) : '')
    + (s.fecha_pago_estimada ? '<br><b>Fecha estimada de pago:</b> ' + fmtFecha(s.fecha_pago_estimada) : '')
    + (s.fecha_pago ? '<br><b>Pagada el:</b> ' + fmtFecha(s.fecha_pago) : '')
    + (s.salio_informe_en ? '<br><b style="color:var(--warn)">⚠ Fuera de Pagos a realizar desde el reporte del ' + fmtFecha(s.salio_informe_en) + '</b> <span class="muted">(se estima pagada, anulada u otro motivo)</span>' : '')
    + '</div>'
    + acciones
    + '<div class="err" id="ac-err"></div>'
    + '<div class="box"><h4>Historial</h4><div class="hist">' + hist + '</div></div>'
    + '<div class="foot"><button id="dt-cerrar">Cerrar</button></div>'
  );
  document.getElementById('dt-cerrar').addEventListener('click', cerrarModal);
  const pdf = document.getElementById('dt-pdf'); if (pdf) pdf.addEventListener('click', e => { e.preventDefault(); spVerPdf(s.id); });
  const bl = document.getElementById('ac-leido'); if (bl) bl.addEventListener('click', () => spAccion(s.id, 'leido'));
  const bpg = document.getElementById('ac-pag-ok'); if (bpg) bpg.addEventListener('click', () => {
    const f = document.getElementById('ac-pag-f').value;
    if (!f) { document.getElementById('ac-err').textContent = 'Poné la fecha de pago.'; return; }
    spAccion(s.id, 'pagada', f, document.getElementById('ac-pag-msg').value);
  });
  const bf = document.getElementById('ac-fecha-ok'); if (bf) bf.addEventListener('click', () => {
    const f = document.getElementById('ac-fecha').value;
    if (!f) { document.getElementById('ac-err').textContent = 'Elegí la fecha.'; return; }
    spAccion(s.id, 'fecha_pago', f, document.getElementById('ac-fecha-msg').value);
  });
  const bc = document.getElementById('ac-com-ok'); if (bc) bc.addEventListener('click', () => {
    const t = document.getElementById('ac-com').value.trim();
    if (!t) { document.getElementById('ac-err').textContent = 'Escribí el mensaje.'; return; }
    spAccion(s.id, 'comentario', null, t);
  });
}
async function spAccion(id, accion, fecha, texto){
  const err = document.getElementById('ac-err'); if (err) err.textContent = '';
  const { data, error } = await sb.rpc('compras_solpago_adminfin', { p_id: +id, p_accion: accion, p_fecha: fecha || null, p_texto: texto || null });
  if (error) { if (err) err.textContent = 'Error: ' + error.message; return; }
  const i = SP.lista.findIndex(x => String(x.id) === String(id));
  if (i >= 0 && data) SP.lista[i] = data;
  toast({ leido:'Pasó a En gestión', pagada:'Marcada como Pagada', fecha_pago:'Fecha estimada informada', comentario:'Mensaje enviado' }[accion] || 'Listo');
  spRender(); spDetalle(id);
}

/* ---------- Carga de informes de Tango ---------- */
function _xNorm(s){ return String(s==null?'':s).trim(); }
function _xIdx(H, ...c){ const h=H.map(x=>fold(_xNorm(x))); for (const n of c){ const i=h.indexOf(fold(n)); if (i>=0) return i; } return -1; }
function _xNum(v){ if (typeof v==='number') return v; if (v==null || v==='') return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
function _xFecha(v){
  if (v==null || v==='') return null;
  if (v instanceof Date) return isNaN(v) ? null : v.toISOString().slice(0,10);
  if (typeof v==='number' && v>20000 && v<60000) return new Date(Date.UTC(1899,11,30) + v*86400000).toISOString().slice(0,10);   // serie de Excel
  const m=String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null;
}
const CARGAS = {
  oc_informe: { titulo:'Informe OC', test:H => _xIdx(H,'NRO ORDEN COMPRA')>=0 && _xIdx(H,'COD CLASIFICACIÓN','COD CLASIFICACION')>=0,
    falta:'"NRO ORDEN COMPRA" y "COD CLASIFICACIÓN"',
    filas(rows){
      const H = rows[0], c = (...n) => _xIdx(H, ...n), g = (r,i) => i>=0 ? r[i] : '';
      const ix = { fecha:c('FECHA EMISION'), clasif:c('COD CLASIFICACIÓN','COD CLASIFICACION'), oc:c('NRO ORDEN COMPRA'), ren:c('RENGLÓN','RENGLON'),
        rem:c('NRO REMITO'), prov:c('COD PROVEEDOR'), art:c('COD ARTÍCULO','COD ARTICULO'), desc:c('DESCRIPCIÓN','DESCRIPCION'),
        cped:c('CANTIDAD_PEDIDA'), crec:c('CANTIDAD_RECIBIDA'), cpen:c('CANTIDAD_PENDIENTE'), imp:c('IMPORTE_NETO'), eoc:c('ESTADO OC'), obs:c('OBSERVACIO'),
        fent:c('FECHA ENTREGA'), dep:c('DEPÓSITO','DEPOSITO'), comp:c('NOMBRE DEL COMPRADOR'), tsin:c('TOTAL_SIN_IVA_DE_LA_OC'), tcon:c('TOTAL_CON_IVA_DE_LA_OC'),
        cond:c('CONDICIÓN DE COMPRA','CONDICION DE COMPRA'), tipo:c('TIPO COMP.','TIPO COMP'), nro:c('NRO. COMPROBANTE','NRO COMPROBANTE'),
        dcomp:c('DESC.COMPROBANTE','DESC COMPROBANTE'), epago:c('ESTADO') };
      const out = [];
      for (let k=1; k<rows.length; k++) {
        const r = rows[k], oc = _xNorm(g(r,ix.oc)); if (!oc) continue;
        out.push({ fecha_emision:_xFecha(g(r,ix.fecha)), clasif_cod:_xNorm(g(r,ix.clasif)), oc_numero:nroOC(oc), renglon:_xNum(g(r,ix.ren)),
          remito_numero:_xNorm(g(r,ix.rem)), proveedor_cod:_xNorm(g(r,ix.prov)), cod_articulo:_xNorm(g(r,ix.art)), descripcion:_xNorm(g(r,ix.desc)),
          cantidad_pedida:_xNum(g(r,ix.cped)), cantidad_recibida:_xNum(g(r,ix.crec)), cantidad_pendiente:_xNum(g(r,ix.cpen)), importe_neto:_xNum(g(r,ix.imp)),
          estado_oc:_xNorm(g(r,ix.eoc)), observacion:_xNorm(g(r,ix.obs)), fecha_entrega:_xFecha(g(r,ix.fent)), deposito:_xNorm(g(r,ix.dep)),
          comprador:_xNorm(g(r,ix.comp)), total_sin_iva_oc:_xNum(g(r,ix.tsin)), total_con_iva_oc:_xNum(g(r,ix.tcon)), condicion_compra:_xNorm(g(r,ix.cond)),
          tipo_comprobante:_xNorm(g(r,ix.tipo)), comprobante_numero:_xNorm(g(r,ix.nro)), desc_comprobante:_xNorm(g(r,ix.dcomp)), estado_pago:_xNorm(g(r,ix.epago)) });
      }
      return out;
    } },
  pend_facturar: { titulo:'Pendientes de facturar', test:H => _xIdx(H,'Nro. Orden de Compra')>=0 && _xIdx(H,'Pendiente de facturar sin impuestos')>=0,
    falta:'"Nro. Orden de Compra" y "Pendiente de facturar sin impuestos"',
    filas(rows){
      const H = rows[0], c = (...n) => _xIdx(H, ...n), g = (r,i) => i>=0 ? r[i] : '';
      const ix = { tal:c('Talonario oc'), oc:c('Nro. Orden de Compra'), prov:c('Cód. proveedor','Cod. proveedor'), fecha:c('Fecha de ingreso'),
        comp:c('Nombre del comprador'), clasif:c('Cód. clasificación (Comprobante)','Cod. clasificacion (Comprobante)'),
        cdesc:c('Descripción Clasificación (Comprobante)','Descripcion Clasificacion (Comprobante)'), art:c('Cód. Artículo','Cod. Articulo'),
        desc:c('Descripción','Descripcion'), cped:c('Cantidad pedida'), cpen:c('Cantidad Pendiente de Facturar'), tped:c('Total pedido sin impuestos'),
        pend:c('Pendiente de facturar sin impuestos'), est:c('Estado'), estr:c('Estado del renglón','Estado del renglon'), cost:c('COSTEO (Adic.)'),
        estru:c('ESTRUCTURA (Adic.)'), ley:[1,2,3,4,5].map(n => c('Leyenda'+n)), cond:c('Condición de compra','Condicion de compra'), mon:c('Moneda') };
      const out = [];
      for (let k=1; k<rows.length; k++) {
        const r = rows[k], oc = _xNorm(g(r,ix.oc)); if (!oc) continue;   // la última fila de Tango es el total
        const tal = _xNum(g(r,ix.tal));
        out.push({ talonario: tal==null ? null : Math.round(tal), oc_numero:nroOC(oc), proveedor_cod:_xNorm(g(r,ix.prov)), fecha_ingreso:_xFecha(g(r,ix.fecha)),
          comprador:_xNorm(g(r,ix.comp)), clasif_cod:_xNorm(g(r,ix.clasif)), clasif_desc:_xNorm(g(r,ix.cdesc)), cod_articulo:_xNorm(g(r,ix.art)),
          descripcion:_xNorm(g(r,ix.desc)), cantidad_pedida:_xNum(g(r,ix.cped)), cantidad_pend_facturar:_xNum(g(r,ix.cpen)),
          total_pedido_sin_imp:_xNum(g(r,ix.tped)), pend_facturar_sin_imp:_xNum(g(r,ix.pend)), estado:_xNorm(g(r,ix.est)), estado_renglon:_xNorm(g(r,ix.estr)),
          costeo:_xNorm(g(r,ix.cost)), estructura:_xNorm(g(r,ix.estru)), leyendas:ix.ley.map(i => _xNorm(g(r,i))).filter(Boolean).join(' · '),
          condicion_compra:_xNorm(g(r,ix.cond)), moneda:_xNorm(g(r,ix.mon)) });
      }
      return out;
    } },
  pagos_realizar: { titulo:'Pagos a realizar', test:H => _xIdx(H,'Nro. Comprobante')>=0 && _xIdx(H,'Total Pendiente (CTE)')>=0,
    falta:'"Nro. Comprobante" y "Total Pendiente (CTE)"',
    filas(rows){
      const H = rows[0], c = (...n) => _xIdx(H, ...n), g = (r,i) => i>=0 ? r[i] : '';
      const ix = { fe:c('Fecha de emisión','Fecha de emision'), fc:c('Fecha contable'), tipo:c('Tipo de comprobante'), prov:c('Cód. proveedor','Cod. proveedor'),
        nro:c('Nro. Comprobante'), cte:c('Total Pendiente (CTE)'), ext:c('Total Pendiente (EXT)') };
      const out = [];
      for (let k=1; k<rows.length; k++) {
        const r = rows[k], nro = _xNorm(g(r,ix.nro)); if (!nro) continue;   // la última fila de Tango es el total
        out.push({ fecha_emision:_xFecha(g(r,ix.fe)), fecha_contable:_xFecha(g(r,ix.fc)), tipo_comprobante:_xNorm(g(r,ix.tipo)),
          proveedor_cod:_xNorm(g(r,ix.prov)), comprobante_numero:nro, total_pend_cte:_xNum(g(r,ix.cte)), total_pend_ext:_xNum(g(r,ix.ext)) });
      }
      return out;
    } },
};
function hoyISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function abrirCarga(inf){
  const C = CARGAS[inf]; if (!C || !SP.editar) return;
  abrirModal('<h3>Cargar ' + esc(C.titulo) + '</h3>'
    + '<p class="muted" style="margin-bottom:.8rem">Subí el Excel de Tango "' + esc(C.titulo) + '". Reemplaza lo cargado antes; Compras lo ve al instante.'
    + (inf === 'pagos_realizar' ? ' Si una factura con pedido de pago ya no figura, se le agrega un comentario ("se estima pagada, anulada u otro motivo") y una marca; el estado no cambia: lo sigue informando Administración.' : '') + '</p>'
    + '<div class="row"><label>Fecha del reporte *<br><input type="date" id="imp-fecha" value="' + hoyISO() + '"></label>'
    + '<label style="flex:1">Archivo (.xlsx) *<br><input type="file" id="imp-file" accept=".xlsx,.xls"></label></div>'
    + '<div class="err" id="imp-err"></div><div class="okmsg" id="imp-ok"></div>'
    + '<div class="foot"><button id="imp-cerrar">Cerrar</button><button class="btn-primary btn-sm" id="imp-ok-btn">Cargar</button></div>');
  document.getElementById('imp-cerrar').addEventListener('click', cerrarModal);
  document.getElementById('imp-ok-btn').addEventListener('click', () => cargarInforme(inf));
}
async function cargarInforme(inf){
  const C = CARGAS[inf];
  const f = (document.getElementById('imp-file').files || [])[0], fecha = document.getElementById('imp-fecha').value;
  const err = document.getElementById('imp-err'), ok = document.getElementById('imp-ok'), btn = document.getElementById('imp-ok-btn');
  err.textContent = ''; ok.textContent = '';
  if (!fecha) { err.textContent = 'Poné la fecha del reporte.'; return; }
  if (!f) { err.textContent = 'Elegí el archivo.'; return; }
  btn.disabled = true;
  try {
    ok.textContent = 'Leyendo…';
    const wb = XLSX.read(new Uint8Array(await f.arrayBuffer()), { type:'array' });
    let rows = null;
    for (const name of wb.SheetNames) {
      const rr = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:'' });
      if (rr.length && C.test(rr[0].map(_xNorm))) { rows = rr; break; }
    }
    if (!rows) throw new Error('No encontré una hoja con las columnas ' + C.falta + '.');
    const filas = C.filas(rows);
    if (!filas.length) throw new Error('No encontré filas de datos.');
    if (inf === 'pagos_realizar') {
      ok.textContent = 'Guardando ' + filas.length + ' facturas…';
      const { data, error } = await sb.rpc('compras_pagos_realizar_importar', { p_filas: filas, p_fecha_reporte: fecha });
      if (error) throw new Error(error.message);
      cerrarModal();
      toast('Pagos a realizar: ' + data.filas + ' facturas · ' + (data.salieron===1 ? '1 solicitud ya no figura' : data.salieron + ' solicitudes ya no figuran') + ' en el informe');
    } else {
      // En tandas de 1000 filas: la primera reemplaza todo, las siguientes agregan
      for (let k = 0; k < filas.length; k += 1000) {
        ok.textContent = 'Guardando ' + Math.min(k + 1000, filas.length) + ' de ' + filas.length + ' filas…';
        const { error } = await sb.rpc('compras_informe_cargar', { p_informe: inf, p_filas: filas.slice(k, k + 1000), p_reset: k === 0, p_fecha_reporte: fecha });
        if (error) throw new Error(error.message + (k > 0 ? ' (quedaron cargadas ' + k + ' de ' + filas.length + ' filas: volvé a cargar el archivo completo)' : ''));
      }
      cerrarModal(); toast(C.titulo + ' cargado: ' + filas.length + ' filas');
    }
    spCargar();
  } catch (e) { ok.textContent = ''; err.textContent = 'Error: ' + (e.message || e); btn.disabled = false; }
}

async function salir(){
  await sb.auth.signOut();
  window.location.reload();
}
document.getElementById('btn-salir').addEventListener('click', salir);

async function iniciar(){
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { vistaLogin(); return; }

  const uid = session.user.id;
  const [{ data: perfil, error: e1 }, { data: sectores, error: e2 }] = await Promise.all([
    sb.from('perfiles').select('*').eq('id', uid).maybeSingle(),
    sb.from('perfiles_sector').select('sector, cargo, permisos').eq('perfil_id', uid),
  ]);

  if (e1 || e2) {
    $main.innerHTML = `<p class="msg">Error cargando tu perfil: ${esc((e1 || e2).message)}</p>`;
    return;
  }
  if (!perfil || !perfil.activo) { vistaPendiente(perfil); return; }

  const propio = (sectores || []).find(s => s.sector === SECTOR);
  if (!perfil.es_direccion && !propio) { vistaSinSector(perfil); return; }

  vistaApp(perfil, perfil.es_direccion ? 'dirección' : (propio && propio.cargo));
}

iniciar();
