<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4housing — Administración y Finanzas</title>
<meta name="theme-color" content="#5f7a4e">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Mismo sistema visual que 4housing-compras (y EERR): paleta oliva, Archivo/Quicksand, sidebar oscuro,
   topbar blanca, cards, tablas .grid, badges y modales. Valores copiados de Compras: si allá cambian, cambiar acá. */
:root{
  --olive:#9db98b; --olive-deep:#5f7a4e; --olive-soft:#b8cdac; --olive-ink:#37432c;
  --cream:#f4f2ea; --paper:#ffffff; --ink:#2b2b26; --muted:#94917f;
  --line:#e2dfd4; --line-strong:#d3d0c4; --chip:#eceadf; --bg:#eceae1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:var(--olive-deep);}

/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh;}
.app[hidden]{display:none;}
.side{width:210px;flex:none;background:#2f3a26;color:#e7ecdf;display:flex;flex-direction:column;padding:18px 13px;position:sticky;top:0;height:100vh;}
.side .brand{color:#fff;font-family:'Quicksand',sans-serif;font-weight:700;font-size:17px;letter-spacing:.02em;line-height:22px;padding:0 6px 4px;}
.side .brand-sub{color:#9fb08c;font-size:11px;font-weight:600;padding:0 6px 14px;letter-spacing:.02em;}
.nav-group-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7e8a6c;font-weight:700;padding:14px 13px 5px;}
.navbtn{display:flex;align-items:center;gap:9px;background:none;border:none;color:#cdd6bf;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;text-align:left;letter-spacing:.01em;transition:.15s;width:100%;}
.navbtn svg{width:17px;height:17px;flex:none;}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff;}
.navbtn.active{background:var(--olive);color:var(--olive-ink);}
.side .sp{flex:1;}
.side .data-actions .lbl{font-size:10px;letter-spacing:.16em;color:#9fb08c;font-weight:700;margin-bottom:2px;padding:0 4px;}
.minib{background:rgba(255,255,255,.08);border:none;color:#dfe7d3;padding:9px 11px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;}
.minib svg{width:15px;height:15px;}
.minib:hover{background:rgba(255,255,255,.16);}
.autosave{font-size:10px;color:#8fa07c;text-align:center;margin-top:8px;word-break:break-all;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:14px;}
.topbar h1{margin:0;font-size:18px;font-weight:700;}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
#topActions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.content{padding:18px 22px 48px;flex:1;}

/* ===== BOTONES ===== */
.btn{background:var(--olive-deep);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1;min-height:36px;}
.btn svg{width:15px;height:15px;}
.btn:hover{background:#536a44;}
.btn:disabled{opacity:.6;cursor:default;}
.btn.ghost{background:#fff;color:var(--olive-deep);border:1px solid var(--line-strong);}
.btn.ghost:hover{background:var(--cream);}
.btn.sm{padding:6px 10px;min-height:30px;font-size:11.5px;border-radius:8px;}

/* ===== PESTAÑAS ===== */
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.mtab{background:none;border:none;padding:9px 13px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
.mtab:hover{color:var(--olive-deep);}
.mtab.active{color:var(--olive-deep);border-bottom-color:var(--olive-deep);}
.meta-bar{font-size:11.5px;color:var(--muted);margin:-6px 0 12px;line-height:1.6;}
.meta-bar strong{color:var(--ink);}

/* ===== CARD + TABLA ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.card-h{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.card-h h3{margin:0;font-size:13.5px;font-weight:700;white-space:nowrap;}
.card-h .meta{font-size:11px;color:var(--muted);font-weight:600;}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;}
.tools input[type=search]{flex:1;min-width:220px;max-width:420px;border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;font-size:13px;background:#fbfaf4;color:var(--ink);}
.tools input[type=search]:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px rgba(124,138,87,.18);background:#fff;}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0;}
.chips .mtab{font-size:11.5px;padding:5px 10px;}
table.grid{width:100%;border-collapse:collapse;}
table.grid th{text-align:center!important;vertical-align:middle!important;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:7px 12px;border-bottom:1px solid var(--line);background:#faf9f4;white-space:nowrap;position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--line);}
table.grid td{padding:7px 12px;border-bottom:1px solid var(--line);font-size:10.5px;vertical-align:middle;}
table.grid td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
table.grid tbody tr:last-child td{border-bottom:none;}
table.grid tbody tr:hover{background:#fbfaf3;}
table.grid tfoot td{padding:7px 12px;border-top:2px solid var(--line-strong);background:#faf9f4;font-size:10.5px;}
table.grid th .col-resizer{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:3;}
table.grid th .col-resizer:hover,table.grid th .col-resizer.active{background:rgba(95,122,78,.25);}
table.grid.grid-fixed{table-layout:fixed;}
table.grid.grid-fixed th{white-space:normal!important;line-height:1.3;}
table.grid.grid-fixed td{overflow:hidden;text-overflow:ellipsis;}
.tbl-hscroll{overflow:auto;max-height:70vh;max-width:100%;}
.xlfbtn{border:none;background:none;cursor:pointer;padding:0 2px;font-size:11px;color:var(--muted);}
.xlfbtn.on{color:var(--olive-deep);}
.iconbtn{background:none;border:1px solid var(--line-strong);border-radius:7px;padding:4px 6px;color:var(--muted);display:inline-flex;vertical-align:middle;}
.iconbtn svg{width:14px;height:14px;}
.iconbtn:hover{color:var(--olive-deep);border-color:var(--olive);}
.empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:13px;}
.muted{color:var(--muted);font-size:10.5px;}
a.lnk{color:var(--olive-deep);font-weight:600;text-decoration:none;}
a.lnk:hover{text-decoration:underline;}

/* Filtro tipo Excel por columna (mismo look que xlfOpen de Compras) */
.fpop{position:absolute;z-index:9999;background:#fff;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:8px;min-width:210px;max-width:300px;font-size:12.5px;}
.fpop input[type=text],.fpop input[type=date]{width:100%;border:1px solid var(--line-strong);border-radius:7px;padding:6px 8px;margin-bottom:6px;font-size:12.5px;}
.fpop .flist{max-height:220px;overflow:auto;}
.fpop label{display:flex;gap:6px;align-items:center;padding:3px 4px;cursor:pointer;}
.fpop .fp-all{font-weight:700;border-bottom:1px solid var(--line);margin-bottom:4px;}
.fpop .fp-h{font-weight:700;margin-bottom:6px;}
.fpop .fp-lbl{display:block;font-size:11px;color:var(--muted);padding:0;}
.fpop .fp-row{display:flex;gap:6px;margin-top:8px;}
.fpop .fp-row .btn{flex:1;}

/* badges de estado (mismos colores que Compras) */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
.b-gris{background:#eef0f2;color:#8a9098;}
.b-azul{background:#e7eef6;color:#4f7099;}
.b-ambar{background:#fbf1e0;color:#b3853a;}
.b-verde{background:#e6f1e3;color:#4f8a53;}
.b-rojo{background:#f6ebea;color:#b0584f;}

/* ===== FORM ===== */
.field{margin-bottom:12px;display:flex;flex-direction:column;}
.field label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;font-size:13px;background:#fbfaf4;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px rgba(124,138,87,.18);background:#fff;}
.field textarea{resize:vertical;min-height:60px;}
.frow{display:grid;gap:14px;}
.frow.c2{grid-template-columns:1fr 1fr;}
.frow .field{margin-bottom:0;}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(40,44,32,.5);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow:auto;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 70px rgba(0,0,0,.3);}
.modal.wide{max-width:820px;}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-h h3{margin:0;font-size:17px;font-weight:700;}
.modal-h .x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1;padding:2px 6px;}
.modal-b{padding:18px;}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
.kv{font-size:12.5px;line-height:1.7;}
.box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;background:#faf9f4;}
.box h4{margin:0 0 6px;font-size:12.5px;font-weight:700;}
.box .field{margin:6px 0 0;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px;}
.hist{max-height:220px;overflow:auto;}
.hist div.it{border-bottom:1px solid var(--line);padding:8px 0;font-size:12.5px;}
.err{color:#b3261e;font-size:12px;min-height:1.1em;margin-top:6px;}
.okmsg{color:#4f8a53;font-size:12px;}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#2f3a26;color:#fff;padding:13px 22px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== Pantallas de acceso (mismo cuadro que authScreen de Compras) ===== */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
.gate[hidden]{display:none;}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px 38px;max-width:380px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.10);}
.gate-card .g-brand{font-family:'Quicksand',sans-serif;font-weight:700;font-size:22px;color:var(--olive-ink);margin-bottom:6px;}
.gate-card .g-sub{font-size:13px;color:var(--muted);margin-bottom:26px;}
.gate-card .g-msg{font-size:14px;color:#5f5c52;margin-bottom:22px;line-height:1.5;}
.gate-card .btn{padding:12px 22px;font-size:14px;}

@media(max-width:900px){
  .side{width:64px;padding:16px 8px;}
  .side .brand,.side .brand-sub,.navbtn span,.nav-group-lbl,.minib span,.autosave,.side .data-actions .lbl{display:none;}
  .navbtn,.minib{justify-content:center;}
  .topbar{flex-wrap:wrap;}
}
@media(max-width:560px){ .frow.c2{grid-template-columns:1fr;} .content{padding:14px 12px 40px;} .topbar{padding:12px;} .card-h{flex-wrap:wrap;} .card-h h3{white-space:normal;} .meta-bar span{white-space:normal!important;} .tools input[type=search]{min-width:0;} }
</style>
</head>
<body>
<div class="gate" id="gate"><div class="gate-card"><div class="g-brand">4housing</div><div class="g-sub">Administración &amp; Finanzas</div><div class="g-msg">Cargando…</div></div></div>

<div class="app" id="app" hidden>
  <!-- SIDEBAR -->
  <aside class="side">
    <div class="brand">4housing</div>
    <div class="brand-sub">Administración &amp; Finanzas</div>
    <nav id="nav">
      <div class="nav-group-lbl">Finanzas</div>
      <button class="navbtn active" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2.5h9l3 3v16h-12z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Solicitudes de pago</span></button>
    </nav>
    <div class="sp"></div>
    <div class="data-actions">
      <div class="lbl">Datos</div>
      <button class="minib" id="btn-salir" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Cerrar sesión</span>
      </button>
      <div class="autosave" id="who-nombre">—</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1>Solicitudes de pago</h1>
        <div class="sub">Pedidos de Compras a Finanzas e informes de Tango</div>
      </div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="main"><div class="empty">Cargando…</div></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-h"><h3 id="modalTitle"></h3><button class="x" type="button" id="modalX">&times;</button></div>
    <div class="modal-b" id="modalBody"></div>
    <div class="modal-f" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/portal/nav.js" defer></script>
<script>
/* ==========================================================================
   Administración y Finanzas — mismo shell de acceso que el portal y mismo diseño que Compras / EERR.
   Proyecto Supabase compartido (config idéntica al portal y demás apps).
   ========================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://wcpkpwxhqdcdljfwzcmy.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_08decRYdCRUdtO5zogvJVg_VEBCN9pf',
};
const SECTOR = 'adminfin';

const $main = document.getElementById('main');
const $app  = document.getElementById('app');
const $gate = document.getElementById('gate');
let sb = null;

function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

// Pantalla de acceso: mismo cuadro centrado que authScreen() de Compras.
function pantallaAcceso(msg, btn, onClick){
  $app.hidden = true; $gate.hidden = false;
  $gate.innerHTML = '<div class="gate-card"><div class="g-brand">4housing</div><div class="g-sub">Administración &amp; Finanzas</div>'
    + '<div class="g-msg">' + msg + '</div>' + (btn ? '<button class="btn" id="gate-btn" type="button">' + esc(btn) + '</button>' : '') + '</div>';
  if (btn && onClick) document.getElementById('gate-btn').addEventListener('click', onClick);
}

function vistaLogin(){
  pantallaAcceso('Ingresá con tu cuenta de Microsoft de la organización para acceder.', 'Iniciar sesión con Microsoft', async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'azure',
      options: { scopes: 'openid profile email', redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) alert('No se pudo iniciar el login: ' + error.message);
  });
}

function vistaPendiente(perfil){
  pantallaAcceso('Hola' + (perfil?.nombre ? ' <b>' + esc(perfil.nombre) + '</b>' : '') + '. Tu cuenta quedó registrada pero todavía no tiene sectores asignados. Pedile a dirección que la habilite.',
    'Cerrar sesión', salir);
}

function vistaSinSector(perfil){
  pantallaAcceso('Tu usuario (<b>' + esc(perfil.nombre || perfil.email) + '</b>) no tiene acceso al módulo de Administración y Finanzas.<br><span style="font-size:12px;color:var(--muted)">Pedile a dirección que te habilite el sector «adminfin» en el portal.</span>',
    'Cerrar sesión', salir);
}

function vistaApp(perfil, cargo){
  $gate.hidden = true; $app.hidden = false;
  document.getElementById('who-nombre').textContent = (perfil.nombre || perfil.email || '') + (cargo ? ' · ' + cargo : '');
  // Mismo criterio que public.puede_editar_sector(): los cargos lector/lectura solo ven.
  SP.editar = !!perfil.es_direccion || !['lector','lectura'].includes(String(cargo || '').toLowerCase());
  spCargar();
}

/* ==========================================================================
   Solicitudes de pago — misma solapa que en la app de Compras (4housing-compras),
   sobre las MISMAS tablas del proyecto wcpk (no hay copia ni sincronización):
     · Pendientes de facturar · Pagos solicitados · Pagos a realizar
   Estados: Compras pide (Pendiente) o cancela (Cancelada); Administración informa En gestión y Pagada.
   Reparto: Compras pide el pago (adjunta la FAC / tilda la factura); Administración sube los 3 informes
   de Tango (Informe OC, Pendientes de facturar, Pagos a realizar) y responde la gestión de cada pedido
   (confirmar lectura, fecha estimada de pago, mensajes). Escritura solo por funciones:
   compras_informe_cargar / compras_pagos_realizar_importar / compras_solpago_adminfin.
   ========================================================================== */
const SP = { editar:false, tab:'solicitudes', filtro:'Pendiente', lista:[], pend:[], pagos:[], oci:[], prov:{}, meta:[],
             q:{}, colf:{}, fecha:{}, sort:{}, actual:null, grupos:[] };
const FAC_CARGADA = 'FAC cargada';
// Mismos colores que Compras (ESTADO_CLR de Solicitudes de pago)
const SP_BADGE = { 'FAC cargada':'b-gris', 'Pendiente':'b-ambar', 'En gestión':'b-azul', 'Pagada':'b-verde', 'Cancelada':'b-rojo' };
const activa = s => s && s.estado !== 'Cancelada';   // un pedido cancelado no bloquea volver a pedir esa factura
// Quién y cuándo, para cada comentario: "usuario · 02/10/2026 11:26"
function cuando(h){
  const d = h && h.fecha ? new Date(h.fecha) : null;
  return esc((h && h.autor) || '') + ' · ' + (d && !isNaN(d) ? d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}) : '');
}
// Columna "Pago": pagada / fecha estimada / fuera del informe
function pagoTxt(s){
  if (s.estado === 'Pagada') return 'Pagada' + (s.fecha_pago ? ' ' + fmtFecha(s.fecha_pago) : '');
  return (s.fecha_pago_estimada ? 'Estimada ' + fmtFecha(s.fecha_pago_estimada) : '—')
    + (s.salio_informe_en ? '<div style="color:#b3853a" title="Ya no figura en Pagos a realizar: se estima pagada, anulada u otro motivo">⚠ fuera del informe ' + fmtFecha(s.salio_informe_en) + '</div>' : '');
}
const ICO = { pdf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v6h6"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>' };
const INFORMES = [['oc_informe','Informe OC'], ['pend_facturar','Pendientes de facturar'], ['pagos_realizar','Pagos a realizar']];

function fmtFecha(v){ if(!v) return '—'; const p=String(v).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : String(v); }
function fmtNum(v){ return (+v||0).toLocaleString('es-AR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtMonto(v, mon){ if(v==null || v==='') return '—'; return (mon==='USD'?'US$ ':'$ ') + fmtNum(v); }
// N° de OC de Tango sin punto de venta ni ceros adelante (" 0000100031125" -> "31125"), igual que en Compras.
function nroOC(v){ const t=String(v==null?'':v).trim(); const m=t.match(/^(\d{5})-?(\d{8})$/); return m ? (m[2].replace(/^0+/,'')||'0') : t; }
function fold(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function key(prov, nro){ return String(prov==null?'':prov).trim().toUpperCase() + '|' + String(nro==null?'':nro).trim().toUpperCase(); }
// Misma clave que public.compras_clave_fac(): proveedor + N° sin espacios/guiones, en mayúsculas.
function claveFac(prov, nro){ return String(prov==null?'':prov).replace(/\s/g,'').toUpperCase() + '|' + String(nro==null?'':nro).replace(/[^A-Za-z0-9]/g,'').toUpperCase(); }
function provNombre(cod){ return SP.prov[String(cod||'').trim().toUpperCase()] || ''; }

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(()=>el.classList.remove('show'), 3500); }

// supabase-js trae de a 1000 filas: paginar (el Informe OC tiene miles)
async function selTodo(tabla, cols, orden){
  let out=[];
  for (let i=0; i<100; i++) {
    let q = sb.from(tabla).select(cols).range(i*1000, i*1000+999);
    if (orden) q = q.order(orden, { ascending:true });
    const { data, error } = await q;
    if (error) throw error;
    out = out.concat(data||[]);
    if (!data || data.length < 1000) break;
  }
  return out;
}

async function spCargar(){
  try {
    const [lista, pend, pagos, oci, prov, meta] = await Promise.all([
      selTodo('compras_solicitudes_pago', '*', 'id'),
      selTodo('compras_pend_facturar', '*', 'id'),
      selTodo('compras_pagos_realizar', '*', 'id'),
      selTodo('compras_oc_informe', 'oc_numero, proveedor_cod, clasif_cod, remito_numero, comprobante_numero, comprador', 'id'),
      selTodo('compras_proveedores', 'codigo, razon, comercial', 'id'),
      selTodo('compras_informes_meta', '*', null),
    ]);
    SP.lista = lista.reverse(); SP.pend = pend; SP.pagos = pagos; SP.oci = oci; SP.meta = meta;
    SP.prov = {}; prov.forEach(p => { SP.prov[String(p.codigo||'').trim().toUpperCase()] = p.razon || p.comercial || ''; });
  } catch (error) {
    $main.innerHTML = '<div class="card"><div class="empty">No pude leer los datos de Solicitudes de pago: ' + esc(error.message)
      + '<br><span class="muted">Si dice "permission denied", falta correr el SQL de habilitación (sql/2026-10_solpago_carga_adminfin.sql del repo 4housing-compras).</span></div></div>';
    return;
  }
  spRender();
}

function metaDe(inf){ return SP.meta.find(m => m.informe === inf) || null; }
function metaTxt(inf){
  const m = metaDe(inf); if (!m) return 'todavía no se cargó';
  const t = m.importado_en ? new Date(m.importado_en) : null;

/* ---------- Tabla genérica: búsqueda, filtro tipo Excel por columna, rango de fechas, ancho ajustable ---------- */
// cols: { id, t, v(r) → valor de filtro (o null), fecha(r) → 'YYYY-MM-DD' (filtro por rango), td(r) → html, cls }
// Orden: clic en el título (no en ▾ ni en el borde de ajuste). c.s(r) = clave de orden (por defecto c.fecha / c.v).
function tablaOrdenar(ns, cols, rows){
  const o = SP.sort[ns]; const c = o && cols.find(x => x.id === o.col); if (!c) return rows;
  const k = c.s || c.fecha || c.v; if (!k) return rows;
  return rows.slice().sort((a,b) => {
    const x = k(a), y = k(b);
    if (x == null || x === '') return 1; if (y == null || y === '') return -1;   // vacíos siempre al final
    const r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'es', { numeric:true });
    return r * o.dir;
  });
}
function tablaFiltrar(ns, cols, rows, texto){
  return tablaOrdenar(ns, cols, tablaFiltrarSinOrden(ns, cols, rows, texto));
}
function tablaFiltrarSinOrden(ns, cols, rows, texto){
  const q = fold(SP.q[ns] || ''), cf = SP.colf[ns] || {}, fr = SP.fecha[ns] || {};
  return rows.filter(r => (!q || fold(texto(r)).includes(q))
    && cols.every(c => {
      if (c.fecha && fr[c.id]) { const d = c.fecha(r) || ''; if (fr[c.id].desde && d < fr[c.id].desde) return false; if (fr[c.id].hasta && d > fr[c.id].hasta) return false; }
      return !c.v || !cf[c.id] || cf[c.id].includes(c.v(r));
    }));
}
function tablaHayFiltros(ns){ return Object.keys(SP.colf[ns]||{}).length > 0 || Object.keys(SP.fecha[ns]||{}).length > 0; }
function tablaHerramientas(ns, placeholder){
  return '<div class="tools"><input type="search" data-q="' + ns + '" placeholder="' + esc(placeholder) + '" value="' + esc(SP.q[ns]||'') + '">'
    + '<span style="margin-left:auto"></span>'
    + (tablaHayFiltros(ns) ? '<button class="btn ghost sm" data-limpiar="' + ns + '">Limpiar filtros</button>' : '')
    + '<button class="btn ghost sm" data-ajustar="' + ns + '">Auto-ajustar columnas</button></div>';
}
function tablaHtml(ns, cols, filas, pie){
  const on = c => (c.fecha ? !!(SP.fecha[ns]||{})[c.id] : !!(SP.colf[ns]||{})[c.id]);
  const o = SP.sort[ns];
  const th = c => '<th data-col="' + c.id + '"' + ((c.s || c.fecha || c.v) ? ' data-sort="' + ns + '|' + c.id + '" title="Ordenar" style="cursor:pointer"' : '') + '>' + esc(c.t)
    + (o && o.col === c.id ? (o.dir === 1 ? ' ▲' : ' ▼') : '')
    + ((c.v || c.fecha) ? ' <button class="xlfbtn' + (on(c) ? ' on' : '') + '" data-f="' + ns + '|' + c.id + '" title="Filtrar">▾</button>' : '')
    + '<span class="col-resizer"></span></th>';
  return '<div class="tbl-hscroll"><table class="grid" data-tbl="' + ns + '"><thead><tr>' + cols.map(th).join('') + '</tr></thead><tbody>'
    + filas.map(r => '<tr>' + cols.map(c => '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + c.td(r) + '</td>').join('') + '</tr>').join('')
    + '</tbody>' + (pie || '') + '</table></div>';
}
const TABLAS = {};   // ns → { cols, base() } para armar los filtros
function tablaEventos(){
  $main.querySelectorAll('[data-q]').forEach(inp => inp.addEventListener('input', () => {
    const ns = inp.dataset.q, pos = inp.selectionStart; SP.q[ns] = inp.value; spRender();
    const n = $main.querySelector('[data-q="' + ns + '"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch(e) {} }
  }));
  $main.querySelectorAll('[data-limpiar]').forEach(b => b.addEventListener('click', () => { SP.colf[b.dataset.limpiar] = {}; SP.fecha[b.dataset.limpiar] = {}; spRender(); }));
  $main.querySelectorAll('[data-ajustar]').forEach(b => b.addEventListener('click', () => { try { localStorage.removeItem('adminfin:colw:' + b.dataset.ajustar); } catch(e) {} spRender(); }));
  $main.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const [ns, col] = b.dataset.f.split('|'); filtroAbrir(ns, col, b); }));
  $main.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', e => {
    if (e.target.closest('.xlfbtn, .col-resizer')) return;
    const [ns, col] = th.dataset.sort.split('|'); const o = SP.sort[ns];
    SP.sort[ns] = { col, dir: (o && o.col === col && o.dir === 1) ? -1 : 1 }; spRender();
  }));
  $main.querySelectorAll('table[data-tbl]').forEach(colAnchos);
}
function popCerrar(){ const p = document.getElementById('fpop'); if (p) p.remove(); document.removeEventListener('mousedown', popFuera, true); }
function popFuera(e){ const p = document.getElementById('fpop'); if (p && !p.contains(e.target) && !(e.target.closest && e.target.closest('.xlfbtn'))) popCerrar(); }
function popUbicar(pop, btn){
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect(), vw = document.documentElement.clientWidth;
  pop.style.top = (window.scrollY + r.bottom + 4) + 'px';
  pop.style.left = (window.scrollX + Math.max(8, Math.min(r.left, vw - 310))) + 'px';
  setTimeout(() => document.addEventListener('mousedown', popFuera, true), 0);
}
function filtroAbrir(ns, colId, btn){
  popCerrar();
  const T = TABLAS[ns]; const col = T && T.cols.find(c => c.id === colId); if (!col) return;
  const pop = document.createElement('div'); pop.id = 'fpop'; pop.className = 'fpop';
  if (col.fecha) {
    const cur = (SP.fecha[ns]||{})[colId] || {};
    pop.innerHTML = '<div class="fp-h">Rango de fechas</div>'
      + '<label class="fp-lbl">Desde</label><input type="date" id="fp-d" value="' + esc(cur.desde||'') + '">'
      + '<label class="fp-lbl">Hasta</label><input type="date" id="fp-h" value="' + esc(cur.hasta||'') + '">'
      + '<div class="fp-row"><button class="btn sm" id="fp-ok">Aplicar</button><button class="btn ghost sm" id="fp-clr">Limpiar</button></div>';
    popUbicar(pop, btn);
    pop.querySelector('#fp-ok').addEventListener('click', () => {
      const d = pop.querySelector('#fp-d').value, h = pop.querySelector('#fp-h').value;
      SP.fecha[ns] = SP.fecha[ns] || {}; if (d || h) SP.fecha[ns][colId] = { desde:d, hasta:h }; else delete SP.fecha[ns][colId];
      popCerrar(); spRender();
    });
    pop.querySelector('#fp-clr').addEventListener('click', () => { if (SP.fecha[ns]) delete SP.fecha[ns][colId]; popCerrar(); spRender(); });
    return;
  }
  const vals = [...new Set(T.base().map(col.v))].sort((a,b) => String(a).localeCompare(String(b), 'es', { numeric:true }));
  const sel = new Set((SP.colf[ns]||{})[colId] || vals);
  pop.innerHTML = '<input type="text" id="fp-q" placeholder="Buscar">'
    + '<label class="fp-all"><input type="checkbox" id="fp-all"' + (sel.size === vals.length ? ' checked' : '') + '>(Seleccionar todo)</label>'
    + '<div class="flist">' + vals.map(v => '<label data-v="' + esc(fold(v)) + '"><input type="checkbox" class="fp-chk" value="' + esc(v) + '"' + (sel.has(v) ? ' checked' : '') + '>' + esc(v) + '</label>').join('') + '</div>'
    + '<div class="fp-row"><button class="btn sm" id="fp-ok">Aplicar</button><button class="btn ghost sm" id="fp-clr">Limpiar</button></div>';
  popUbicar(pop, btn);
  const visibles = () => [...pop.querySelectorAll('.flist label')].filter(l => l.style.display !== 'none');
  pop.querySelector('#fp-q').addEventListener('input', e => { const q = fold(e.target.value); pop.querySelectorAll('.flist label').forEach(l => { l.style.display = (!q || l.dataset.v.includes(q)) ? '' : 'none'; }); });
  pop.querySelector('#fp-all').addEventListener('change', e => visibles().forEach(l => { l.querySelector('input').checked = e.target.checked; }));
  pop.querySelector('#fp-ok').addEventListener('click', () => {
    const chk = [...pop.querySelectorAll('.fp-chk')].filter(c => c.checked).map(c => c.value);
    SP.colf[ns] = SP.colf[ns] || {}; if (chk.length === vals.length) delete SP.colf[ns][colId]; else SP.colf[ns][colId] = chk;
    popCerrar(); spRender();
  });
  pop.querySelector('#fp-clr').addEventListener('click', () => { if (SP.colf[ns]) delete SP.colf[ns][colId]; popCerrar(); spRender(); });
  pop.querySelector('#fp-q').focus();
}
// Ancho de columnas: se tira del borde derecho del título; queda guardado en este navegador, por tabla
function colAnchos(table){
  const k = 'adminfin:colw:' + table.dataset.tbl;
  const ths = [...table.querySelectorAll('thead th')];
  let saved = null; try { saved = JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) {}
  if (saved && saved.length === ths.length) { table.classList.add('grid-fixed'); ths.forEach((th,i) => { th.style.width = saved[i] + 'px'; }); }
  ths.forEach(th => {
    const rs = th.querySelector('.col-resizer'); if (!rs) return;
    rs.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      if (!table.classList.contains('grid-fixed')) { ths.forEach(t => { t.style.width = t.getBoundingClientRect().width + 'px'; }); table.classList.add('grid-fixed'); }
      const x0 = e.clientX, w0 = th.getBoundingClientRect().width;
      rs.classList.add('active'); document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
      const mover = ev => { th.style.width = Math.max(32, w0 + ev.clientX - x0) + 'px'; };
      const soltar = () => {
        document.removeEventListener('mousemove', mover); document.removeEventListener('mouseup', soltar);
        rs.classList.remove('active'); document.body.style.cursor = ''; document.body.style.userSelect = '';
        try { localStorage.setItem(k, JSON.stringify(ths.map(t => Math.round(t.getBoundingClientRect().width)))); } catch(e) {}
      };
      document.addEventListener('mousemove', mover); document.addEventListener('mouseup', soltar);
    });
  });
}

  // Carga de informes: arriba a la derecha, como los botones de acción de la topbar de Compras

    ? INFORMES.map(([k,l]) => '<button class="btn ghost" data-cargar="' + k + '">' + ICO.upload + 'Cargar ' + esc(l) + '</button>').join('') : '';
  document.querySelectorAll('#topActions [data-cargar]').forEach(b => b.addEventListener('click', () => abrirCarga(b.dataset.cargar)));
  $main.innerHTML =
      '<div class="mtabs" style="margin:4px 0 14px">' + tab('pendfac','Pendientes de facturar') + tab('solicitudes','Pagos solicitados') + tab('pagos','Pagos a realizar') + '</div>'
    + '<div class="meta-bar"><strong>Informes de Tango</strong> (los carga Administración y Finanzas; Compras los consulta; cada carga reemplaza la anterior): '
    +   INFORMES.map(([k,l]) => '<span style="white-space:nowrap">' + esc(l) + ': ' + esc(metaTxt(k)) + '</span>').join(' &nbsp;·&nbsp; ') + '</div>'
    + '<div class="card">' + (SP.tab === 'pendfac' ? vistaPendFac() : SP.tab === 'pagos' ? vistaPagos() : vistaSolicitudes()) + '</div>';
  $main.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { SP.tab = b.dataset.tab; spRender(); }));
  $main.querySelectorAll('[data-filtro]').forEach(b => b.addEventListener('click', () => { SP.filtro = b.dataset.filtro; spRender(); }));
  $main.querySelectorAll('[data-abrir]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); spDetalle(b.dataset.abrir); }));
  $main.querySelectorAll('[data-pdf]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); spVerPdf(a.dataset.pdf); }));
  tablaEventos();
}

/* ---------- Pestaña: Pendientes de facturar ---------- */
function moneda(m){ return /extranj/i.test(m||'') ? 'USD' : 'ARS'; }
function difiere(s){ return s.neto_oc != null && s.neto_oc !== '' && Math.abs((+s.monto||0) - (+s.neto_oc||0)) > 1; }
function vistaPendFac(){
  const g = {};
  SP.pend.forEach(r => {
    const k = key(r.proveedor_cod, nroOC(r.oc_numero));
    const o = (g[k] = g[k] || { oc_numero:nroOC(r.oc_numero), proveedor_cod:r.proveedor_cod, fecha_ingreso:r.fecha_ingreso, comprador:r.comprador,
      clasif_cod:r.clasif_cod, clasif_desc:r.clasif_desc, estado:r.estado, moneda:r.moneda, pend:0, total:0, renglones:0 });
    o.pend += (+r.pend_facturar_sin_imp||0); o.total += (+r.total_pedido_sin_imp||0); o.renglones++;
  });
  const todos = Object.values(g).sort((a,b) => String(b.fecha_ingreso||'').localeCompare(String(a.fecha_ingreso||'')));
  const sols = {}; SP.lista.forEach(s => { const k = key(s.proveedor_cod, nroOC(s.oc_numero)); (sols[k] = sols[k] || []).push(s); });
  const solsDe = o => sols[key(o.proveedor_cod, o.oc_numero)] || [];
  const cols = [
    { id:'oc', t:'OC', v:o => o.oc_numero, s:o => +o.oc_numero || o.oc_numero, td:o => '<strong>' + esc(o.oc_numero) + '</strong><div class="muted">' + o.renglones + ' renglón' + (o.renglones===1?'':'es') + '</div>' },
    { id:'prov', t:'Proveedor', v:o => o.proveedor_cod || '(sin proveedor)', td:o => '<strong>' + esc(o.proveedor_cod||'') + '</strong> ' + esc(provNombre(o.proveedor_cod)) },
    { id:'ing', t:'Ingreso', fecha:o => o.fecha_ingreso, td:o => fmtFecha(o.fecha_ingreso) },
    { id:'comp', t:'Comprador', v:o => o.comprador || '(sin comprador)', td:o => esc(o.comprador||'') },
    { id:'aux', t:'Auxiliar', v:o => o.clasif_desc || o.clasif_cod || '(sin auxiliar)', td:o => esc(o.clasif_desc || o.clasif_cod || '—') },
    { id:'pend', t:'Pendiente s/imp.', v:null, s:o => o.pend, cls:'num', td:o => fmtMonto(o.pend, moneda(o.moneda)) + '<div class="muted">de ' + fmtMonto(o.total, moneda(o.moneda)) + '</div>' },
    { id:'est', t:'Estado OC', v:o => o.estado || '(sin estado)', td:o => esc(o.estado||'') },
    { id:'fac', t:'FAC', v:o => { const ss = solsDe(o).filter(activa); return !ss.length ? 'Sin FAC' : (ss.some(x => x.estado === FAC_CARGADA) ? 'FAC cargada (sin pedir pago)' : 'Pago pedido'); },
      td:o => solsDe(o).map(s => '<div style="white-space:nowrap">'
        + '<a href="#" class="lnk" data-abrir="' + s.id + '">' + esc(s.nro_factura || 's/n') + '</a>'
        + (difiere(s) ? ' <span title="El neto de la FAC no coincide con lo pendiente de la OC" style="color:#b3261e">⚠</span>' : '') + ' ' + badge(s.estado || 'Pendiente') + '</div>').join('') || '<span class="muted">—</span>' },
  ];
  TABLAS.pendfac = { cols, base:() => todos };
  const texto = o => [o.oc_numero, o.proveedor_cod, provNombre(o.proveedor_cod), o.comprador, o.clasif_cod, o.clasif_desc, solsDe(o).map(s => s.nro_factura).join(' ')].join(' ');
  SP.grupos = tablaFiltrar('pendfac', cols, todos, texto);
  const head = cardH('Pendientes de facturar', 'OCs de Tango con saldo sin facturar. Compras adjunta la FAC de cada OC y pide el pago; acá se ve en qué quedó cada una. Última actualización: ' + esc(metaTxt('pend_facturar')) + '.');
  if (!todos.length) return head + '<div class="empty">Todavía no hay datos: cargá el informe "Pendientes de facturar".</div>';
  return head + tablaHerramientas('pendfac', 'Buscar OC, proveedor, comprador, auxiliar o FAC…')
    + (SP.grupos.length ? tablaHtml('pendfac', cols, SP.grupos) : '<div class="empty">Ninguna OC coincide con los filtros.</div>');
}

    .map(([v,l]) => '<button class="mtab'+(SP.filtro===v?' active':'')+'" data-filtro="'+esc(v)+'">'+esc(l)+'</button>').join('');
  const base = pedidas.filter(s => SP.filtro === 'todas' || (s.estado||'Pendiente') === SP.filtro);
  const cols = [
    { id:'fac', t:'Factura', v:s => s.nro_factura || '(sin N°)', td:s => '<strong>' + esc(s.nro_factura || '—') + '</strong>' + (s.adjunto_path ? ' <button class="iconbtn" title="Ver factura" data-pdf="' + s.id + '">' + ICO.pdf + '</button>' : '') },
    { id:'prov', t:'Proveedor', v:s => s.proveedor_cod || '(sin proveedor)', td:s => esc(s.proveedor_cod || '') + ' ' + esc(s.proveedor || provNombre(s.proveedor_cod)) },
    { id:'oc', t:'OC', v:s => nroOC(s.oc_numero) || '(sin OC)', td:s => esc(nroOC(s.oc_numero) || '—') },
    { id:'aux', t:'Auxiliar', v:s => s.proyecto_cod || '(sin auxiliar)', td:s => esc(s.proyecto_cod || '—') },
    { id:'comp', t:'Comprador', v:s => s.comprador || '(sin comprador)', td:s => esc(s.comprador || '') },

/* ---------- Pestaña: Pagos a realizar ---------- */
function vistaPagos(){
  const rows = SP.pagos.slice().sort((a,b) => String(a.fecha_emision||'').localeCompare(String(b.fecha_emision||'')));
  const idx = {};
  SP.oci.forEach(r => {
    if (!r.comprobante_numero) return;
    const o = (idx[key(r.proveedor_cod, r.comprobante_numero)] = idx[key(r.proveedor_cod, r.comprobante_numero)] || { aux:new Set(), oc:new Set(), rem:new Set(), comp:'' });
    if (r.clasif_cod) o.aux.add(String(r.clasif_cod).trim()); if (r.oc_numero) o.oc.add(nroOC(r.oc_numero)); if (r.remito_numero) o.rem.add(String(r.remito_numero).trim()); if (r.comprador && !o.comp) o.comp = r.comprador;
  });
  SP.idxPagos = idx;
  const m = r => idx[key(r.proveedor_cod, r.comprobante_numero)];
  const lista = (r,k) => { const x = m(r); return x && x[k].size ? [...x[k]].map(esc).join('<br>') : '<span class="muted">—</span>'; };
  const val = (r,k) => { const x = m(r); return x && x[k].size ? [...x[k]].join(' / ') : '(sin dato)'; };
  const solPorFac = {}; SP.lista.filter(activa).forEach(s => { solPorFac[claveFac(s.proveedor_cod, s.nro_factura)] = s; });
  const solDe = r => solPorFac[claveFac(r.proveedor_cod, r.comprobante_numero)] || null;
  const cols = [
    { id:'sol', t:'Pago', v:r => { const s = solDe(r); return s ? (s.estado || 'Pendiente') : 'Sin pedir'; },
      td:r => { const s = solDe(r); return s ? '<a href="#" data-abrir="' + s.id + '">' + badge(s.estado || 'Pendiente') + '</a>' : '<span class="muted">Sin pedir</span>'; } },
    { id:'fe', t:'Fecha de emisión', fecha:r => r.fecha_emision, td:r => fmtFecha(r.fecha_emision) },
    { id:'fc', t:'Fecha contable', v:r => r.fecha_contable ? String(r.fecha_contable).slice(0,7) : '(sin fecha)', td:r => fmtFecha(r.fecha_contable) },
    { id:'tipo', t:'Tipo de comprobante', v:r => r.tipo_comprobante || '(sin tipo)', td:r => esc(r.tipo_comprobante || '') },
    { id:'prov', t:'Cód. proveedor', v:r => r.proveedor_cod || '(sin proveedor)', td:r => '<strong title="' + esc(provNombre(r.proveedor_cod)) + '">' + esc(r.proveedor_cod || '') + '</strong>' },
    { id:'nro', t:'Nro. Comprobante', v:r => r.comprobante_numero || '', td:r => esc(r.comprobante_numero || '') },
    { id:'tot', t:'Total Pendiente (CTE)', v:null, s:r => +r.total_pend_cte || 0, cls:'num', td:r => fmtNum(r.total_pend_cte) },
    { id:'aux', t:'Auxiliar', v:r => val(r,'aux'), td:r => lista(r,'aux') },
    { id:'oc', t:'Orden de compra', v:r => val(r,'oc'), td:r => lista(r,'oc') },
    { id:'rem', t:'Remito', v:r => val(r,'rem'), td:r => lista(r,'rem') },
  ];
  TABLAS.pagos = { cols, base:() => rows };
  const head = cardH('Pagos a realizar', 'Reporte de Tango con el Auxiliar, la OC y el Remito de cada factura (del Informe OC, por proveedor + N° de comprobante). La columna Pago muestra si Compras ya pidió el pago de esa factura. Última actualización: ' + esc(metaTxt('pagos_realizar')) + '.');
  if (!rows.length) return head + '<div class="empty">Todavía no hay datos: cargá el informe "Pagos a realizar".</div>';
  const visibles = tablaFiltrar('pagos', cols, rows, r => [r.proveedor_cod, provNombre(r.proveedor_cod), r.comprobante_numero, r.tipo_comprobante, val(r,'aux'), val(r,'oc'), val(r,'rem')].join(' '));
  const sinMatch = rows.filter(r => !m(r)).length;
  const total = visibles.reduce((a,r) => a + (+r.total_pend_cte||0), 0);
  const aviso = !SP.oci.length ? '<div class="err" style="padding:10px 14px 0">No hay Informe OC cargado: no se pueden completar Auxiliar / OC / Remito.</div>'
    : (sinMatch ? '<div class="muted" style="padding:10px 14px 0;font-size:11.5px">' + sinMatch + ' de ' + rows.length + ' facturas no aparecen en el Informe OC (por ejemplo, facturas sin OC, o un Informe OC desactualizado): quedan con "—".</div>' : '');
  const pie = '<tfoot><tr><td colspan="6" class="num"><b>Total (' + visibles.length + (visibles.length !== rows.length ? ' de ' + rows.length : '') + ')</b></td><td class="num"><b>' + fmtNum(total) + '</b></td><td colspan="3"></td></tr></tfoot>';
  return head + aviso + tablaHerramientas('pagos', 'Buscar proveedor, comprobante, auxiliar, OC o remito…')
    + (visibles.length ? tablaHtml('pagos', cols, visibles, pie) : '<div class="empty">Ninguna factura coincide con los filtros.</div>');
}

/* ---------- Detalle de una solicitud ---------- */
async function spVerPdf(id){
  const s = SP.lista.find(x => String(x.id) === String(id)); if (!s || !s.adjunto_path) return;
  const w = window.open('', '_blank');   // se abre antes del await para que el navegador no lo bloquee
  const { data, error } = await sb.storage.from('facturas').createSignedUrl(s.adjunto_path, 3600);
  if (error || !data) { if (w) w.close(); toast('No pude abrir el PDF: ' + ((error && error.message) || 'sin permiso')); return; }
  if (w) w.location = data.signedUrl; else window.location = data.signedUrl;
}

    acciones = boxCom;

    acciones = '<div class="box"><div class="muted" style="font-size:12px">Compras canceló este pedido de pago (eso no quiere decir que no se haya pagado).</div></div>' + boxPagada + boxCom;
  } else {

      + boxPagada

      +   '<div class="field"><label>Mensaje (opcional)</label><input type="text" id="ac-fecha-msg" placeholder="Ej. sale con el lote del viernes"></div></div><div class="row"><button class="btn ghost sm" id="ac-fecha-ok">Informar</button></div></div>'
      + boxCom;
  }
  abrirModal('Solicitud de pago · ' + (s.nro_factura || ''),
    '<div class="kv">'
    + '<b>Proveedor:</b> ' + esc(s.proveedor_cod || '') + ' — ' + esc(s.proveedor || provNombre(s.proveedor_cod)) + '<br>'
    + '<b>Factura:</b> ' + esc(s.nro_factura || '—') + (s.adjunto_path ? ' · <a href="#" class="lnk" id="dt-pdf">ver PDF</a>' : '') + '<br>'
    + '<b>OC:</b> ' + esc(nroOC(s.oc_numero) || '—') + ' &nbsp; <b>Remito:</b> ' + esc(s.remito_numero || '—') + '<br>'
    + '<b>Auxiliar:</b> ' + esc(s.proyecto_cod || '—') + ' &nbsp; <b>Comprador:</b> ' + esc(s.comprador || '—') + '<br>'
    + '<b>Monto:</b> ' + fmtMonto(s.monto, s.moneda) + '<br>'
    + '<b>Estado:</b> ' + badge(est)
    + (s.leido_en ? '<br><b>Leída:</b> ' + esc(s.leido_por || '') + ' · ' + fmtFecha(String(s.leido_en).slice(0,10)) : '')
    + (s.fecha_pago_estimada ? '<br><b>Fecha estimada de pago:</b> ' + fmtFecha(s.fecha_pago_estimada) : '')
    + (s.fecha_pago ? '<br><b>Pagada el:</b> ' + fmtFecha(s.fecha_pago) : '')

    spAccion(s.id, 'fecha_pago', f, document.getElementById('ac-fecha-msg').value);
  });
  const bc = document.getElementById('ac-com-ok'); if (bc) bc.addEventListener('click', () => {
    const t = document.getElementById('ac-com').value.trim();
    if (!t) { document.getElementById('ac-err').textContent = 'Escribí el mensaje.'; return; }

}
async function spAccion(id, accion, fecha, texto){
  const err = document.getElementById('ac-err'); if (err) err.textContent = '';
  const { data, error } = await sb.rpc('compras_solpago_adminfin', { p_id: +id, p_accion: accion, p_fecha: fecha || null, p_texto: texto || null });
  if (error) { if (err) err.textContent = 'Error: ' + error.message; return; }
  const i = SP.lista.findIndex(x => String(x.id) === String(id));
  if (i >= 0 && data) SP.lista[i] = data;
  toast({ leido:'Pasó a En gestión', pagada:'Marcada como Pagada', fecha_pago:'Fecha estimada informada', comentario:'Mensaje enviado' }[accion] || 'Listo');
  spRender(); spDetalle(id);
}

/* ---------- Carga de informes de Tango ---------- */
function _xNorm(s){ return String(s==null?'':s).trim(); }
function _xIdx(H, ...c){ const h=H.map(x=>fold(_xNorm(x))); for (const n of c){ const i=h.indexOf(fold(n)); if (i>=0) return i; } return -1; }
function _xNum(v){ if (typeof v==='number') return v; if (v==null || v==='') return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
function _xFecha(v){
  if (v==null || v==='') return null;
  if (v instanceof Date) return isNaN(v) ? null : v.toISOString().slice(0,10);
  if (typeof v==='number' && v>20000 && v<60000) return new Date(Date.UTC(1899,11,30) + v*86400000).toISOString().slice(0,10);   // serie de Excel
  const m=String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null;
}
const CARGAS = {

        cped:c('CANTIDAD_PEDIDA'), crec:c('CANTIDAD_RECIBIDA'), cpen:c('CANTIDAD_PENDIENTE'), imp:c('IMPORTE_NETO'), eoc:c('ESTADO OC'), obs:c('OBSERVACIO'),
        fent:c('FECHA ENTREGA'), dep:c('DEPÓSITO','DEPOSITO'), comp:c('NOMBRE DEL COMPRADOR'), tsin:c('TOTAL_SIN_IVA_DE_LA_OC'), tcon:c('TOTAL_CON_IVA_DE_LA_OC'),

      }
      return out;
    } },
  pend_facturar: { titulo:'Pendientes de facturar', test:H => _xIdx(H,'Nro. Orden de Compra')>=0 && _xIdx(H,'Pendiente de facturar sin impuestos')>=0,

      const ix = { tal:c('Talonario oc'), oc:c('Nro. Orden de Compra'), prov:c('Cód. proveedor','Cod. proveedor'), fecha:c('Fecha de ingreso'),

          costeo:_xNorm(g(r,ix.cost)), estructura:_xNorm(g(r,ix.estru)), leyendas:ix.ley.map(i => _xNorm(g(r,i))).filter(Boolean).join(' · '),
          condicion_compra:_xNorm(g(r,ix.cond)), moneda:_xNorm(g(r,ix.mon)) });
      }
      return out;
    } },

      const out = [];

        const r = rows[k], nro = _xNorm(g(r,ix.nro)); if (!nro) continue;   // la última fila de Tango es el total
        out.push({ fecha_emision:_xFecha(g(r,ix.fe)), fecha_contable:_xFecha(g(r,ix.fc)), tipo_comprobante:_xNorm(g(r,ix.tipo)),

    } },

function hoyISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function abrirCarga(inf){
  const C = CARGAS[inf]; if (!C || !SP.editar) return;
  abrirModal('Cargar ' + C.titulo,
    '<p style="margin:0 0 14px;font-size:12.5px;color:#5f5c52;line-height:1.5">Subí el Excel de Tango "' + esc(C.titulo) + '". Reemplaza lo cargado antes; Compras lo ve al instante.'
    + (inf === 'pagos_realizar' ? ' Si una factura con pedido de pago ya no figura, se le agrega un comentario ("se estima pagada, anulada u otro motivo") y una marca; el estado no cambia: lo sigue informando Administración.' : '') + '</p>'
    + '<div class="frow c2"><div class="field"><label>Fecha del reporte *</label><input type="date" id="imp-fecha" value="' + hoyISO() + '"></div>'
    + '<div class="field"><label>Archivo (.xlsx) *</label><input type="file" id="imp-file" accept=".xlsx,.xls"></div></div>'
    + '<div class="err" id="imp-err"></div><div class="okmsg" id="imp-ok"></div>',
    '<button class="btn ghost" id="imp-cerrar">Cerrar</button><button class="btn" id="imp-ok-btn">Cargar</button>');
  document.getElementById('imp-cerrar').addEventListener('click', cerrarModal);
  document.getElementById('imp-ok-btn').addEventListener('click', () => cargarInforme(inf));
}
async function cargarInforme(inf){
  const C = CARGAS[inf];
  const f = (document.getElementById('imp-file').files || [])[0], fecha = document.getElementById('imp-fecha').value;
  const err = document.getElementById('imp-err'), ok = document.getElementById('imp-ok'), btn = document.getElementById('imp-ok-btn');
  err.textContent = ''; ok.textContent = '';
  if (!fecha) { err.textContent = 'Poné la fecha del reporte.'; return; }
  if (!f) { err.textContent = 'Elegí el archivo.'; return; }
  btn.disabled = true;
  try {
    ok.textContent = 'Leyendo…';
    const wb = XLSX.read(new Uint8Array(await f.arrayBuffer()), { type:'array' });
    let rows = null;
    for (const name of wb.SheetNames) {
      const rr = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:'' });
      if (rr.length && C.test(rr[0].map(_xNorm))) { rows = rr; break; }
    }
    if (!rows) throw new Error('No encontré una hoja con las columnas ' + C.falta + '.');
    const filas = C.filas(rows);
    if (!filas.length) throw new Error('No encontré filas de datos.');
    if (inf === 'pagos_realizar') {
      ok.textContent = 'Guardando ' + filas.length + ' facturas…';
      const { data, error } = await sb.rpc('compras_pagos_realizar_importar', { p_filas: filas, p_fecha_reporte: fecha });
      if (error) throw new Error(error.message);
      cerrarModal();
      toast('Pagos a realizar: ' + data.filas + ' facturas · ' + (data.salieron===1 ? '1 solicitud ya no figura' : data.salieron + ' solicitudes ya no figuran') + ' en el informe');
    } else {
      // En tandas de 1000 filas: la primera reemplaza todo, las siguientes agregan
      for (let k = 0; k < filas.length; k += 1000) {
        ok.textContent = 'Guardando ' + Math.min(k + 1000, filas.length) + ' de ' + filas.length + ' filas…';
        const { error } = await sb.rpc('compras_informe_cargar', { p_informe: inf, p_filas: filas.slice(k, k + 1000), p_reset: k === 0, p_fecha_reporte: fecha });
        if (error) throw new Error(error.message + (k > 0 ? ' (quedaron cargadas ' + k + ' de ' + filas.length + ' filas: volvé a cargar el archivo completo)' : ''));
      }
      cerrarModal(); toast(C.titulo + ' cargado: ' + filas.length + ' filas');
    }
    spCargar();
  } catch (e) { ok.textContent = ''; err.textContent = 'Error: ' + (e.message || e); btn.disabled = false; }
}

async function salir(){
  await sb.auth.signOut();
  window.location.reload();
}
document.getElementById('btn-salir').addEventListener('click', salir);

async function iniciar(){
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { vistaLogin(); return; }

  const uid = session.user.id;
  const [{ data: perfil, error: e1 }, { data: sectores, error: e2 }] = await Promise.all([
    sb.from('perfiles').select('*').eq('id', uid).maybeSingle(),
    sb.from('perfiles_sector').select('sector, cargo, permisos').eq('perfil_id', uid),
  ]);

  if (e1 || e2) {
    pantallaAcceso('Error cargando tu perfil: ' + esc((e1 || e2).message), 'Reintentar', () => window.location.reload());
    return;
  }
  if (!perfil || !perfil.activo) { vistaPendiente(perfil); return; }

  const propio = (sectores || []).find(s => s.sector === SECTOR);
  if (!perfil.es_direccion && !propio) { vistaSinSector(perfil); return; }

  vistaApp(perfil, perfil.es_direccion ? 'dirección' : (propio && propio.cargo));
}

iniciar();
</script>
