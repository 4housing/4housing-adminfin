  const cuenta = e => pedidas.filter(s => (s.estado||'Pendiente') === e).length;
  // Mismo orden y look que los chips de estado de Compras (Todas · Pendiente · En gestión · Pagada)
  const chips = [['todas','Todas ('+pedidas.length+')'], ['Pendiente','Pendiente ('+cuenta('Pendiente')+')'],
                 ['En gestión','En gestión ('+cuenta('En gestión')+')'], ['Pagada','Pagada ('+cuenta('Pagada')+')'], ['Cancelada','Cancelada ('+cuenta('Cancelada')+')']]
    .map(([v,l]) => '<button class="mtab'+(SP.filtro===v?' active':'')+'" data-filtro="'+esc(v)+'">'+esc(l)+'</button>').join('');
  const base = pedidas.filter(s => SP.filtro === 'todas' || (s.estado||'Pendiente') === SP.filtro);
  const cols = [
    { id:'fac', t:'Factura', v:s => s.nro_factura || '(sin N°)', td:s => '<strong>' + esc(s.nro_factura || '—') + '</strong>' + (s.adjunto_path ? ' <button class="iconbtn" title="Ver factura" data-pdf="' + s.id + '">' + ICO.pdf + '</button>' : '') },
    { id:'prov', t:'Proveedor', v:s => s.proveedor_cod || '(sin proveedor)', td:s => esc(s.proveedor_cod || '') + ' ' + esc(s.proveedor || provNombre(s.proveedor_cod)) },
    { id:'oc', t:'OC', v:s => nroOC(s.oc_numero) || '(sin OC)', td:s => esc(nroOC(s.oc_numero) || '—') },
    { id:'aux', t:'Auxiliar', v:s => s.proyecto_cod || '(sin auxiliar)', td:s => esc(s.proyecto_cod || '—') },
    { id:'comp', t:'Comprador', v:s => s.comprador || '(sin comprador)', td:s => esc(s.comprador || '') },
    { id:'mon', t:'Monto', v:s => s.moneda === 'USD' ? 'Dólares' : 'Pesos', s:s => +s.monto || 0, cls:'num', td:s => fmtMonto(s.monto, s.moneda) },
    { id:'est', t:'Estado', v:s => (s.estado || 'Pendiente') + (s.leido_en ? ' · leída' : ''), td:s => badge(s.estado || 'Pendiente') + (s.leido_en ? '<div class="muted">✓ leída por Adm.</div>' : '') },
    { id:'pago', t:'Pago', v:s => s.estado === 'Pagada' ? 'Pagada' : (s.salio_informe_en ? 'Fuera del informe' : (s.fecha_pago_estimada ? 'Con fecha estimada' : 'Sin fecha')),
      s:s => s.fecha_pago || s.fecha_pago_estimada || '', td:s => '<span style="white-space:nowrap">' + pagoTxt(s) + '</span>' },
    // Fecha de pago: la real si está Pagada, si no la estimada. Con el ▾ se filtra por rango
    // (para un día: Desde = Hasta; "hasta tal fecha": solo Hasta) → pagos comprometidos.
    { id:'fpago', t:'Fecha de pago', fecha:fechaPago, td:s => { const f = fechaPago(s); return f ? '<span style="white-space:nowrap">' + fmtFecha(f) + '</span><div class="muted">' + (s.fecha_pago ? 'pagada' : 'estimada') + '</div>' : '<span class="muted">—</span>'; } },
    { id:'ult', t:'Último comentario', v:null, s:s => { const h = s.historial || []; return h.length ? String(h[h.length-1].fecha || '') : ''; },
      td:s => { const h = s.historial || []; const u = h.length ? h[h.length-1] : null; return u ? esc(u.texto || '') + '<div class="muted">' + cuando(u) + '</div>' : '—'; } },
    { id:'acc', t:'', v:null, td:s => '<button class="btn ghost sm" data-abrir="' + s.id + '">Abrir</button>' },
  ];
  TABLAS.solicitudes = { cols, base:() => base };
  const filas = tablaFiltrar('solicitudes', cols, base, s => [s.nro_factura, s.proveedor_cod, s.proveedor, nroOC(s.oc_numero), s.proyecto_cod, s.comprador, s.remito_numero].join(' '));
  // Total de lo que se ve (respeta estado, búsqueda y filtros), separado por moneda
  const tot = { ARS:0, USD:0 }; filas.forEach(x => { tot[x.moneda === 'USD' ? 'USD' : 'ARS'] += (+x.monto || 0); });
  const iMon = cols.findIndex(c => c.id === 'mon');
  const pie = '<tfoot><tr><td colspan="' + iMon + '" class="num"><b>Total (' + filas.length + (filas.length !== base.length ? ' de ' + base.length : '') + ')</b></td>'
    + '<td class="num"><b>' + fmtMonto(tot.ARS, 'ARS') + '</b>' + (tot.USD ? '<div><b>' + fmtMonto(tot.USD, 'USD') + '</b></div>' : '') + '</td><td colspan="' + (cols.length - iMon - 1) + '"></td></tr></tfoot>';
  return cardH('Pagos solicitados', 'Pedidos de pago, con fecha y responsable. Lo que confirmes o comentes acá, Compras lo ve al instante.')
    + '<div class="chips">' + chips + '</div>' + tablaHerramientas('solicitudes', 'Buscar factura, proveedor, OC, auxiliar, comprador…')
    + (filas.length ? tablaHtml('solicitudes', cols, filas, pie) : '<div class="empty">No hay solicitudes' + (tablaHayFiltros('solicitudes') || SP.q.solicitudes ? ' que coincidan con los filtros' : (SP.filtro!=='todas' ? ' en este estado' : '')) + '.</div>');
}

/* ---------- Pestaña: Pagos a realizar ---------- */
function vistaPagos(){
  const rows = SP.pagos.slice().sort((a,b) => String(a.fecha_emision||'').localeCompare(String(b.fecha_emision||'')));
  const idx = {};
  SP.oci.forEach(r => {
    if (!r.comprobante_numero) return;
    const o = (idx[key(r.proveedor_cod, r.comprobante_numero)] = idx[key(r.proveedor_cod, r.comprobante_numero)] || { aux:new Set(), oc:new Set(), rem:new Set(), comp:'' });
    if (r.clasif_cod) o.aux.add(String(r.clasif_cod).trim()); if (r.oc_numero) o.oc.add(nroOC(r.oc_numero)); if (r.remito_numero) o.rem.add(String(r.remito_numero).trim()); if (r.comprador && !o.comp) o.comp = r.comprador;
  });
  SP.idxPagos = idx;
  const m = r => idx[key(r.proveedor_cod, r.comprobante_numero)];
  const lista = (r,k) => { const x = m(r); return x && x[k].size ? [...x[k]].map(esc).join('<br>') : '<span class="muted">—</span>'; };
  const val = (r,k) => { const x = m(r); return x && x[k].size ? [...x[k]].join(' / ') : '(sin dato)'; };
  const solPorFac = {}; SP.lista.filter(activa).forEach(s => { solPorFac[claveFac(s.proveedor_cod, s.nro_factura)] = s; });
  const solDe = r => solPorFac[claveFac(r.proveedor_cod, r.comprobante_numero)] || null;
  const cols = [
    { id:'sol', t:'Pago', v:r => { const s = solDe(r); return s ? (s.estado || 'Pendiente') : 'Sin pedir'; },
      td:r => { const s = solDe(r); return s ? '<a href="#" data-abrir="' + s.id + '">' + badge(s.estado || 'Pendiente') + '</a>' : '<span class="muted">Sin pedir</span>'; } },
    { id:'fv', t:'Vencimiento', fecha:r => r.fecha_vencimiento, td:r => r.fecha_vencimiento ? fmtFecha(r.fecha_vencimiento) : '<span class="muted">—</span>' },
    { id:'fe', t:'Fecha de emisión', fecha:r => r.fecha_emision, td:r => fmtFecha(r.fecha_emision) },
    { id:'fc', t:'Fecha contable', v:r => r.fecha_contable ? String(r.fecha_contable).slice(0,7) : '(sin fecha)', td:r => fmtFecha(r.fecha_contable) },
    { id:'tipo', t:'Tipo de comprobante', v:r => r.tipo_comprobante || '(sin tipo)', td:r => esc(r.tipo_comprobante || '') },
    { id:'prov', t:'Cód. proveedor', v:r => r.proveedor_cod || '(sin proveedor)', td:r => '<strong title="' + esc(provNombre(r.proveedor_cod)) + '">' + esc(r.proveedor_cod || '') + '</strong>' },
    { id:'nro', t:'Nro. Comprobante', v:r => r.comprobante_numero || '', td:r => esc(r.comprobante_numero || '') },
    { id:'tot', t:'Total Pendiente (CTE)', v:null, s:r => +r.total_pend_cte || 0, cls:'num', td:r => fmtNum(r.total_pend_cte) },
    { id:'aux', t:'Auxiliar', v:r => val(r,'aux'), td:r => lista(r,'aux') },
    { id:'oc', t:'Orden de compra', v:r => val(r,'oc'), td:r => lista(r,'oc') },
    { id:'rem', t:'Remito', v:r => val(r,'rem'), td:r => lista(r,'rem') },
    { id:'comp', t:'Comprador', v:r => { const x = m(r); return x && x.comp ? x.comp : '(sin comprador)'; }, td:r => { const x = m(r); return x && x.comp ? esc(x.comp) : '<span class="muted">—</span>'; } },
  ];
  TABLAS.pagos = { cols, base:() => rows };
  const head = cardH('Pagos a realizar', 'Reporte de Tango con el Auxiliar, la OC, el Remito y el Comprador de cada factura (del Informe OC, por proveedor + N° de comprobante). La columna Pago muestra si Compras ya pidió el pago de esa factura. Última actualización: ' + esc(metaTxt('pagos_realizar')) + '.');
  if (!rows.length) return head + '<div class="empty">Todavía no hay datos: cargá el informe "Pagos a realizar".</div>';
  const visibles = tablaFiltrar('pagos', cols, rows, r => [r.proveedor_cod, provNombre(r.proveedor_cod), r.comprobante_numero, r.tipo_comprobante, val(r,'aux'), val(r,'oc'), val(r,'rem'), (m(r) || {}).comp].join(' '));
  const sinMatch = rows.filter(r => !m(r)).length;
  const total = visibles.reduce((a,r) => a + (+r.total_pend_cte||0), 0);
  const aviso = !SP.oci.length ? '<div class="err" style="padding:10px 14px 0">No hay Informe OC cargado: no se pueden completar Auxiliar / OC / Remito.</div>'
    : (sinMatch ? '<div class="muted" style="padding:10px 14px 0;font-size:11.5px">' + sinMatch + ' de ' + rows.length + ' facturas no aparecen en el Informe OC (por ejemplo, facturas sin OC, o un Informe OC desactualizado): quedan con "—".</div>' : '');
  const pie = '<tfoot><tr><td colspan="7" class="num"><b>Total (' + visibles.length + (visibles.length !== rows.length ? ' de ' + rows.length : '') + ')</b></td><td class="num"><b>' + fmtNum(total) + '</b></td><td colspan="4"></td></tr></tfoot>';
  return head + aviso + tablaHerramientas('pagos', 'Buscar proveedor, comprobante, auxiliar, OC, remito o comprador…')
    + (visibles.length ? tablaHtml('pagos', cols, visibles, pie) : '<div class="empty">Ninguna factura coincide con los filtros.</div>');
}

/* ---------- Pestaña: Facturas sin OC ----------
   Tabla compras_facturas_sin_oc (sql/2026-10_facturas_sin_oc.sql del repo 4housing-compras), la misma que ve Compras.
   Finanzas carga la factura (con el PDF) y la asigna a un comprador o la deja "Sin asignar" (bandeja común de Compras);
   Compras informa la OC que generó (o "No corresponde"); Finanzas la cierra. Todo queda en el historial. */
const FS_T = 'compras_facturas_sin_oc';
const FS_ESTADOS = ['Sin asignar', 'Asignada', 'OC informada', 'No corresponde', 'Cerrada'];
const FS_BADGE = { 'Sin asignar':'b-ambar', 'Asignada':'b-azul', 'OC informada':'b-verde', 'No corresponde':'b-rojo', 'Cerrada':'b-gris' };
const fsBadge = e => '<span class="badge ' + (FS_BADGE[e] || '') + '">' + esc(e) + '</span>';
const fsAbierta = f => f.estado !== 'Cerrada';
// OC abierta en Tango (se guarda siempre al cargar el Informe OC, aunque sea vieja)
const ocAbierta = e => !/ANULADA|CERRADA|CUMPLIDA|DESAUTORIZADA/i.test(String(e || ''));
async function fsCargar(){
  try { SP.fs = (await selTodo(FS_T, '*', 'id')).reverse(); SP.fsErr = ''; }
  catch (e) { SP.fs = []; SP.fsErr = e.message || String(e); }
  const { data, error } = await sb.rpc('compras_compradores');
  SP.compradores = error ? [] : (data || []).map(x => x.nombre);
}
// La OC informada, contra el Informe OC cargado: ¿existe? ¿es del mismo proveedor?
function fsOcIdx(){ const m = {}; SP.oci.forEach(r => { const k = nroOC(r.oc_numero); (m[k] = m[k] || new Set()).add(String(r.proveedor_cod || '').trim().toUpperCase()); }); return m; }
function fsOcAviso(f, idx){
  const p = idx[nroOC(f.oc_numero)];
  if (!p) return '<div class="muted" title="Puede ser una OC nueva que todavía no está en el Informe OC cargado">no está en el Informe OC</div>';
  if (f.proveedor_cod && !p.has(String(f.proveedor_cod).trim().toUpperCase())) return '<div style="color:#b3853a">⚠ OC de otro proveedor (' + esc([...p].join(', ')) + ')</div>';
  return '<div class="muted">✓ en el Informe OC</div>';
}
function vistaSinOC(){
  const head = cardH('Facturas sin OC', 'Facturas que llegaron a Finanzas sin orden de compra. Se asignan a un comprador, o quedan «Sin asignar» para que las tome alguien de Compras; Compras informa la OC que generó y Finanzas la cierra. Compras lo ve al instante.');
  if (SP.fsErr) return head + '<div class="empty">No pude leer las facturas sin OC: ' + esc(SP.fsErr) + '<br><span class="muted">Falta correr sql/2026-10_facturas_sin_oc.sql (repo 4housing-compras) en Supabase.</span></div>';
  const cuenta = e => SP.fs.filter(f => f.estado === e).length;
  const chips = [['abiertas', 'Sin cerrar (' + SP.fs.filter(fsAbierta).length + ')'], ...FS_ESTADOS.map(e => [e, e + ' (' + cuenta(e) + ')']), ['todas', 'Todas (' + SP.fs.length + ')']]
    .map(([v,l]) => '<button class="mtab' + (SP.fsFiltro === v ? ' active' : '') + '" data-fs-filtro="' + esc(v) + '">' + esc(l) + '</button>').join('')
    + (SP.editar ? '<span style="margin-left:auto"></span><button class="btn sm" id="fs-nueva">+ Nueva factura sin OC</button>' : '');
  const base = SP.fs.filter(f => SP.fsFiltro === 'todas' || (SP.fsFiltro === 'abiertas' ? fsAbierta(f) : f.estado === SP.fsFiltro));
  const idx = fsOcIdx();
  const cols = [
    { id:'fac', t:'Factura', v:f => f.nro_factura || '', td:f => '<strong>' + esc(f.nro_factura || '—') + '</strong>' + (f.adjunto_path ? ' <button class="iconbtn" title="Ver factura" data-fs-pdf="' + f.id + '">' + ICO.pdf + '</button>' : '') },
    { id:'prov', t:'Proveedor', v:f => f.proveedor_cod || '(sin proveedor)', td:f => esc(f.proveedor_cod || '') + ' ' + esc(f.proveedor || provNombre(f.proveedor_cod)) },
    { id:'ff', t:'Fecha factura', fecha:f => f.fecha_factura, td:f => f.fecha_factura ? fmtFecha(f.fecha_factura) : '<span class="muted">—</span>' },
    { id:'mon', t:'Monto', v:f => f.moneda === 'USD' ? 'Dólares' : 'Pesos', s:f => +f.monto || 0, cls:'num', td:f => fmtMonto(f.monto, f.moneda) },
    { id:'comp', t:'Asignada a', v:f => f.comprador || 'Sin asignar', td:f => f.comprador ? esc(f.comprador) : '<span class="muted">Compras (sin asignar)</span>' },
    { id:'est', t:'Estado', v:f => f.estado, td:f => fsBadge(f.estado) },
    { id:'oc', t:'OC', v:f => f.oc_numero ? nroOC(f.oc_numero) : '(sin OC)', td:f => f.oc_numero ? '<strong>' + esc(nroOC(f.oc_numero)) + '</strong>' + fsOcAviso(f, idx) : '<span class="muted">—</span>' },
    { id:'pp', t:'Pedido de pago', v:f => f.pedir_pago ? 'Sí' : 'No', td:f => f.pedir_pago ? 'Sí' : '<span class="muted">—</span>' },
    { id:'alta', t:'Cargada', fecha:f => String(f.creado_en || '').slice(0,10), td:f => '<span style="white-space:nowrap">' + fmtFecha(String(f.creado_en || '').slice(0,10)) + '</span>' },
    { id:'ult', t:'Último comentario', v:null, s:f => { const h = f.historial || []; return h.length ? String(h[h.length-1].fecha || '') : ''; },
      td:f => { const h = f.historial || []; const u = h.length ? h[h.length-1] : null; return u ? esc(u.texto || '') + '<div class="muted">' + cuando(u) + '</div>' : '—'; } },
    { id:'acc', t:'', v:null, td:f => '<button class="btn ghost sm" data-fs-abrir="' + f.id + '">Abrir</button>' },
  ];

async function fsGuardarNueva(){

async function spAccion(id, accion, fecha, texto){

/* ---------- Carga de informes de Tango ---------- */
function _xNorm(s){ return String(s==null?'':s).trim(); }
function _xIdx(H, ...c){ const h=H.map(x=>fold(_xNorm(x))); for (const n of c){ const i=h.indexOf(fold(n)); if (i>=0) return i; } return -1; }
function _xNum(v){ if (typeof v==='number') return v; if (v==null || v==='') return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
function _xFecha(v){

async function cargarInforme(inf){
  const C = CARGAS[inf];
  const f = (document.getElementById('imp-file').files || [])[0], fecha = document.getElementById('imp-fecha').value;
  const err = document.getElementById('imp-err'), ok = document.getElementById('imp-ok'), btn = document.getElementById('imp-ok-btn');
  err.textContent = ''; ok.textContent = '';
  if (!fecha) { err.textContent = 'Poné la fecha del reporte.'; return; }
  if (!f) { err.textContent = 'Elegí el archivo.'; return; }
  btn.disabled = true;
  try {
    ok.textContent = 'Leyendo…';
    const wb = XLSX.read(new Uint8Array(await f.arrayBuffer()), { type:'array' });
    let rows = null;
    for (const name of wb.SheetNames) {
      const rr = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:'' });
      if (rr.length && C.test(rr[0].map(_xNorm))) { rows = rr; break; }
    }
    if (!rows) throw new Error('No encontré una hoja con las columnas ' + C.falta + '.');
    let filas = C.filas(rows);
    if (!filas.length) throw new Error('No encontré filas de datos.');
    if (inf === 'oc_informe') {
      const desde = (document.getElementById('imp-desde') || {}).value;
      if (!desde) throw new Error('Elegí desde qué fecha guardar las OC.');
      const total = filas.length;
      filas = filas.filter(r => (r.fecha_emision && r.fecha_emision >= desde) || ocAbierta(r.estado_oc));
      if (!filas.length) throw new Error('No quedó ninguna OC desde el ' + fmtFecha(desde) + '.');
      ok.textContent = 'De ' + total + ' filas del archivo se guardan ' + filas.length + '…';
    }
    if (inf === 'pagos_realizar') {
      ok.textContent = 'Guardando ' + filas.length + ' facturas…';
      const { data, error } = await sb.rpc('compras_pagos_realizar_importar', { p_filas: filas, p_fecha_reporte: fecha });
      if (error) throw new Error(error.message);
      cerrarModal();
      toast('Pagos a realizar: ' + data.filas + ' facturas · ' + (data.salieron===1 ? '1 solicitud ya no figura' : data.salieron + ' solicitudes ya no figuran') + ' en el informe');
    } else {
      // En tandas de 1000 filas: la primera reemplaza todo, las siguientes agregan
      for (let k = 0; k < filas.length; k += 1000) {
        ok.textContent = 'Guardando ' + Math.min(k + 1000, filas.length) + ' de ' + filas.length + ' filas…';
        const { error } = await sb.rpc('compras_informe_cargar', { p_informe: inf, p_filas: filas.slice(k, k + 1000), p_reset: k === 0, p_fecha_reporte: fecha });
        if (error) throw new Error(error.message + (k > 0 ? ' (quedaron cargadas ' + k + ' de ' + filas.length + ' filas: volvé a cargar el archivo completo)' : ''));
      }
      cerrarModal(); toast(C.titulo + ' cargado: ' + filas.length + ' filas');
    }
    spCargar();
  } catch (e) { ok.textContent = ''; err.textContent = 'Error: ' + (e.message || e); btn.disabled = false; }
}

// Guarda en la base y devuelve la fila tal como quedó (return=representation)
async function cuyUpdate(id, cambios){
  const { data, error } = await sb.from(CUY_T).update(cambios).eq('id', id).select();
  if (error) throw error;
  if (!data || !data.length) throw new Error('No se guardó: sin permiso de edición o el comprobante ya no existe.');
  const i = CUY.lista.findIndex(x => x.id === id); if (i >= 0) CUY.lista[i] = data[0];
  return data[0];
}
// Documentos enlazados por "Doc. relacionado" (ej. factura anulada ↔ su N/C), en USD
function cuyRelacionados(r){
  const serie = String(r.serie_numero || '').trim(), rel = String(r.doc_relacionado || '').trim();
  return CUY.lista.filter(x => x.id !== r.id && cuyEsUSD(x)
    && ((rel && String(x.serie_numero || '').trim() === rel) || (serie && String(x.doc_relacionado || '').trim() === serie)));
}
async function cuyGuardarTc(id, valor){
  const r = CUY.lista.find(x => x.id === id); if (!r) return;
  const tc = valor === '' ? null : +valor;
  if (tc != null && !(tc > 0)) { toast('El TC tiene que ser mayor a 0'); cuyRender(); return; }
  try {
    const fila = await cuyUpdate(id, { tc });
    const otros = tc == null ? [] : cuyRelacionados(fila).filter(x => cuyNum(x.tc) !== tc);
    cuyRender();
    if (!otros.length) { toast('TC guardado' + (tc == null ? ' (quedó pendiente)' : '')); return; }
    abrirModal('Mismo TC en el documento relacionado',
      '<p style="margin:0;font-size:13px;line-height:1.55;color:#5f5c52">' + esc(fila.serie_numero || '') + ' está relacionado con <b>' + otros.map(x => esc(x.serie_numero || x.id)).join(', ')
        + '</b>. Para que la factura anulada y la nota de crédito neteen en pesos tienen que tener el mismo TC. ¿Les cargo también ' + fmtTC(tc) + '?</p>',
      '<button class="btn ghost" id="cuy-tc-no">No, solo esta</button><button class="btn" id="cuy-tc-si">Sí, aplicar</button>');
    document.getElementById('cuy-tc-no').addEventListener('click', () => { cerrarModal(); toast('TC guardado'); });
    document.getElementById('cuy-tc-si').addEventListener('click', async () => {
      try { for (const x of otros) await cuyUpdate(x.id, { tc }); cerrarModal(); toast('TC aplicado a ' + (otros.length + 1) + ' comprobantes'); cuyRender(); }
      catch (e) { cerrarModal(); toast('Error: ' + (e.message || e)); cuyRender(); }
    });
  } catch (e) { toast('No se guardó el TC: ' + (e.message || e)); cuyRender(); }
}

// Carga la cuenta sugerida (último proveedor igual / rubro) en los comprobantes que no tienen cuenta, previa confirmación
function cuyCompletarCuentas(lista){
  const items = lista.map(r => ({ r, s: cuySugCuenta(r) })).filter(x => x.s);
  abrirModal('Completar cuentas contables',
    '<p style="margin:0 0 8px;font-size:12.5px;color:#5f5c52">Se carga la cuenta sugerida en cada comprobante sin cuenta. Revisalas: después se cambian en la columna "Cuenta contable".</p><div class="hist" style="max-height:360px">'
    + items.map(x => '<div class="it">' + esc(x.r.proveedor || '') + ' ' + esc(x.r.serie_numero || '') + ' · ' + esc(x.r.rubro || '') + ' → <b>' + esc(x.s.cod) + '</b> ' + esc((cuyDicCta(x.s.cod) || {}).desc || '') + ' <span class="muted">(' + esc(x.s.por) + ')</span></div>').join('')
    + '</div><div class="err" id="cc-err"></div>',
    '<button class="btn ghost" id="cc-no">Cancelar</button><button class="btn" id="cc-si">Completar ' + items.length + '</button>', 'wide');
  document.getElementById('cc-no').addEventListener('click', cerrarModal);
  document.getElementById('cc-si').addEventListener('click', async () => {
    try { for (const x of items) await cuyUpdate(x.r.id, { cuenta_gasto: x.s.cod }); cerrarModal(); toast(items.length + ' cuentas cargadas'); cuyRender(); }
    catch (e) { document.getElementById('cc-err').textContent = 'Error: ' + (e.message || e); }
  });
}

// Promedio compra/venta (si falta uno, el que haya) — mismo criterio que usdProm() de Compras

// 'venta' / 'compra' (índice USD Oficial) | 'no' (solo lo cargado acá)
const cuyArsAuto = () => { const v = cuyPlan('CONFIG:ARS_AUTO').codigo; return ['billete','venta','compra','no'].includes(v) ? v : 'billete'; };

function cuySerie(campo){
  const modo = cuyArsAuto();
  const propias = CUY.cots.filter(c => cuyNum(c[campo]) != null && !(campo === 'ars_usd' && modo === 'billete' && cuyEsCopiaOfic(c)))
    .map(c => ({ fecha: String(c.fecha), v: +c[campo], fuente: c[campo === 'ars_usd' ? 'fuente_ars' : 'fuente_uyu'] || '' }));
  if (campo !== 'ars_usd' || modo === 'no') return propias;
  const ya = new Set(propias.map(x => x.fecha));
  const usaBill = modo === 'billete' && (CUY.bill || []).length;   // si no se puede leer el Billete (falta el SQL), respaldo: USD Oficial vendedor
  const lado = usaBill ? 'billete' : (modo === 'billete' ? 'venta' : modo);
  const auto = lado === 'billete'
    ? (CUY.bill || []).filter(o => !ya.has(String(o.fecha)) && cuyProm(o) > 0).map(o => ({ fecha: String(o.fecha), v: Math.round(cuyProm(o) * 10000) / 10000, fuente: 'USD Billete promedio (dolarapi)', auto: true }))
    : (CUY.ofic || []).filter(o => !ya.has(String(o.fecha)) && cuyNum(o[lado]) > 0).map(o => ({ fecha: String(o.fecha), v: +o[lado], fuente: 'índice USD Oficial (' + (lado === 'venta' ? 'vendedor' : 'comprador') + ')' + (modo === 'billete' ? ' · respaldo: no se pudo leer el Billete' : ''), auto: true }));

  let best = null; const f = String(fecha || ''), desde = campo === 'ars_usd' ? cuyArsMismoDesde() : null;
  const ant = desde && f >= desde ? false : cuyCotModo() === 'anterior';
  for (const c of (CUY_SERIE[campo] || [])) { if (ant ? c.fecha >= f : c.fecha > f) break; best = c; }

// Convierte un importe entre monedas con las cotizaciones de esa fecha. de: USD|UYU · a: USD|ARS. null si falta cotización.
function cuyConv(v, de, a, fecha){

// billete de la fecha del asiento para el equivalente en dólares.
const cuyMonAs = mon => CUY_UY ? 'UYU' : 'ARS';

  if (CUY_UY) return (mon === 'USD' && !cuyCotDe(fecha, 'uyu_usd')) ? ['UYU/USD'] : [];
  const f = []; if (!cuyCotDe(fecha, 'ars_usd')) f.push('ARS/USD'); if (mon === 'UYU' && !cuyCotDe(fecha, 'uyu_usd')) f.push('UYU/USD'); return f;

function cuyLey(parts){ let out = ''; for (const p of parts.filter(x => x != null && String(x).trim() !== '')) { const c = out ? out + ' - ' + p : String(p); if (c.length > CUY_LEY_MAX && out) break; out = c; } return out.slice(0, CUY_LEY_MAX); }
// Total de una factura expresado en la moneda de la cuenta (convierte con su TC si la moneda es otra)
function cuyEnMoneda(r, mon){
  const tot = cuyNum(cuyEsUSD(r) ? r.total_usd : r.total_uyu); if (tot == null) return null;
  if ((cuyEsUSD(r) ? 'USD' : 'UYU') === mon) return tot;

/* ---------- Aplicaciones pago ↔ factura ---------- */
const cuyAplDeMov = mid => CUY.apl.filter(a => a.movimiento_id === mid);
const cuyAplDeComp = cid => CUY.apl.filter(a => a.comprobante_id === cid);
const cuyCompDeMov = mid => cuyAplDeMov(mid).map(a => CUY.lista.find(c => c.id === a.comprobante_id)).filter(Boolean);
const cuyFacTotal = c => cuyNum(cuyEsUSD(c) ? c.total_usd : c.total_uyu) || 0;
// Pasa un importe de la moneda de la cuenta (mc) a la de la factura (o al revés), con el TC de la factura o la cotización del día
function cuyTcCruce(c, fecha){ const t = cuyNum(c.tc); if (t != null) return t; const k = cuyCotDe(fecha, 'uyu_usd'); return k ? k.v : null; }
// Importe aplicado en la moneda de la cuenta del movimiento (vacío = total de la factura)
function cuyAplImporte(a){
  if (cuyNum(a.importe) != null) return +a.importe;

// Importe aplicado expresado en la moneda de la factura
function cuyAplEnOrigen(a){
  const m = CUY.movs.find(x => x.id === a.movimiento_id), c = CUY.lista.find(x => x.id === a.comprobante_id), v = cuyAplImporte(a);
  if (!m || !c || v == null) return null;
  const mc = cuyCta(m.cuenta).mon, mo = cuyEsUSD(c) ? 'USD' : 'UYU'; if (mc === mo) return v;
  const tc = cuyTcCruce(c, m.fecha); if (!tc) return null;

// Saldo pendiente de la factura, en su moneda (null si falta un TC para calcularlo)
function cuySaldoFac(c){ let s = cuyFacTotal(c); for (const a of cuyAplDeComp(c.id)) { const v = cuyAplEnOrigen(a); if (v == null) return null; s -= v; } return r2(s); }

  const sal = cuySaldoFac(c); if (sal == null) return null;
  const mo = cuyEsUSD(c) ? 'USD' : 'UYU'; if (mo === mon) return sal;
  const tc = cuyTcCruce(c, fecha); if (!tc) return null; return r2(mon === 'UYU' ? sal * tc : sal / tc);

// Tolerancia del saldo de una factura: 1 centavo; si se pagó desde una cuenta en otra moneda (ej. factura en pesos pagada en

    if (sal == null || Math.abs(sal) <= cuyTolFac(r)) return 'Con movimiento';
    return (cuyFacTotal(r) > 0 ? sal > 0 : sal < 0) ? 'Pago parcial' : 'Pagado de más'; }
  if (r.anulada || String(r.estado_pago || '').toUpperCase() === 'ANULADA' || String(r.estado_pago || '').toUpperCase() === 'N/C') return 'No aplica';

  const apls = cuyAplDeMov(m.id); if (!apls.length) return null;
  let s = 0; for (const a of apls) { const v = cuyAplImporte(a); if (v == null) return NaN; s += v; }

// Cambio de moneda entre las dos cuentas del Santander UY: la salida de una cuenta tiene que tener su entrada
// en la otra el mismo día. Se emparejan por fecha y por orden de importe (el más chico con el más chico).
const cuyEsCambio = m => m.tipo === 'entre_cuentas' && /cambio/i.test(m.concepto || '') && (cuyCta(m.cuenta) || {}).g === 'banco';
function cuyEspejos(){
  const map = {}, dia = {};
  CUY.movs.filter(cuyEsCambio).forEach(m => { const d = dia[m.fecha] = dia[m.fecha] || { USD:[], UYU:[] }; d[cuyCta(m.cuenta).mon].push(m); });

      .forEach(([x, y]) => { x.sort(abs); y.sort(abs); for (let i = 0; i < Math.min(x.length, y.length); i++) { map[x[i].id] = y[i]; map[y[i].id] = x[i]; } });

function cuyEspejosCaja(){
  const map = {}, libre = m => m.tipo !== 'saldo_inicial' && m.origen !== 'factura_efectivo' && !cuyAplDeMov(m.id).length && !cuyEsCambio(m);
  const bancos = CUY.movs.filter(m => (cuyCta(m.cuenta) || {}).g === 'banco' && libre(m)), cajas = CUY.movs.filter(m => (cuyCta(m.cuenta) || {}).g === 'efectivo' && libre(m));

/* ---------- Cierres mensuales: saldo inicial + movimientos del mes = saldo del extracto (o arqueo) a fin de mes ---------- */
function cuyMesTxt(mes){ const m = String(mes || '').match(/^(\d{4})-(\d{2})$/); return m ? ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m[2]-1] + ' ' + m[1] : mes; }
function cuyCierresDe(cn, movs){
  const meses = new Set(movs.map(m => String(m.fecha).slice(0,7)));
  Object.values(CUY.cierres).forEach(c => { if (c.cuenta === cn) meses.add(c.mes); });
  let saldo = 0, usd = cuyCta(cn).mon === 'UYU' ? 0 : null;   // cuentas en pesos: saldo en US$ como queda registrado (Tango "Cantidad" / contador UY)
  if (usd != null) CUY_ESP = cuyEspejos();
  return [...meses].sort().map(mes => {
    const delMes = movs.filter(m => String(m.fecha).slice(0,7) === mes);
    const ini = saldo, ing = r2(delMes.filter(m => +m.importe > 0).reduce((a,m) => a + +m.importe, 0)), egr = r2(delMes.filter(m => +m.importe < 0).reduce((a,m) => a + +m.importe, 0));
    saldo = r2(ini + ing + egr);
    const c = CUY.cierres[cn + '|' + mes], ext = c ? cuyNum(c.saldo_extracto) : null;
    if (usd != null) delMes.forEach(m => { const u = cuyMovUsdEq(m); usd = u == null ? null : r2(usd + u); });
    const ajM = cuyEsEfectivo(cn) ? null : (CUY.ajustes || {})[cn + '|' + mes], usdAntesAj = usd;   // ajuste de cierre (DOL) cargado en Tango
    if (usd != null && ajM && cuyNum(ajM.ajuste_usd) != null) usd = r2(usd + +ajM.ajuste_usd);
    // Valor real del saldo al cierre en US$: saldo del extracto ÷ UYU/USD del último día hábil del mes (la cotización
    // "anterior" al 1° del mes siguiente). La diferencia con lo registrado es diferencia de cambio por tenencia.
    const sig = new Date(Date.UTC(+mes.slice(0,4), +mes.slice(5,7), 1)).toISOString().slice(0,10), kc = usd != null ? cuyCotDe(sig, 'uyu_usd') : null;
    const usdCie = usd != null && kc && (ext != null ? ext : saldo) != null ? r2((ext != null ? ext : saldo) / kc.v) : null;
    return { mes, ini, ing, egr, fin: saldo, usd, usdAntesAj, usdCie, tcCie: kc ? kc.v : null, ext, dif: ext == null ? null : r2(saldo - ext), pend: delMes.filter(m => CUY_A_REVISAR.includes(cuyMovEstado(m))).length };
  });
}

  const movs = cuyMovsDe(cn).filter(m => +m.importe < 0 && (m.tipo === 'pago' || m.tipo === 'otro') && !cuyCompDeMov(m.id).length);
  // Facturas con saldo pendiente (sin pagos o con pago parcial): el pago tiene que coincidir con el SALDO, no con el total
  const libres = CUY.lista.filter(r => !r.anulada && ['Sin movimiento','No pagada','Pago parcial'].includes(cuyCompConc(r)) && (r.cuenta === cn || (!r.cuenta && (cuyEsUSD(r) ? 'USD' : 'UYU') === mon)));
  const prop = [];

      if (cuyCompConc(r) === 'Pago parcial') return dias(r.fecha, m.fecha) <= 180;   // segundo pago: la fecha de pago ya es la del primero

  if (!ok.length) { toast('No encontré pares sin ambigüedad (mismo importe y fecha cercana). Vinculá a mano con "Facturas".'); return; }

    '<p style="margin:0 0 8px;font-size:12.5px;color:#5f5c52">Pares en que el pago es igual al saldo pendiente de la factura y la fecha es cercana (±7 días de la fecha de pago, o ±90 de la fecha de factura si no tiene; si ya tiene un pago parcial, hasta 180 días). Revisalos antes de confirmar.</p><div class="hist" style="max-height:360px">'

    + '</div><div class="err" id="ac-err"></div>',
    '<button class="btn ghost" id="ac-no">Cancelar</button><button class="btn" id="ac-si">Conciliar ' + ok.length + '</button>', 'wide');
  document.getElementById('ac-no').addEventListener('click', cerrarModal);
  document.getElementById('ac-si').addEventListener('click', async () => {
    try { for (const p of ok) await cuyAplGuardar(p.m, p.r, r2(-(+p.m.importe))); cerrarModal(); toast(ok.length + ' movimientos conciliados'); cuyRender(); }

// Factura pagada en efectivo: crea (o actualiza) su movimiento de caja y la deja conciliada. Devuelve texto para el toast.
async function cuyEfectivoAuto(r){
  if (CUY.movErr || !r) return '';
  const cta = cuyCta(r.cuenta);
  if (!cta || cta.g !== 'efectivo' || r.anulada || String(r.estado_pago || '').toUpperCase() !== 'PAGADO') return '';
  // Factura en pesos pagada desde una caja en dólares: se pasa a US$ con el TC de la factura o, si no tiene, el UYU/USD (BCU)
  // de su fecha, el mismo del asiento de la factura (así la caja sale por los mismos dólares)
  const tcPes = !cuyEsUSD(r) && cta.mon === 'USD' ? (cuyNum(r.tc) || cuyTcUY(cuyFacBase(r).fecha)) : null;
  const monto = tcPes ? r2(cuyNum(r.total_uyu) / tcPes) : cuyEnMoneda(r, cta.mon);
  if (monto == null || isNaN(monto)) return ' · ⚠ sin TC: no generé el movimiento de caja';
  const fila = { cuenta: cta.n, fecha: r.fecha_pago || r.fecha, importe: -monto, tc: tcPes || cuyNum(r.tc), concepto: cuyLey([r.proveedor, r.serie_numero, r.concepto]),
    tipo:'pago', rubro: r.rubro, periodo: r.periodo, proveedor: r.proveedor, proveedor_cod: r.proveedor_cod, fac: r.serie_numero };
  try {
    const apls = cuyAplDeComp(r.id), m = apls.length && CUY.movs.find(x => x.id === apls[0].movimiento_id);
    if (apls.length) {
      if (apls.length !== 1 || !m || m.origen !== 'factura_efectivo' || cuyAplDeMov(m.id).length !== 1) return '';
      if (m.cuenta === fila.cuenta && m.fecha === fila.fecha && r2(m.importe) === r2(fila.importe)) return '';
      await cuyMovGuardar(m.id, fila);
      const a = apls[0]; const { data } = await sb.from(CUY_APL_T).update({ importe: monto }).eq('id', a.id).select(); if (data && data[0]) CUY.apl[CUY.apl.indexOf(a)] = data[0];
      return ' · movimiento de caja actualizado';
    }
    const nuevo = await cuyMovGuardar(null, Object.assign(fila, { origen:'factura_efectivo' }));
    const { data, error } = await sb.from(CUY_APL_T).insert({ movimiento_id: nuevo.id, comprobante_id: r.id, importe: monto }).select();
    if (error) throw error; if (data && data[0]) CUY.apl.push(data[0]);
    return ' · movimiento de caja generado';
  } catch (e) { return ' · ⚠ no se generó el movimiento de caja: ' + (e.message || e); }
}

/* ---------- Importar extracto (Excel con las columnas FECHA … IMPORTE, como "Banco - SANTANDER UY") ---------- */
function cuyFechaXls(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return d ? d.y + '-' + String(d.m).padStart(2,'0') + '-' + String(d.d).padStart(2,'0') : null; }
  const t = String(v).trim(); let m = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4}|\d{2})\b/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3], mo = +m[2], d = +m[1]; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null; return y + '-' + String(mo).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : null;
}
// Coma decimal: "1.234,56" / "40,2360" (BCU, 4 decimales) / "1,000000". Una sola coma seguida de exactamente 3 cifras
// ("1,234") se sigue leyendo como separador de miles.
function cuyNumXls(v){ if (typeof v === 'number') return v; const t = String(v == null ? '' : v).trim().replace(/\s/g,''); if (!t) return null;
  const x = +(/^[^,]*,(\d{1,2}|\d{4,})$/.test(t) ? t.replace(/\./g,'').replace(',','.') : t.replace(/,/g,'')); return isNaN(x) ? null : x; }
function cuyTipoAuto(f){
  const cl = fold(f.clasificacion), co = fold(f.concepto), au = fold(f.auxiliar);
  if (au.includes('saldo inicio') || co.includes('saldo inicial')) return 'saldo_inicial';
  if (cl.includes('gastos bancarios') || /^comision/.test(co)) return 'gasto_bancario';
  if (cl.includes('entre bancos') || co.includes('cambio moneda')) return 'entre_cuentas';
  if (f.importe > 0) return 'ingreso';
  return (f.proveedor || f.proveedor_cod) ? 'pago' : 'otro';
}
// Números del extracto del banco: "-7,320.00", "$2,765.00" (coma de miles y punto decimal), o "1.234,56"
function cuyNumBanco(v){
  if (typeof v === 'number') return v; let t = String(v == null ? '' : v).replace(/[$\s]/g, ''); if (!t) return null;
  const c = t.lastIndexOf(','), d = t.lastIndexOf('.');
  if (c >= 0 && d >= 0) t = c > d ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  else if (c >= 0) t = /,\d{3}$/.test(t) ? t.replace(/,/g, '') : t.replace(',', '.');
  const x = +t; return isNaN(x) ? null : x;
}
// Extracto tal cual lo baja el home banking: Fecha | Referencia | Tipo Movimiento | Descripción | Débito | Crédito | Saldo,
// con la cuenta y la moneda arriba. Devuelve los movimientos (importe negativo = débito) con .meta = { fuente, moneda, cuenta, saldoFinal }.
function cuyLeerHojaBanco(rows){
  const hi = rows.slice(0, 30).findIndex(r => r && r.some(c => fold(c).trim() === 'fecha') && r.some(c => /^(debito|credito)$/.test(fold(c).trim())));
  if (hi < 0) return null;
  const H = rows[hi].map(c => fold(c).trim()), ix = n => H.indexOf(n), g = (r, n) => { const i = ix(n); return i < 0 ? null : r[i]; };
  let moneda = null, cuenta = null;
  for (let i = 0; i < hi; i++) { const r = rows[i] || [], j = r.findIndex(c => fold(c).trim() === 'moneda'), k = r.findIndex(c => fold(c).trim() === 'cuenta');
    if (j >= 0 && k >= 0 && rows[i + 1]) { moneda = String(rows[i + 1][j] || '').trim().toUpperCase().replace('$U', 'UYU') || null; cuenta = String(rows[i + 1][k] || '').trim() || null; break; } }
  const out = [];

    if (!r) continue;

    const deb = cuyNumBanco(g(r, 'debito')), cre = cuyNumBanco(g(r, 'credito'));

    const ref = String(g(r, 'referencia') == null ? '' : g(r, 'referencia')).trim(), tipo = String(g(r, 'tipo movimiento') || '').trim(), desc = String(g(r, 'descripcion') || '').trim();

      concepto: (tipo + (desc ? ' · ' + desc : '')) || 'Movimiento', tc: null, comentarios: ref ? 'Ref. banco ' + ref : null, origen: 'import', _ref: ref };
    f.tipo = cuyTipoAuto(f); out.push(f);

  out.meta = { fuente: 'banco', moneda, cuenta, saldoFinal: saldos.length ? saldos[0] : null };   // el extracto viene del más nuevo al más viejo

// Los cambios de moneda aparecen en las dos cuentas con la misma fecha y referencia y signo opuesto: se marcan como "Cambio Moneda" (entre cuentas)
function cuyParearCambios(hojas){

  let n = 0;
  Object.values(por).forEach(g => {
    const neg = g.find(x => x.f.importe < 0), pos = g.find(x => x.f.importe > 0 && x.hi !== (neg && neg.hi) && x.mon !== (neg && neg.mon));
    if (neg && pos) { [neg, pos].forEach(x => { x.f.concepto = 'Cambio Moneda · ' + x.f._ref; x.f.clasificacion = 'ENTRE BANCOS'; x.f.tipo = 'entre_cuentas'; }); n++; }
  });

// Importa una serie diaria desde Excel / CSV (DGI interbancarias, BNA u otra): detecta la columna de fechas y deja
// elegir la columna del valor y a qué cotización va. El formato del archivo de la DGI no se pudo ver desde el desarrollo:
// por eso no se asume ninguna columna fija — se elige mirando los encabezados y la vista previa.
// En un archivo con varias monedas (BCU), la que se propone importar: el dólar billete interbancario
function cuyMonDef(h){ return h.mvals.find(v => /USA.*BILLETE/i.test(v)) || h.mvals.find(v => /D[OÓ]L|USD|U\.?S\.?A/i.test(v)) || h.mvals[0]; }
function cuyCotImportar(){
  if (!window.XLSX) { toast('No cargó la librería de Excel'); return; }
  abrirModal('Importar cotizaciones',
    '<p style="margin:0 0 10px;font-size:12.5px;color:#5f5c52;line-height:1.5">Subí el Excel o CSV con una fila por día (ej. el de cotizaciones interbancarias del BCU o de la DGI). Elegí la columna con el valor y a qué cotización corresponde. Se guarda por fecha; no se pisan las cargadas a mano salvo que lo tildes.</p>'
    + '<div class="field"><label>Archivo</label><input type="file" id="ci-file" accept=".xlsx,.xls,.csv,.ods"></div><div id="ci-cfg"></div><div class="err" id="ci-err"></div>',
    '<button class="btn ghost" id="ci-no">Cancelar</button><button class="btn" id="ci-ok" disabled>Importar</button>', 'wide');
  let hojas = [], nombre = '', leerSel = null;
  const $ = i => document.getElementById(i);
  $('ci-no').addEventListener('click', cerrarModal);
  const leer = (ws) => {
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null }), ncol = Math.max(0, ...rows.map(r => (r || []).length));
    // columna de fechas = la que más celdas con fecha tiene
    let fc = -1, best = 0;
    for (let c = 0; c < ncol; c++) { const n = rows.filter(r => r && cuyFechaXls(r[c])).length; if (n > best) { best = n; fc = c; } }
    if (fc < 0 || best < 2) return null;
    const datos = rows.filter(r => r && cuyFechaXls(r[fc])), i0 = rows.indexOf(datos[0]);
    const cols = [];
    for (let c = 0; c < ncol; c++) { if (c === fc) continue;
      const nums = datos.filter(r => { const v = cuyNumXls(r[c]); return v != null && v > 0; }).length; if (nums < datos.length * 0.5) continue;
      let tit = ''; for (let k = i0 - 1; k >= 0 && k >= i0 - 6; k--) { const t = rows[k] && rows[k][c]; if (t != null && String(t).trim() && cuyNumXls(t) == null) { tit = String(t).trim() + (tit ? ' · ' + tit : ''); } }
      cols.push({ c, tit: tit || 'Columna ' + XLSX.utils.encode_col(c), ej: cuyNumXls(datos[datos.length - 1][c]) }); }
    // Archivos con varias monedas en la misma hoja (ej. BCU: DLS. USA BILLETE, PESO ARG.BILLETE, REAL BILLETE):
    // columna de texto con pocos valores distintos → se elige cuál importar (si no, la última moneda pisa a las demás)
    let mc = -1, mvals = [];
    for (let c = 0; c < ncol && mc < 0; c++) { if (c === fc) continue;
      const vs = datos.map(r => r[c]).filter(v => typeof v === 'string' && v.trim() && cuyNumXls(v) == null).map(v => v.trim());
      const u = [...new Set(vs)]; if (vs.length >= datos.length * 0.8 && u.length >= 2 && u.length <= 30) { mc = c; mvals = u; } }
    if (mc >= 0) { const md = cuyMonDef({ mvals }), ref = datos.filter(r => String(r[mc]).trim() === md); if (ref.length) cols.forEach(x => { x.ej = cuyNumXls(ref[ref.length - 1][x.c]); }); }
    return { fc, datos, cols, mc, mvals };
  };
  $('ci-file').addEventListener('change', async e => {
    const f = e.target.files[0]; $('ci-err').textContent = ''; hojas = []; $('ci-ok').disabled = true; if (!f) return; nombre = f.name;
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type:'array' });
      wb.SheetNames.forEach(n => { const h = leer(wb.Sheets[n]); if (h && h.cols.length) hojas.push(Object.assign({ n }, h)); });
      if (!hojas.length) { $('ci-err').textContent = 'No encontré una columna de fechas con valores numéricos al lado.'; return; }
      const selMon = h => h.mc < 0 ? '' : h.mvals.map(v => '<option' + (v === cuyMonDef(h) ? ' selected' : '') + '>' + esc(v) + '</option>').join('');
      const pintaMon = h => { $('ci-monf').style.display = h.mc < 0 ? 'none' : ''; $('ci-mon').innerHTML = selMon(h); };
      const fteDef = () => $('ci-dest').value === 'ars_usd' ? 'BNA divisa' : (/dgi|interbanc/i.test(nombre) ? 'DGI interbancario' : (cuyHojaSel().mc >= 0 ? 'BCU interbancario · ' + $('ci-mon').value : nombre));
      const pinta = () => {
        const h = cuyHojaSel(), col = h.cols.find(x => x.c === +$('ci-col').value) || h.cols[0], datos = cuyFilasSel(h);
        if (!$('ci-fte').dataset.tocado) $('ci-fte').value = fteDef();
        const prev = datos.slice(-6).map(r => '<tr><td>' + fmtFecha(cuyFechaXls(r[h.fc])) + '</td><td class="num">' + esc(cuyNumXls(r[col.c]) == null ? '—' : fmtTC(cuyNumXls(r[col.c]))) + '</td></tr>').join('');
        const fs = datos.map(r => cuyFechaXls(r[h.fc])).sort();
        $('ci-prev').innerHTML = datos.length + ' filas · ' + fmtFecha(fs[0]) + ' a ' + fmtFecha(fs[fs.length - 1]) + '<table class="grid" style="margin-top:6px"><thead><tr><th>Fecha</th><th>Valor</th></tr></thead><tbody>' + prev + '</tbody></table>';
      };
      const selCols = h => h.cols.map(x => '<option value="' + x.c + '">' + esc(x.tit) + ' (ej. ' + esc(x.ej == null ? '—' : fmtTC(x.ej)) + ')</option>').join('');
      $('ci-cfg').innerHTML = '<div class="frow c2">'
        + '<div class="field"><label>Hoja</label><select id="ci-hoja">' + hojas.map((h, i) => '<option value="' + i + '">' + esc(h.n) + '</option>').join('') + '</select></div>'
        + '<div class="field"><label>Columna del valor</label><select id="ci-col">' + selCols(hojas[0]) + '</select></div></div>'
        + '<div class="field" id="ci-monf" style="margin-top:10px"><label>Moneda (el archivo trae varias: se importa solo esta)</label><select id="ci-mon"></select></div>'
        + '<div class="frow c3" style="margin-top:10px"><div class="field"><label>Es la cotización</label><select id="ci-dest"><option value="uyu_usd">UYU por USD</option><option value="ars_usd">ARS por USD</option></select></div>'
        + '<div class="field"><label>Fuente (queda anotada)</label><input id="ci-fte" value="' + esc(/dgi|interbanc/i.test(nombre) ? 'DGI interbancario' : nombre) + '"></div>'
        + '<div class="field"><label class="chk-lbl" style="text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink)"><input type="checkbox" id="ci-pisar" style="width:auto"> Pisar las cargadas a mano</label></div></div>'
        + '<div class="box" id="ci-prev"></div>'
        + '<div class="muted" style="margin-top:8px">Revisá en la vista previa que la columna sea la que querés (comprador / vendedor, billete / fondo). Las fechas son las del archivo; el criterio "día hábil anterior" se aplica después, al usar la cotización.</div>';
      const cuyHojaSel = () => hojas[+$('ci-hoja').value || 0];
      const cuyFilasSel = h => h.mc < 0 ? h.datos : h.datos.filter(r => String(r[h.mc] == null ? '' : r[h.mc]).trim() === $('ci-mon').value);
      leerSel = () => ({ h: cuyHojaSel(), datos: cuyFilasSel(cuyHojaSel()) });
      $('ci-hoja').addEventListener('change', () => { const h = cuyHojaSel(); $('ci-col').innerHTML = selCols(h); pintaMon(h); pinta(); });
      $('ci-col').addEventListener('change', pinta);
      $('ci-mon').addEventListener('change', pinta);
      $('ci-dest').addEventListener('change', pinta);
      $('ci-fte').addEventListener('input', () => { $('ci-fte').dataset.tocado = '1'; });
      pintaMon(hojas[0]); pinta(); $('ci-ok').disabled = false;
    } catch (ex) { $('ci-err').textContent = 'No pude leer el archivo: ' + (ex.message || ex); }
  });
  $('ci-ok').addEventListener('click', async () => {
    const { h, datos } = leerSel(), c = +$('ci-col').value, campo = $('ci-dest').value, fcampo = campo === 'ars_usd' ? 'fuente_ars' : 'fuente_uyu';
    const fte = $('ci-fte').value.trim() || 'archivo', pisar = $('ci-pisar').checked;
    const por = {}; datos.forEach(r => { const f = cuyFechaXls(r[h.fc]), v = cuyNumXls(r[c]); if (f && v > 0) por[f] = v; });
    let manual = 0; const filas = Object.entries(por).filter(([f]) => { const x = CUY.cots.find(k => k.fecha === f); if (x && x[fcampo] === 'manual' && cuyNum(x[campo]) != null && !pisar) { manual++; return false; } return true; })
      .map(([fecha, v]) => ({ fecha, [campo]: v, [fcampo]: fte }));
    if (!filas.length) { $('ci-err').textContent = 'No hay nada para importar' + (manual ? ' (' + manual + ' fechas ya cargadas a mano)' : '') + '.'; return; }
    $('ci-ok').disabled = true;
    try {
      for (let i = 0; i < filas.length; i += 500) {
        const { data, error } = await sb.from(CUY_COT_T).upsert(filas.slice(i, i + 500), { onConflict:'fecha' }).select();
        if (error) throw error; if (!data || !data.length) throw new Error('sin permiso de edición.');
        data.forEach(d => { const k = CUY.cots.findIndex(x => x.fecha === d.fecha); if (k >= 0) CUY.cots[k] = d; else CUY.cots.push(d); });
      }
      CUY.cots.sort((a,b) => String(a.fecha).localeCompare(String(b.fecha)));
      cerrarModal(); toast(filas.length + ' cotizaciones importadas' + (manual ? ' · ' + manual + ' cargadas a mano no se tocaron' : '')); cuyRender();
    } catch (ex) { $('ci-err').textContent = 'Error: ' + (ex.message || ex); $('ci-ok').disabled = false; }
  });
}

    + '</div><div class="err" id="tf-err"></div>',

/* ---------- Plan de cuentas (clave → código de cuenta Tango) ---------- */
function cuyPlanClaves(){
  const k = new Map(), add = (clave, grupo, desc, uso, eerr) => { const x = k.get(clave) || { clave, grupo, desc, uso:0, eerr:!!eerr }; x.uso += uso || 0; k.set(clave, x); };
  add('MONEDA:ARS','Moneda','Pesos argentinos (código de moneda en Tango)'); add('MONEDA:USD','Moneda','Dólares (código de moneda en Tango)');
  add('PROVEEDORES','Fijas','Proveedores (deuda por facturas / pagos)'); add('IVA_COMPRAS','Fijas','IVA compras (crédito fiscal)');
  add('DIF_CAMBIO_POS','Fijas','Diferencia de cambio positiva (ganancia)', 0, true); add('DIF_CAMBIO_NEG','Fijas','Diferencia de cambio negativa (pérdida)', 0, true);
  add('CLASIF:GASTOS BANCARIOS','Gasto / contrapartida','Gastos bancarios (comisiones)', 0, true);
  CUY_CTAS.forEach(c => add('CUENTA:' + c.n, 'Banco / caja', c.n + ' (' + c.mon + ')', CUY.movs.filter(m => m.cuenta === c.n).length));
  CUY.lista.forEach(r => add(cuyClaveRubro(r.rubro), 'Rubro → aux. 02 EERR', r.rubro || '(sin rubro)', 1, true));
  CUY.movs.filter(m => m.tipo !== 'saldo_inicial').forEach(m => { const c = cuyContraMov(m); if (c !== 'PROVEEDORES' && c !== 'CAMBIO' && !c.startsWith('COD:')) add(c, 'Gasto / contrapartida', c.slice(7), 1, true); });
  Object.keys(CUY.plan).forEach(c => { if (!k.has(c) && !c.startsWith('CONFIG:')) add(c, 'Otras (guardadas)', c); });
  return [...k.values()];
}
/* ---------- Proveedores de Uruguay (diccionario: sql/2026-10_contabilidad_uy_proveedores.sql) ----------
   Código corto (el de Comprobantes), razón social, RUT, moneda, datos bancarios y la cuenta / rubro / proyecto que
   suele llevar. Al cargar un comprobante, escribir el nombre, el código o el RUT completa lo demás. */
const CUY_PROV_T = 'adminfin_cuy_proveedores';
const cuyRutNorm = t => String(t == null ? '' : t).replace(/\.0+$/, '').replace(/\D/g, '');
function cuyProvBuscar(txt){
  const t = fold(String(txt || '').trim()), rut = cuyRutNorm(txt); if (!t) return null;
  return CUY.provs.find(p => fold(p.codigo) === t) || CUY.provs.find(p => fold(p.nombre) === t)
    || (rut.length >= 8 ? CUY.provs.find(p => cuyRutNorm(p.rut) === rut) : null) || null;
}
function cuyRenderProv(){
  const ta = document.getElementById('topActions');
  ta.innerHTML = SP.editar && !CUY.provErr ? '<button class="btn ghost" id="pv-imp">' + ICO.upload + 'Importar del Excel</button><button class="btn" id="pv-nuevo">' + ICO.plus + 'Nuevo proveedor</button>' : '';
  if (CUY.provErr) { $main.innerHTML = cuyTabs() + '<div class="card"><div class="empty">No pude leer los proveedores: ' + esc(CUY.provErr) + '<br><span class="muted">Falta correr sql/2026-10_contabilidad_uy_proveedores.sql en Supabase.</span></div></div>'; cuyTabsEventos(); return; }
  const usos = c => CUY.lista.filter(r => fold(r.proveedor_cod || '') === fold(c)).length;
  // Comprobantes cuyo proveedor no está en el diccionario (o sin código): para dejarlo consistente
  const fuera = CUY.lista.filter(r => !String(r.proveedor_cod || '').trim() || !CUY.provs.some(p => fold(p.codigo) === fold(r.proveedor_cod)));
  const cols = [
    { id:'cod', t:'Código', s:p => p.codigo, td:p => '<b>' + esc(p.codigo) + '</b>' },
    { id:'nom', t:'Razón social', s:p => p.nombre || '', td:p => esc(p.nombre || '') },

function cuyProvImportar(){
  if (!window.XLSX) { toast('No cargó la librería de Excel'); return; }
  abrirModal('Importar proveedores',
    '<p style="margin:0 0 10px;font-size:12.5px;color:#5f5c52">Subí el Excel con la hoja de proveedores (columnas PROVEEDOR, CODIGO, CUIT / RUT, BANCO, SUCURSAL, MONEDA, CUENTA). Se guarda por código: los que ya existen se actualizan.</p>'
    + '<div class="field"><label>Archivo</label><input type="file" id="pi-file" accept=".xlsx,.xls"></div><div class="box" id="pi-prev"></div><div class="err" id="pi-err"></div>',
    '<button class="btn ghost" id="pi-no">Cancelar</button><button class="btn" id="pi-ok" disabled>Importar</button>', 'wide');
  const $ = i => document.getElementById(i); let filas = [];
  $('pi-no').addEventListener('click', cerrarModal);
  $('pi-file').addEventListener('change', async e => {
    const f = e.target.files[0]; filas = []; $('pi-ok').disabled = true; $('pi-err').textContent = ''; if (!f) return;
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type:'array' });

        const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:null });
        const hi = rows.findIndex(r => r && r.some(x => fold(String(x || '')) === 'codigo') && r.some(x => fold(String(x || '')) === 'proveedor')); if (hi < 0) continue;
        const H = rows[hi].map(x => fold(String(x || ''))), col = (...ks) => H.findIndex(h => ks.some(k => h === k || h.startsWith(k)));
        const c = { nom: col('proveedor'), cod: col('codigo'), rut: col('cuit / rut', 'rut', 'cuit'), ban: col('banco'), suc: col('sucursal'), mon: col('moneda'), cta: col('cuenta') };
        rows.slice(hi + 1).forEach(r => { const cod = String(r[c.cod] || '').trim().toUpperCase(), nom = String(r[c.nom] || '').trim(); if (!cod || !nom) return;
          const g = k => c[k] >= 0 && r[c[k]] != null && String(r[c[k]]).trim() !== '' ? String(r[c[k]]).trim().replace(/\.0+$/, '') : null, rut = cuyRutNorm(g('rut'));

        if (filas.length) break;
      }
      if (!filas.length) { $('pi-err').textContent = 'No encontré una hoja con columnas PROVEEDOR y CODIGO.'; return; }
      const nuevos = filas.filter(x => !CUY.provs.some(p => p.codigo === x.codigo)).length;
      $('pi-prev').innerHTML = filas.length + ' proveedores (' + nuevos + ' nuevos, ' + (filas.length - nuevos) + ' se actualizan): ' + filas.map(x => '<b>' + esc(x.codigo) + '</b>').join(', ');
      $('pi-ok').disabled = false;
    } catch (ex) { $('pi-err').textContent = 'No pude leer el archivo: ' + (ex.message || ex); }
  });
  $('pi-ok').addEventListener('click', async () => {
    $('pi-ok').disabled = true;
    try { const { data, error } = await sb.from(CUY_PROV_T).upsert(filas, { onConflict:'codigo' }).select(); if (error) throw error;
      (data || []).forEach(d => { const k = CUY.provs.findIndex(p => p.codigo === d.codigo); if (k >= 0) CUY.provs[k] = d; else CUY.provs.push(d); });

    catch (e) { $('pi-err').textContent = 'Error: ' + (e.message || e); $('pi-ok').disabled = false; }
  });

  const esRubro = x => x.clave.startsWith('RUBRO:');
  const cuyPlanOk = x => esRubro(x) ? !!(cuyPlan(x.clave).aux_eerr || cuyAuxEerr(x.desc)) : !!cuyPlan(x.clave).codigo;
  const inp = (x, campo, ph) => (esRubro(x) && campo !== 'aux_eerr') ? '<span class="muted">' + (campo === 'codigo' ? 'en cada comprobante' : '—') + '</span>' : SP.editar ? '<input class="tc-in" style="width:' + (campo === 'nombre' ? 220 : 110) + 'px;text-align:left" data-plan="' + esc(x.clave) + '" data-campo="' + campo + '" value="' + esc(cuyPlan(x.clave)[campo] || '') + '" placeholder="' + esc(ph || '') + '"'
      + (lista[campo] && !(campo === 'codigo' && x.clave.startsWith('MONEDA:')) ? ' list="' + lista[campo] + '"' : '') + '>' : esc(cuyPlan(x.clave)[campo] || '—');
  const enDic = x => { const p = cuyPlan(x.clave);
    if (x.clave.startsWith('RUBRO:')) { const e = cuyDicEerr(p.aux_eerr || cuyAuxEerr(x.desc)); return e ? '<span style="color:#4f8a53">✓ EERR ' + esc(e.cod + ' · ' + e.desc) + '</span>' : '<span class="warn">elegí el aux. 02 EERR</span>'; }
    if (x.clave.startsWith('MONEDA:') || !p.codigo || !CUY.dic.cuentas.length) return '<span class="muted">—</span>';
    const c = cuyDicCta(p.codigo), e = p.aux_eerr ? cuyDicEerr(p.aux_eerr) : null;
    return (c ? '<span style="color:#4f8a53">✓ ' + esc(c.desc) + '</span>' + (String(c.habil || '').toLowerCase() === 'no' ? ' <span class="warn">(no habilitada)</span>' : '') : '<span class="warn">⚠ no está en el diccionario</span>')
      + (p.aux_eerr ? '<div class="muted">EERR: ' + (e ? esc(e.desc) : '<span class="warn">⚠ ' + esc(p.aux_eerr) + ' no existe</span>') + '</div>' : ''); };
  const cols = [
    { id:'grupo', t:'Grupo', v:x => x.grupo, td:x => esc(x.grupo) },
    { id:'clave', t:'Concepto', s:x => x.clave, td:x => '<strong>' + esc(x.desc) + '</strong><div class="muted">' + esc(x.clave) + '</div>' },
    { id:'uso', t:'Usos', s:x => x.uso, cls:'num', td:x => x.uso || '<span class="muted">—</span>' },
    { id:'est', t:'Estado', v:x => cuyPlanOk(x) ? 'Ok' : 'Falta', td:x => cuyPlanOk(x) ? '<span class="badge b-verde">ok</span>' : '<span class="badge b-ambar">' + (esRubro(x) ? 'sin aux. EERR' : 'sin código') + '</span>' },
    { id:'cod', t:'Código Tango', td:x => inp(x, 'codigo', x.clave.startsWith('MONEDA:') ? 'código moneda' : 'código cuenta') },
    { id:'nom', t:'Nombre de la cuenta', td:x => inp(x, 'nombre', '') },
    { id:'eerr', t:'Aux. 02 EERR', td:x => !x.eerr ? '<span class="muted">—</span>' : inp(x, 'aux_eerr', esRubro(x) && cuyAuxEerr(x.desc) ? cuyAuxEerr(x.desc) + ' (diccionario)' : 'código')
        + (esRubro(x) && cuyAuxEerr(x.desc) ? '<div class="muted">' + esc((cuyDicEerr(cuyAuxEerr(x.desc)) || {}).desc || '') + '</div>' : '') },
    { id:'dic', t:'Diccionario', td:enDic },
  ];
  const dls = '<datalist id="dl-dic-cta">' + CUY.dic.cuentas.filter(c => String(c.habil || '').toLowerCase() !== 'no').map(c => '<option value="' + esc(c.cod) + '">' + esc(c.cod + ' - ' + c.desc) + '</option>').join('') + '</datalist>'
    + '<datalist id="dl-dic-eerr">' + CUY.dic.eerr.map(c => '<option value="' + esc(c.cod) + '">' + esc(c.cod + ' - ' + c.desc) + '</option>').join('') + '</datalist>';
  TABLAS[ns] = { cols, base: () => filas };
  const f = tablaFiltrar(ns, cols, filas, x => x.clave + ' ' + x.desc + ' ' + (cuyPlan(x.clave).codigo || '') + ' ' + (cuyPlan(x.clave).nombre || ''));
  const sin = filas.filter(x => !cuyPlanOk(x)).length;
  $main.innerHTML = cuyTabs()
    + '<div class="meta-bar">Cuentas fijas y de los movimientos de banco / caja (Proveedores, bancos, cajas, gastos bancarios, diferencia de cambio, transferencias). La cuenta de cada <b>factura</b> se define en la solapa <b>Comprobantes</b>; acá los rubros solo llevan su aux. 02 EERR. <b>' + sin + ' pendientes.</b> '
    + 'Es el mismo plan de cuentas Tango que Argentina: en Código escribí el número o parte del nombre y elegí del diccionario de Compras'
    + (CUY.dicErr ? ' — <span class="warn">no pude leer el diccionario (' + esc(CUY.dicErr) + '): se puede cargar igual a mano, sin buscador ni validación</span>' : ' (' + CUY.dic.cuentas.length + ' cuentas)') + '.</div>' + dls
    + '<div class="card">' + cardH('Plan de cuentas UY', 'Se guarda al salir de cada casilla (o con Enter). En amarillo: sin código.')
    + tablaHerramientas(ns, 'Buscar concepto o código…') + tablaHtml(ns, cols, f, '', x => cuyPlanOk(x) ? '' : 'revisar') + '</div>';
  tablaEventos(); cuyTabsEventos();
  $main.querySelectorAll('[data-plan]').forEach(i => {
    i.addEventListener('keydown', e => { if (e.key === 'Enter') i.blur(); });
    i.addEventListener('change', async () => {
      const v = i.value.trim() || null, cambios = { [i.dataset.campo]: v };
      if (i.dataset.campo === 'codigo' && v) { const c = cuyDicCta(v); if (c) cambios.nombre = c.desc; }   // el nombre sale del diccionario
      try { await cuyPlanGuardar(i.dataset.plan, cambios); toast('Guardado'); cuyRender(); }
      catch (e) { toast('No se guardó: ' + (e.message || e)); }
    });
  });
}

async function salir(){
  await sb.auth.signOut();
  window.location.reload();
}
document.getElementById('btn-salir').addEventListener('click', salir);

async function iniciar(){
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { vistaLogin(); return; }

  const uid = session.user.id;
  const [{ data: perfil, error: e1 }, { data: sectores, error: e2 }] = await Promise.all([
    sb.from('perfiles').select('*').eq('id', uid).maybeSingle(),
    sb.from('perfiles_sector').select('sector, cargo, permisos').eq('perfil_id', uid),
  ]);

  if (e1 || e2) {
    pantallaAcceso('Error cargando tu perfil: ' + esc((e1 || e2).message), 'Reintentar', () => window.location.reload());
    return;
  }
  if (!perfil || !perfil.activo) { vistaPendiente(perfil); return; }

  const propio = (sectores || []).find(s => s.sector === SECTOR);
  if (!perfil.es_direccion && !propio) { vistaSinSector(perfil); return; }

  vistaApp(perfil, perfil.es_direccion ? 'dirección' : (propio && propio.cargo), propio);
}

iniciar();
</script>
